# PORTABLE EXAMPLE ONLY. Adapt to each consumer's actual acceptance and
# trusted-base policy. The Skillz skill never installs or activates this file.
name: Classified PR verification

on:
  pull_request:
    # Required when draft→ready happens without changing the HEAD SHA.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true # Superseded PRs only, never releases.

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      route: ${{ steps.impact.outputs.route }}
      run_targeted: ${{ steps.impact.outputs.run_targeted }}
      run_full: ${{ steps.impact.outputs.run_full }}
    steps:
      - name: Checkout untrusted PR as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout trusted base classifier and consumer impact policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Classify exact changed files and draft readiness
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          # Both exact objects are already available in local checkouts.
          # Fetch base from the trusted checkout, not the private origin:
          # persist-credentials:false intentionally removes network auth.
          git -C work fetch --no-tags ../trusted "$BASE_SHA"
          # Consumer must copy/review bundled classifier and policy at
          # ci/classify_change.py and ci/impact-policy.json on the base.
          test -f trusted/ci/classify_change.py
          test -f trusted/ci/impact-policy.json
          case "$IS_DRAFT" in
            true) STAGE=draft ;;
            false) STAGE=candidate ;;
            *) echo "PR readiness unknown" >&2; exit 2 ;;
          esac
          python3 trusted/ci/classify_change.py \
            --repo work --base "$BASE_SHA" --head "$HEAD_SHA" \
            --policy trusted/ci/impact-policy.json \
            --stage "$STAGE" --github-output "$GITHUB_OUTPUT"
          git -C work diff --check "$BASE_SHA" "$HEAD_SHA"

  targeted-qualification:
    # Replace with actual consumer-focused checks before enabling this example.
    # This does not supersede existing independently required branch checks.
    needs: classify
    if: ${{ needs.classify.outputs.run_targeted == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run real consumer targeted checks
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/targeted-qualification.sh
          bash ci/targeted-qualification.sh

  full-qualification:
    # Wire real consumer integration/native/proof/security acceptance.
    # Missing integration script fails closed, never an invented success.
    needs: classify
    if: ${{ needs.classify.outputs.run_full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run real consumer full acceptance
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/full-qualification.sh
          bash ci/full-qualification.sh

  ci-policy-gate:
    # This stable check is the candidate branch-protected decision signal.
    # Preserve other independently required security/architecture checks.
    name: CI policy gate
    needs: [classify, targeted-qualification, full-qualification]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      WANT_TARGETED: ${{ needs.classify.outputs.run_targeted }}
      TARGETED_RESULT: ${{ needs.targeted-qualification.result }}
      WANT_FULL: ${{ needs.classify.outputs.run_full }}
      FULL_RESULT: ${{ needs.full-qualification.result }}
    steps:
      - name: Reject failed classification or skipped selected work
        shell: bash
        run: |
          python3 - <<'PY'
          import os, sys
          if os.environ["CLASSIFY_RESULT"] != "success":
              sys.exit("classification failed or skipped")
          selected = 0
          for want, result, label in (
              ("WANT_TARGETED", "TARGETED_RESULT", "targeted"),
              ("WANT_FULL", "FULL_RESULT", "full"),
          ):
              selection, observed = os.environ[want], os.environ[result]
              if selection not in ("true", "false"):
                  sys.exit(f"{label}: missing or invalid classification")
              if selection == "true":
                  selected += 1
                  if observed != "success":
                      sys.exit(f"{label}: selected but status={observed!r}")
              elif observed != "skipped":
                  sys.exit(f"{label}: unexpected status={observed!r}")
          if selected != 1:
              sys.exit("exactly one substantive route is required")
          print("Selected CI work actually completed on this PR revision")
          PY
