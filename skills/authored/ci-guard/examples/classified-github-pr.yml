# PORTABLE REFERENCE, NOT AN INSTALLED WORKFLOW.
# Consumer must copy the trusted planner, graph and execution policies, and real verify_*.sh
# runners to ci/ on base. Missing scripts FAIL; no success placeholders.
# Keep separate required release/production, secrets and signed artifact checks.
# Drafts skip every expensive job before runner setup; one minimal status gate
# emits DRAFT_DEFERRED_NOT_QUALIFIED without a checkout, planner or test.
# On ready_for_review, fresh exact-HEAD qualification is mandatory.
# Before branch-protection migration, prove stale draft-gate success cannot
# satisfy required ready-state checks for the same commit SHA.
name: Dependency-aware PR qualification
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
permissions:
  contents: read
concurrency:
  group: ci-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  classify:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan_json: ${{ steps.plan.outputs.plan_json }}
    steps:
      - name: Checkout untrusted candidate data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - name: Checkout trusted base policy and planner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - id: plan
        name: Plan full dependency closure from exact merge-base/head
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          git -C work fetch --no-tags ../trusted "$BASE_SHA"
          test -f trusted/ci/ci_plan.py
          test -f trusted/ci/impact-graph.json
          test -f trusted/ci/exec-policy.json
          case "$IS_DRAFT" in
            true) STAGE=draft ;;
            false) STAGE=candidate ;;
            *) exit 2 ;;
          esac
          python3 trusted/ci/ci_plan.py plan \
            --repo work --policy trusted/ci/impact-graph.json \
            --executor trusted/ci/exec-policy.json \
            --base "$BASE_SHA" --head "$HEAD_SHA" --stage "$STAGE" \
            --github-output "$GITHUB_OUTPUT"

  docs:
    needs: classify
    if: ${{ !github.event.pull_request.draft && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan_json).groups.docs == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      receipt: ${{ steps.proof.outputs.receipt_json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - id: proof
        name: Execute and record every docs obligation from trusted command map
        shell: bash
        env:
          PLAN_JSON: ${{ needs.classify.outputs.plan_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PLAN_JSON" > "$RUNNER_TEMP/ci-plan.json"
          # The trusted executor runs ALL group obligations in dependency order;
          # missing/failed/timeout commands produce no successful group receipt.
          python3 trusted/ci/ci_plan.py execute \
            --plan "$RUNNER_TEMP/ci-plan.json" \
            --policy trusted/ci/impact-graph.json \
            --executor trusted/ci/exec-policy.json \
            --workdir work --repo work --group docs \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

  rust:
    needs: classify
    if: ${{ !github.event.pull_request.draft && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan_json).groups.rust == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      receipt: ${{ steps.proof.outputs.receipt_json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - id: proof
        name: Execute and record every rust obligation from trusted command map
        shell: bash
        env:
          PLAN_JSON: ${{ needs.classify.outputs.plan_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PLAN_JSON" > "$RUNNER_TEMP/ci-plan.json"
          # The trusted executor runs ALL group obligations in dependency order;
          # missing/failed/timeout commands produce no successful group receipt.
          python3 trusted/ci/ci_plan.py execute \
            --plan "$RUNNER_TEMP/ci-plan.json" \
            --policy trusted/ci/impact-graph.json \
            --executor trusted/ci/exec-policy.json \
            --workdir work --repo work --group rust \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

  model:
    needs: [classify, rust]
    if: ${{ always() && !github.event.pull_request.draft && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan_json).groups.model == true && needs.rust.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      receipt: ${{ steps.proof.outputs.receipt_json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - id: proof
        name: Execute and record every model obligation from trusted command map
        shell: bash
        env:
          PLAN_JSON: ${{ needs.classify.outputs.plan_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PLAN_JSON" > "$RUNNER_TEMP/ci-plan.json"
          # The trusted executor runs ALL group obligations in dependency order;
          # missing/failed/timeout commands produce no successful group receipt.
          python3 trusted/ci/ci_plan.py execute \
            --plan "$RUNNER_TEMP/ci-plan.json" \
            --policy trusted/ci/impact-graph.json \
            --executor trusted/ci/exec-policy.json \
            --workdir work --repo work --group model \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

  trust:
    needs: classify
    if: ${{ !github.event.pull_request.draft && needs.classify.result == 'success' && fromJSON(needs.classify.outputs.plan_json).groups.trust == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      receipt: ${{ steps.proof.outputs.receipt_json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - id: proof
        name: Execute and record every trust obligation from trusted command map
        shell: bash
        env:
          PLAN_JSON: ${{ needs.classify.outputs.plan_json }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PLAN_JSON" > "$RUNNER_TEMP/ci-plan.json"
          # The trusted executor runs ALL group obligations in dependency order;
          # missing/failed/timeout commands produce no successful group receipt.
          python3 trusted/ci/ci_plan.py execute \
            --plan "$RUNNER_TEMP/ci-plan.json" \
            --policy trusted/ci/impact-graph.json \
            --executor trusted/ci/exec-policy.json \
            --workdir work --repo work --group trust \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"

  ci-policy-gate:
    name: CI policy gate # Stable branch-protection status. Never path-skip.
    needs: [classify, docs, rust, model, trust]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Draft deferred (not merge qualified)
        if: ${{ github.event.pull_request.draft }}
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          test "$IS_DRAFT" = true
          echo "DRAFT_DEFERRED_NOT_QUALIFIED: ready-for-review needs fresh checks"
      - name: Fail if classification itself did not finish
        if: ${{ !github.event.pull_request.draft }}
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
        run: test "$CLASSIFY_RESULT" = success
      - if: ${{ !github.event.pull_request.draft }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - if: ${{ !github.event.pull_request.draft }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Qualify every selected obligation against recomputed plan
        if: ${{ !github.event.pull_request.draft }}
        shell: bash
        env:
          PLAN_JSON: ${{ needs.classify.outputs.plan_json }}
          DOCS_RESULT: ${{ needs.docs.result }}
          DOCS_RECEIPT: ${{ needs.docs.outputs.receipt }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_RECEIPT: ${{ needs.rust.outputs.receipt }}
          MODEL_RESULT: ${{ needs.model.result }}
          MODEL_RECEIPT: ${{ needs.model.outputs.receipt }}
          TRUST_RESULT: ${{ needs.trust.result }}
          TRUST_RECEIPT: ${{ needs.trust.outputs.receipt }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          git -C work fetch --no-tags ../trusted "$BASE_SHA"
          printf '%s\n' "$PLAN_JSON" > "$RUNNER_TEMP/ci-plan.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          jobs = {}
          for group in ('docs','rust','model','trust'):
              result = os.environ[group.upper() + '_RESULT']
              raw = os.environ[group.upper() + '_RECEIPT']
              try:
                  proof = json.loads(raw) if raw else None
              except json.JSONDecodeError:
                  proof = {'invalid': raw}
              jobs[group] = {'result': result, 'receipt': proof}
          Path(os.environ['RUNNER_TEMP'], 'ci-evidence.json').write_text(
              json.dumps({'schema_version':1, 'jobs':jobs}), encoding='utf-8')
          PY
          case "$IS_DRAFT" in
            true) STAGE=draft ;;
            false) STAGE=candidate ;;
            *) exit 2 ;;
          esac
          python3 trusted/ci/ci_plan.py qualify \
            --repo work --policy trusted/ci/impact-graph.json \
            --executor trusted/ci/exec-policy.json \
            --base "$BASE_SHA" --head "$HEAD_SHA" --stage "$STAGE" \
            --plan "$RUNNER_TEMP/ci-plan.json" \
            --evidence "$RUNNER_TEMP/ci-evidence.json" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
# No release/production job in this PR workflow. Those protected, signed,
# provenance-bound gates remain independent until a separately authorized
# shadow-mode migration proves their coverage and installs required statuses.
