<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="chartTitle chartDesc">
<title id="chartTitle">Skillz current capability mapping: 121 of 1042 reviewed skill identities mapped and 74 of 247 subdomains linked</title>
<desc id="chartDesc">Current as of 2026-11-09. 47 first-party and 74 third-party reviewed skill identities linked to capability areas. 921 reviewed identities still need mapping. This shows discoverability, not install or behavioral approval.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091727"/><stop offset="1" stop-color="#18253e"/></linearGradient><linearGradient id="routeFill" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2aa7b2"/><stop offset="1" stop-color="#7a79dd"/></linearGradient></defs>
<rect x="1" y="1" width="998" height="408" rx="20" fill="url(#bg)" stroke="#354761" stroke-width="2"/>
<text x="64" y="49" fill="#5fcad5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2" font-weight="800">SKILLZ · CAPABILITY NAVIGATION</text>
