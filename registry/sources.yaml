# Skill source registry
#
# `skillz` is passive. External corpora are tracked as upstream references,
# not copied or mounted into this repository. Source identity and individual
# skill quality are separate facts. A registered source is discovery/prior-art
# evidence; only individually reviewed exact-version records may earn stronger
# unchanged-reuse eligibility.

