# Skill source registry
#
# Source identity and individual skill quality are intentionally separate.
# `class` says who/what the source is. `source_role` says how skillz uses it.
# Pinned reference corpora are available prior art, not blanket trusted skill sets.
# Individual unchanged-reuse eligibility lives in registry/verification and is
# bound to an exact skill identity/fingerprint where established.

