# Skill source registry
#
# Source identity/trust and individual skill quality are intentionally separate.
# `class` says who/what the source is. `source_role` says how skillz uses it.
# Individual skill quality lives in registry/verification and is bound to an
# exact skill fingerprint. A skill without an individual quality record is
# treated as unverified for normal selection.
#
# The registry may also track discovery/reference sources that are not vendored.
# Tracking a source does not establish blanket quality or corpus admission.

