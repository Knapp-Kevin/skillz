# Skill intake registry — decisions about third-party skills.
#
# One file, one entry per candidate. This records DECISIONS, not discovery;
# the horizon scan lives in docs/agent-skills-longlist.md and the scoring
# rubric in docs/evaluation-framework.md.
#
# Fields:
#   id               kebab-case identifier
#   name             display name
#   source           URL or collection name
#   category         one or more of: meta, sdlc, verification, security,
#                    language, frontend, browser, cloud, data, documents,
#                    collaboration, ai-dev, media, marketing, commerce,
#                    research, assistant
#   status           adopted | sandbox | track | rejected | quarantined
#                    (see docs/evaluation-framework.md for definitions)
#   permission_tier  read-only | plan-only | generate | staging-write |
#                    production-write | identity | cost | destructive
#   resolved_path    path inside this repo if vendored (omit otherwise)
#   covered_by       existing MythologIQ capability that makes it redundant
#   rationale        one-line reason for the status
#
# Rules of the lane (see README Positioning):
#   - SDLC-discipline skills that duplicate Qor-logic are REJECTED here with
#     a covered_by pointer, not adopted twice.
#   - Anything that mutates external state without an approval gate is at
#     best QUARANTINED.

