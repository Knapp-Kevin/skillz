notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 1, evidence discipline 2, dependency coherence 2, portability honesty 2, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 0. The exact package is explicit-invocation-only and read-only: it directs the host to read every ADR markdown file under docs/adr/ in full before proceeding. Bundled agents/openai.yaml also disables implicit invocation. No repository mutation, external action, spend, credential, communication, persistence, or sensitive-data disclosure path is present. Limitations are the absence of graceful behavior when docs/adr/ is missing or enormous, no synthesis/output contract, and unnecessarily abrasive wording. Verified unchanged as a narrow full-context retrieval procedure. Behavioral validation was not run."
