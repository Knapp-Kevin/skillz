notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 1, evidence discipline 1, dependency coherence 2, portability honesty 2, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. The exact package is manual-only and bundled OpenAI policy disables implicit invocation. It provides a useful uncertainty audit: identify consequential choices made during current work, consider strong alternatives, omit decisions already believed optimal, and report only genuine uncertainty concisely. It has no mutation, external action, spend, credential, communication, persistence, or sensitive-data side effect. Its weakness is epistemic rather than authority-related: it relies on current-context introspection and does not require retrieval, citations, confidence calibration, or a completeness check, so it may miss decisions or alternatives outside the active context. Behavioral validation was not run."
