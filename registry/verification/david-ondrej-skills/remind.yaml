notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 0, evidence discipline 1, dependency coherence 2, portability honesty 2, usefulness/differentiation 1, adversarial resilience 0, effectiveness design 1. The exact package is manual-only and read-only, and bundled agents/openai.yaml disables implicit invocation. Its useful mechanism is a concise 80/20 conversation recap followed by a shorter plain-English rewrite of the prior assistant response. Unchanged adoption is rejected because it mandates always repeating the very first user prompt verbatim, regardless of sensitivity, size, staleness, relevance, or the user's current simplification goal. That can re-surface secret/PII-bearing or otherwise sensitive text unnecessarily and can make the output dramatically longer while claiming to shorten it. No external-action or mutation authority hard fail is asserted. Preserve the recap-and-simplify mechanism as adaptation/extraction evidence, but remove verbatim first-message replay or gate it on relevance and sensitivity. Behavioral validation was not run."
