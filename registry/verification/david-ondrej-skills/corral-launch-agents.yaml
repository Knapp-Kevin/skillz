notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 2, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 2. The skill explicitly treats launch as state-changing and permits it only when the user asks to launch, requires a dry-run before creation, separates resume from new launch and adoption, requires explicit acceptance for dirty-checkout bypass and preset changes, prohibits credential insertion, and verifies persisted/live state after launch. That is a real action-specific authorization boundary. Behavioral validation was not run. Portability is low because Corral, Herdr, bundled helper scripts/references, and session/worktree conventions are host-specific."
