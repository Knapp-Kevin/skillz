notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 2, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 2, effectiveness design 1. The skill addresses a narrow real failure mode: an already-authorized Git or GitHub operation is blocked by sandbox execution context. It starts normally, escalates only the blocked command and only within the user's authorization, never copies tokens, rejects shell wrappers and broad approval prefixes, requires concrete escalation justification, and verifies from the host context before concluding authentication is broken. The bundled OpenAI policy allows implicit invocation, but invocation itself does not authorize a Git/GitHub mutation; the procedure explicitly preserves the user's existing action authority while changing only execution context. Portability is medium because host escalation APIs differ and the concrete example is Codex-specific. Behavioral validation was not run."
