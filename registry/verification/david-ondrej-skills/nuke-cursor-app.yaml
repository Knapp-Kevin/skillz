notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 2, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. The skill is manual-only, disables implicit invocation, restricts process matching to the Cursor application bundle path, explicitly excludes CursorUIViewService, attempts graceful quit before stronger termination, verifies complete shutdown, verifies relaunch before success, and reads the metrics database with sqlite3 -readonly. Killing Cursor is consequential local mutation, but the action is tightly bound to an explicit user request to nuke/restart Cursor. The remaining weaknesses are host specificity, a hard-coded local metrics path placeholder, and the fact that an in-flight local agent session can still be destroyed if the user's context is stale. Behavioral validation was not run."
