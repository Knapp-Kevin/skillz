notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 2, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. The skill is narrowly triggered by an explicit request to keep a Mac awake, scopes replacement to an already-active anti-sleep session when the user asks for a new duration, validates allowed caffeinate flags, avoids broad process killing, verifies both the exact process and active power assertion, and removes state after failed startup. The bundled launcher mutates local LaunchAgent/cache state, but that mutation is directly authorized by the requested anti-sleep action rather than inferred from tool availability. Portability is intentionally low because the workflow depends on macOS launchd/caffeinate semantics. Behavioral validation was not run."
