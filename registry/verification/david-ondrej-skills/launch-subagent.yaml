notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 1, evidence discipline 1, dependency coherence 1, portability honesty 1, usefulness/differentiation 2, adversarial resilience 2, effectiveness design 2. The skill explicitly forbids launching subagents unless the user requested it, requires independent task and file partitioning, tells the main agent to provide full context, and requires review/verification of every returned result before trust. It also limits delegation to cases where overhead is justified. The hard-coded Fable/GPT model policy and non-bundled deepapi reference are host-specific and freshness-sensitive, so portability is low. Behavioral validation was not run."
