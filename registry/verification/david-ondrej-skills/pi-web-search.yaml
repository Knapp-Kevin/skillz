notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 2. The exact package is tightly scoped to Pi Agents and provides useful routing across web_search, code_search, fetch_content, and large-content retrieval, with explicit query-depth minimums and source-list fallback. It is rejected unchanged under the money-bearing authority hard fail because failure of the nominal zero-config Exa/Perplexity/Gemini chain directs the agent to DeepAPI web search, a paid-capable external request path, without a distinct spend-authorization checkpoint. Configured credentials and a per-request maxCostUsd cap do not grant spend authority. Behavioral validation was not run."
