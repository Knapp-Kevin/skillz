notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 1, evidence discipline 2, dependency coherence 1, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 2. The skill launches an external reviewer only when the user explicitly asks for Fable review, instructs the reviewer to review rather than modify, requires provider/model lookup instead of guessing, waits for completion, and returns the exact reviewer output without laundering it through a rewrite. No credential handling or repository mutation is requested. Failure handling and dependency coherence are thinner because bb-subagents and bb-cli are required but not bundled here, and alternate harness semantics are left to the host. Behavioral validation was not run."
