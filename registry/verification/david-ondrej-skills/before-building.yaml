notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 1, evidence discipline 1, dependency coherence 2, portability honesty 2, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. The exact package is a deliberately small pre-build checkpoint: surface one to three consequential choices, give compact options plus a recommendation, then stop for the user's answers. It has no mutation, external action, spend, credential, or sensitive-data side effect, and bundled OpenAI policy disables implicit invocation. Its main limitation is epistemic: it explicitly forbids reading files, searching, or using tools, so the recommendation is intentionally preliminary and can be wrong when project-specific facts matter. That reduces evidence, failure-handling, adversarial-resilience, and effectiveness scores but does not create a hard fail for the narrow early-framing role. Behavioral validation was not run."
