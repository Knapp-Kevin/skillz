notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 2, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. The exact package is manual-only and provides useful identity disambiguation, cross-platform evidence gathering, claim-versus-evidence labeling, missing/private-profile handling, and concise verdict discipline. It is rejected unchanged under the authority hard fail because ordinary execution requires several paid-capable DeepAPI GitHub/LinkedIn/Twitter/deep-research calls without a distinct spend-authorization checkpoint and sends person-specific public profile/social data through that external service without a separate disclosure boundary. Selecting a person to research and manually invoking the skill does not itself authorize the service spend or external data path. Behavioral validation was not run."
