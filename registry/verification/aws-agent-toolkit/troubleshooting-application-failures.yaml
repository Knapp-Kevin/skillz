notes: Exact package-tree reconciliation at the registered AWS pin. Strong static evidence includes user confirmation of relevant log groups before analysis, validation of actual log availability, AWS-response-derived time windows, explicit read/query operations, query-completion checks, evidence-based error categorization and prioritization, and clear separation between root-cause recommendations and execution. The procedure does not perform the recommended remediations. Verified unchanged as a read-only diagnostic workflow. Behavioral validation remains not-run. CloudWatch Logs query syntax, quotas, retention and service naming conventions are freshness-sensitive.