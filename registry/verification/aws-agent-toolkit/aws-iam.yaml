notes: Exact package-tree review at the registered AWS pin, covering SKILL.md plus four bundled reference documents. Strong safeguards include explicit official-document freshness checks, ForAllValues/ForAnyValue condition-key safety, confused-deputy protection, scoped iam:PassRole guidance, explicit privilege-escalation warnings, role/trust-policy hygiene, and separation between deterministic source-code analysis and service-reference fallback. Authority is mutating because operational workflows can create or alter IAM roles, policies, credentials, trust relationships, and related AWS authorization state; policy upload is explicitly gated on user confirmation. Portability is medium because practical use is AWS-specific and supported-language source-code policy generation mandates uv/uvx plus iam-policy-autopilot, while fallback paths require service-reference query capability or curl/jq. The upstream instruction invokes iam-policy-autopilot@latest rather than a pinned tool version, so an external host should verify that dependency at use time; this does not create repository-owned execution. Behavioral validation remains not-run.