notes: >-
  Purpose/non-trigger: Set up or inspect AWS Security Agent resources; not permission to create or overwrite production IAM, storage or retention policy. Even an 'is security agent configured' read-only trigger can create an AgentSpace, IAM role/policy and S3 bucket. The workflow unconditionally reapplies IAM inline policy, public access block and a whole-bucket 30-day lifecycle without distinct account, resource, cost, access-control and destructive-retention authorization. Reuse selection and confused-deputy protection are positives but do not authorize these writes. Reject unchanged; extract least-privilege checklist and explicit pre-write gate. Exact source path plugins/aws-agents-for-devsecops/skills/setup-security-agent/SKILL.md at ff1481a7bc1a04ee00ebf63d3a8a149aa6a2c546; package tree 0b27efd53c0ca29a3d8882147a402dbcb6db4993; manifest blob 187ac78daedc92d028530a16fa0f8e77b687a380. Package-specific freshness unknown; no qualifying security scan and behavioral validation not-run.
