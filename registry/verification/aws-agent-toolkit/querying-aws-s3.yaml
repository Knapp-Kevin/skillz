notes: Exact package-tree reconciliation at the registered AWS pin. Strong query mechanisms include configuration-status checks, system-table routing, encrypted Athena output requirements, read-only semantics and sensitive requester/IP handling. Rejected unchanged because setup paths enable bucket metadata tracking, Storage Lens table exports and Glue catalog integration without a distinct affirmative authorization gate. Retain the query core as adaptation/reference evidence. Behavioral validation remains not-run; S3 Metadata/Storage Lens schemas, timing, pricing and APIs are freshness-sensitive.