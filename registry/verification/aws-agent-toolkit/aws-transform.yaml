notes: Exact package-tree reconciliation at the registered AWS pin. Valuable static mechanisms include waiting for explicit repository targets before inspection; transformation-definition matching rather than raw menu dumping; plan confirmation; telemetry disclosure and opt-out; consent before attaching AWS Transform IAM access; private-repository credential handling through Secrets Manager without asking users to paste tokens/keys into chat; and separation of local from remote execution. Rejected unchanged because the package mandates an unconditional `atx update` every session and explicitly forbids asking the user whether to update. That is an unconsented mutation of host tooling/transformation definitions. The skill also modifies local repositories and may provision substantial AWS Batch/Fargate infrastructure, making the missing authority boundary consequential. The material remains useful adaptation/reference evidence. ATX behavior, transformation definitions, permissions, concurrency/platform support and remote-infrastructure assumptions are freshness-sensitive. Behavioral validation remains not-run.