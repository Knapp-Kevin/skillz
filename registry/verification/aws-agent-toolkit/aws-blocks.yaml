notes: Exact package-tree review at the registered AWS pin. Strong trigger scope and concise AWS Blocks architecture guidance, with installed-version package READMEs explicitly treated as authoritative for detailed APIs. Security guidance is concrete and unusually useful: authentication is required for non-public methods, secrets belong in secret AppSettings rather than hardcoded values or .env files, user data requires schemas, wildcard IAM and CORS are discouraged, FileBucket public access is constrained, cross-domain cookie settings are explicit, WAF/throttling and monitoring are recommended, and logging guidance warns that serialization safety does not equal secret redaction. Authority is mutating because scaffolding writes project files and sandbox/deploy workflows can create or modify AWS resources and incur cost. Portability is medium because the skill depends on Node/npm, @aws-blocks packages, installed-version documentation, and AWS/CDK semantics for deployed environments. Behavioral validation remains not-run.