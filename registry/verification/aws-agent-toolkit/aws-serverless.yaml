notes: Exact package-tree review at the registered AWS pin. The package is bound to tree SHA 5148dca2f4aee68e6fc7b95807279396332c5cb3 and includes SKILL.md, a Powertools handler template, and nine focused reference documents covering architecture, Lambda, API Gateway, event sources, orchestration, concurrency, deployment, production readiness, and troubleshooting. Strong static evidence includes an explicit freshness warning for runtime versions, quotas, and feature matrices; routing to the most specific reference; least-privilege execution-role guidance; Secrets Manager/SSM handling instead of plaintext environment secrets; input validation; DLQs/on-failure destinations; partial batch failure handling; idempotency; concurrency controls; rollout/rollback safeguards; observability requirements; and concrete anti-patterns for recursive triggers and unsafe integration patterns. Authority is mutating because the procedures build, deploy, configure, debug, and optimize live AWS resources using the external host's credentials and tool access. Portability is medium because serverless design and reliability patterns transfer well while the concrete implementation surface is deeply AWS-specific. External agents should verify volatile quotas, runtime support, service capabilities, and pricing/feature assumptions against current AWS documentation before consequential use. Bundled templates and reference material remain upstream source artifacts and do not constitute repository-owned runtime machinery. Behavioral validation remains not-run.