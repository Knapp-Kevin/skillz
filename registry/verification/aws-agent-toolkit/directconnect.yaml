notes: Exact package-tree reconciliation at the registered AWS pin. Strong static evidence includes task routing, immutable VIF-type and MTU warnings, BGP secret handling, least-privilege IAM constraints, explicit encryption posture, cross-account handling, resiliency distinctions, route-leak warnings and post-change BGP/state verification. Rejected unchanged under the current hard-fail mutation-consent rule because mutating procedures create virtual interfaces and related Direct Connect resources without a distinct explicit user authorization gate for the infrastructure mutation itself. Parameter-choice confirmations are narrower than action authorization. Behavioral validation remains not-run. Direct Connect capabilities, quotas, pricing, port-speed support and BGP/encryption semantics are freshness-sensitive.