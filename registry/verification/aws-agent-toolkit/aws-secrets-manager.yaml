notes: Exact package-tree review at the registered AWS pin. The package is bound to tree SHA b275f49c769d5c02149928c8ea2a11f980b3428f and contains SKILL.md plus the bundled references/asm-exec executable reference. Strong static evidence includes an explicit prohibition on fetching plaintext secret values into agent-visible context; runtime-only dynamic references; clear acknowledgement that the pattern is best-effort defense rather than a security boundary; IAM least-privilege, CloudTrail, and VPC endpoint safeguards; single-pass substitution to avoid recursive resolve injection; no local AWS CLI plaintext fallback; and concrete troubleshooting for region, identity, backend, and permission failures. Authority is mutating because the procedures invoke downstream commands and AWS-backed secret resolution under the external host's credentials, and examples include application/database access and configuration-file writes. Portability is medium because the security principle transfers well while asm-exec, Secrets Manager Agent, AWS MCP, SigV4, and plugin-hook behavior are AWS-specific. External agents should treat the bundled asm-exec and hook behavior as exact pinned upstream tooling, verify current AWS endpoint/credential/SMA behavior before consequential use, and never reinterpret the vendored executable as repository-owned runtime machinery. Behavioral validation remains not-run.