notes: Exact package-tree review at the registered AWS pin. The package is bound to tree SHA 62ae8b88569e68b87ed62072dc17867e795781d3 and includes SKILL.md plus 11 references covering clients, credentials, DynamoDB, effective practices, error handling, Lambda, performance, S3, schemas, SigV4a, and TypeScript. Strong static evidence includes explicit credential-provider guidance rather than embedded secrets; AssumeRole, OIDC, SSO, ECS/EC2 and custom-chain coverage; warnings about unread response streams exhausting sockets; paginator and retry/error patterns; Lambda client reuse; package-root import discipline; S3/DynamoDB helpers; and performance/middleware guidance. Authority is mutating because examples and procedures can invoke AWS service APIs, including create/update operations, under the external host's credentials. Portability is medium because SDK design and JavaScript patterns transfer conceptually while concrete APIs and packages are AWS-specific. Freshness is the principal weakness: the pinned skill embeds exact Node.js compatibility thresholds for specific SDK versions and other library behavior that can change, without a general instruction to verify volatile version facts against current upstream documentation. External agents should therefore confirm compatibility/version claims before consequential use. Behavioral validation remains not-run.