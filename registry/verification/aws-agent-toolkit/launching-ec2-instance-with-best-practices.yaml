notes: Exact package-tree reconciliation at the registered AWS pin. Strong static evidence includes a pre-mutation confirmation of the full proposed defaults and reasoning; separate network-topology confirmation; current AMI and instance-offering verification; private-by-default networking; SSM-first access; refusal to inspect or retain SSH private-key material; least-privilege IAM guidance; encrypted gp3 storage; hardened security groups; comprehensive tagging; and post-launch verification. Authority remains mutating because the workflow creates and changes IAM, network-security and EC2 resources, but the package establishes a meaningful user confirmation boundary before resource creation. The score is held at 18/20 because instance/pricing/free-tier/AMI/performance recommendations and several exact defaults are volatile, while EC2 launch remains consequential even with strong safeguards. Current AWS evidence should be used for prices, instance availability and AMI/version facts. Behavioral validation remains not-run.