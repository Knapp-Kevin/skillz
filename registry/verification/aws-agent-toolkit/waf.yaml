notes: Exact package-tree reconciliation at the registered AWS pin. Strong static evidence includes immutable WAF scope/Region correctness, least-privilege temporary credentials, Count-before-Block tuning, required ACL association verification, sensitive-log redaction/encryption, forwarded-header anti-spoofing and differentiated routing across managed rules, rate limiting, Bot Control and Fraud Control. Rejected unchanged under the current hard-fail mutation-consent rule because the entry-point procedure creates and associates a web ACL after parameter/design selection without a distinct explicit user authorization gate for changing the application's traffic-filtering security control. Default-action selection is design input, not execution consent. Behavioral validation remains not-run. WAF pricing, managed-rule behavior and supported-resource capabilities are freshness-sensitive.