notes: Exact package-tree reconciliation at the registered AWS pin. Strong static evidence includes a universal explicit-confirmation boundary before create/modify operations; distinct downtime warnings for higher-impact changes; hard refusal/assessment redirection for deletion, backup destruction, failover, major-version upgrade, reboot, replica promotion and public-access enablement; required private networking and managed credential handling; scoped KMS and Secrets Manager guidance; precise RDS-Oracle-specific constraints such as no RDS Proxy; focused sub-skill routing; and bundled diagnostic tooling. The score is 19/20 because the authority and safety model is unusually explicit and operationally useful. It is held below perfect because Oracle/RDS version families, driver/tool support, option-group behavior, Kerberos/CMAN assumptions and service-specific networking details remain freshness-sensitive. Current AWS and Oracle documentation should be checked for consequential or version-specific use. Bundled scripts are upstream package components, not skillz-owned runtime. Behavioral validation remains not-run.