notes: Exact package-tree reconciliation at the registered AWS pin. Useful evidence includes clean RDS-versus-Aurora separation; current engine-version discovery instead of stale lists; production defaults for encryption, private access, Multi-AZ, backups, Secrets Manager and deletion protection; no-fabrication rules; focused upgrade/pricing/proxy/Blue-Green workflow references; and explicit advisory-only boundaries for upgrades, purchases, switchovers and proxy creation. Rejected unchanged because the instance-creation path directly permits `create-db-instance` and instructs the host to execute production provisioning without a distinct explicit user-confirmation boundary immediately before the consequential billable mutation. A request for a production-ready design is not sufficient authorization to create the live resource. The material remains high-value adaptation/reference evidence. Engine versions/support dates, pricing, commitment terms, proxy/Blue-Green behavior and service limits are freshness-sensitive. Behavioral validation remains not-run.