notes: Exact package-tree reconciliation at the registered AWS pin. Strong static evidence includes explicit confirmation before creates/modifies; separate warning treatment for higher-impact capacity switching and restores; refusal/redirect rules for irreversible deletes, CDC disablement, irreversible client timestamps and region-addition changes; mandatory tagging; live-context and credential constraints; post-mutation CloudTrail/CloudWatch guidance; and structured routing across pricing, compatibility and migration workflows. Authority remains mutating because the skill can create keyspaces/tables/types, alter capacity/TTL/PITR/encryption/CDC/auto-scaling, restore tables and tag resources. The score is held at 15/20 because pricing, service feature support, regional availability and IAM details are freshness-sensitive, and the instruction to simulate bundled script output when shell execution is unavailable can blur the distinction between actually executed analysis and reconstructed static output. Behavioral validation has not been run.