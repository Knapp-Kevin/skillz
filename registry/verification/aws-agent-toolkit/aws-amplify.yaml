notes: Exact package-tree reconciliation at the registered AWS pin. Strong material includes Gen2 detection/routing, framework-specific integration, generated-output hygiene, authentication choice prompts, secret-storage guidance, deployment validation and detailed version-specific pitfalls. Rejected unchanged because deployment paths create Amplify apps, IAM roles/policies, branches, backend resources, custom domains and release jobs without a distinct affirmative authorization gate for the infrastructure/cost plan. The create-app example passes a GitHub auth token as a command argument, and starter publicApiKey authorization requires deliberate contextual review. Retain as adaptation/reference evidence. Behavioral validation remains not-run; Amplify runtimes, APIs, managed policies, framework support and limits are highly freshness-sensitive.