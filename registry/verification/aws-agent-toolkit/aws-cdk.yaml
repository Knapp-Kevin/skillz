notes: Exact package-tree review at the registered AWS pin. Strong trigger and non-trigger boundaries, diff-before-deploy discipline, stateful-resource and logical-ID replacement warnings, staged cross-stack-reference removal, rollback guidance, OIDC and permissions-boundary security guidance, and coherent source-intact references. Authority is the constrained dimension because bootstrap, deploy, import, refactor, drift, rollback, and destroy-related workflows can mutate infrastructure, incur cost, or cause data loss and therefore require credentials plus explicit host/user authority. Behavioral validation remains not-run.
