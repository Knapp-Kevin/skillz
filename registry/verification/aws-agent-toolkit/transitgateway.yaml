notes: Exact package-tree reconciliation at the registered AWS pin. Strong static evidence includes segmentation-first design, CIDR-overlap hard stops, per-AZ attachment requirements, dedicated-subnet guidance, VPC-side route completeness, ephemeral least-privilege credential rules, encrypted flow/audit logging and explicit central-router blast-radius warnings. Rejected unchanged under the current hard-fail mutation-consent rule because the hub-creation procedure creates the transit gateway, flow logs, attachments and VPC route changes without a distinct explicit authorization gate for those consequential billable/network mutations. Segmentation selection is a design choice, not execution consent. Behavioral validation remains not-run. Transit Gateway pricing, quotas and routing semantics are freshness-sensitive.