notes: Exact package-tree reconciliation at the registered AWS pin. Strong static evidence includes decide-before-subscribe guidance, lower-cost alternatives, explicit billing-family semantics, auto-renewal/support-only cancellation warnings, required resource protection after subscription, least-privilege controls, audit/encryption guidance and coverage verification. Rejected unchanged under the current hard-fail mutation-consent rule because the subscription procedure warns about the paid auto-renewing commitment but then invokes create-subscription without a distinct explicit user authorization gate accepting that commitment. Warning is not consent. Behavioral validation remains not-run. Pricing, subscription terms, resource eligibility and Shield/WAF capabilities are freshness-sensitive.