  The assistant also applied the standalone instruction bundle to
  eight fictional consuming scenarios with two preference profiles:
  consistent canonical finding, different table/paragraph presentation,
  transient override, injection refusal, stale-version hold, no-store
  fallback, mixed finding and recursive self-praise refusal. This
  same-model emulation is evidence of a controlled response exercise,
  NOT an independent host/user outcome or proof of tenant isolation.
