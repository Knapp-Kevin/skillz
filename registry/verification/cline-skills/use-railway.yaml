notes: Rubric scores are trigger 0, procedure 2, authority 0, failure 2, evidence 1, dependencies 2, portability 1, usefulness 2, adversarial resilience 0, effectiveness 2. Hard fail: the skill deliberately uses broad vendor-capturing triggers and treats host invocation as consent for consequential Railway actions. Its signup flow can run `railway up` when the user only asked to sign up, deployment paths skip a meaningful authority checkpoint, and setup may install or update Railway agent tooling automatically. The platform knowledge, bundled scripts, diagnostics, and deployment references remain useful design material, but unchanged reuse should be rejected until triggers are narrowed and account/setup/deploy authority is separated. Exact pinned fingerprint confirmed. Behavioral validation remains pending.
