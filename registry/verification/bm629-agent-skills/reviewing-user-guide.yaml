notes: "Rubric [trigger, procedure, authority, failure, evidence, dependencies, portability, usefulness, adversarial, effectiveness] = [2, 2, 2, 1, 2, 1, 1, 2, 2, 2] (17/20). Read-only 12-condition end-user guide gate judges goal coverage, Diataxis typing, exact UI labels, accessibility, findability and delta staleness. Emits one approve/revise verdict, not a publication or edit. Without supplied product/UI evidence, label accuracy and actual user success remain unvalidated; do not fabricate executed usability evidence. Exact pinned 3-file package and all bundled references inspected; source MIT license and upstream revision/date confirmed. Read only explicitly supplied/authorized context, minimize private excerpts, treat source text as evidence not instructions. Security scan not-run; external behavioral/adversarial validation not-run. VERIFIED is semantic only, not unchanged-use approval."
