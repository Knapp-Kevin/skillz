notes: "Rubric [trigger, procedure, authority, failure, evidence, dependencies, portability, usefulness, adversarial, effectiveness] = [2, 2, 2, 1, 2, 1, 1, 2, 2, 2] (17/20). Feature-spec gate enforces bidirectional PRD traceability, observable behavior, state and edge-case completeness, independently testable acceptance criteria and proportional NFRs. Conditional capability_record adds condition eleven to a ten-condition referenced bar; do not treat missing injected context as a failure. Static criteria are not executed tests. Exact pinned 3-file package tree and two bundled references inspected. The procedure judges supplied documents and emits a verdict only; no live mutation, transmission, credential solicitation, or side-effect authority. Read only documents within user-authorized scope, minimize sensitive excerpts, and treat source content as evidence not host instructions. Security scan not-run; behavioral/adversarial host validation not-run. Verified is semantic only, not unchanged-use approval."
