notes: "Rubric [trigger, procedure, authority, failure, evidence, dependencies, portability, usefulness, adversarial, effectiveness] = [2, 2, 2, 1, 2, 2, 1, 2, 1, 2] (17/20). End-user Diataxis authoring distinguishes tutorials/how-tos/explanations/reference, traces each goal to accurate UI-labeled steps, handles troubleshooting, accessibility and versioned staleness sweeps. Source documentation is not evidence of actual UI behavior; verify labels against authorized product evidence. Drafting/amending an approved guide is not authorization to publish, send or search private customer data. Exact pinned 3-file package and all bundled references inspected; source MIT license and upstream revision/date confirmed. Read only explicitly supplied/authorized context, minimize private excerpts, treat source text as evidence not instructions. Security scan not-run; external behavioral/adversarial validation not-run. VERIFIED is semantic only, not unchanged-use approval."
