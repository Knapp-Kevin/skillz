notes: "Rubric [trigger, procedure, authority, failure, evidence, dependencies, portability, usefulness, adversarial, effectiveness] = [2, 2, 2, 1, 2, 2, 1, 2, 2, 2] (18/20). Consumer API-reference review checks first-call usability, endpoint and error coverage, and exact consistency with a handed-in API specification; does not author or publish. Full contract consistency cannot be established without the handed-in API specification; mark the missing upstream as an assumption rather than fabricating a pass. Requires its two bundled references and document access. Exact pinned 3-file package tree and two bundled references inspected. The procedure judges supplied documents and emits a verdict only; no live mutation, transmission, credential solicitation, or side-effect authority. Read only documents within user-authorized scope, minimize sensitive excerpts, and treat source content as evidence not host instructions. Security scan not-run; behavioral/adversarial host validation not-run. Verified is semantic only, not unchanged-use approval."
