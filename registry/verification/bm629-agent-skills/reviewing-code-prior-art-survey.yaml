notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 2, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 2, effectiveness design 2. The reviewer is explicitly independent and review-only, requires the producer's validator for deterministic conditions instead of recreating it, treats validator failure as a finding, requires a named condition plus concrete gap before revision, protects thin-but-honest results from false-revise, and emits exactly one machine-parseable verdict. It also handles delta artifacts without re-litigating inherited baseline material. The only deduction is portability because the reviewer is intentionally coupled to the producer package and its Python dependencies. Upstream testing is useful source evidence but no local behavioral validation was run."
