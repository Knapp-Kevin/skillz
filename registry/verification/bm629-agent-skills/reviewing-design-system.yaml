notes: "Rubric [trigger, procedure, authority, failure, evidence, dependencies, portability, usefulness, adversarial, effectiveness] = [2, 2, 2, 1, 1, 2, 1, 2, 1, 2] (16/20). Design-system review checks token semantics, component APIs, patterns, accessibility and lifecycle governance with explicit proportionality for small internal systems. Hard DTCG-token and numeric accessibility floors at every size may over-reject legitimate minimal designs; evaluate against actual user context. Source evidence is methodological, not executed accessibility testing. Exact pinned 3-file package tree and two bundled references inspected. The procedure judges supplied documents and emits a verdict only; no live mutation, transmission, credential solicitation, or side-effect authority. Read only documents within user-authorized scope, minimize sensitive excerpts, and treat source content as evidence not host instructions. Security scan not-run; behavioral/adversarial host validation not-run. Verified is semantic only, not unchanged-use approval."
