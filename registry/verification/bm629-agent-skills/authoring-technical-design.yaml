notes: "Rubric [trigger, procedure, authority, failure, evidence, dependencies, portability, usefulness, adversarial, effectiveness] = [2, 2, 2, 1, 2, 2, 1, 2, 1, 2] (17/20). Feature-level TDD method derives decisions from approved PRD/feature-spec, traces requirements, weighs real alternatives, and specifies failures, observability, tests, rollout and rollback. Design proposals do not authorize deployment, telemetry, private-data reads or edits outside the requested document destination. Optional host template/research and supplied architecture/API/data-model context are dependencies; absent facts remain assumptions. Exact pinned 4-file package and all bundled references inspected; source MIT license and upstream revision/date confirmed. Read only explicitly supplied/authorized context, minimize private excerpts, treat source text as evidence not instructions. Security scan not-run; external behavioral/adversarial validation not-run. VERIFIED is semantic only, not unchanged-use approval."
