notes: "Rubric [trigger, procedure, authority, failure, evidence, dependencies, portability, usefulness, adversarial, effectiveness] = [2, 2, 2, 1, 2, 2, 1, 2, 2, 2] (18/20). Developer-guide gate separates adoption narrative from API reference, checks verifiable sandbox-first setup, current runnable samples, troubleshooting and upstream accuracy. Review is document-only; it does not execute sample code or obtain credentials. Missing upstream contract must be disclosed, not silently passed; host must not run sample integrations against live systems without authorization. Exact pinned 3-file package tree and two bundled references inspected. The procedure judges supplied documents and emits a verdict only; no live mutation, transmission, credential solicitation, or side-effect authority. Read only documents within user-authorized scope, minimize sensitive excerpts, and treat source content as evidence not host instructions. Security scan not-run; behavioral/adversarial host validation not-run. Verified is semantic only, not unchanged-use approval."
