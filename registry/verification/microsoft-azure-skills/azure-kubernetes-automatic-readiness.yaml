notes: Exact Azure-source package tree and SKILL.md blob match the completed Microsoft Skills review byte-for-byte, so compatible complete-package evidence was reconciled rather than duplicated. Static review covers SKILL.md and all four bundled references: constraint-spec-v1.yaml, common-fixes.md, mcp-integration.md, and migration-guide-summary.md. Strong mechanisms include a mandatory read-only cluster-assessment boundary, conservative secret handling, explicit approval before any file write, deterministic patch versus context-dependent remediation separation, combined-diff approval for batch fixes, offline fallback, and explicit constraint-spec version disclosure. Unchanged adoption fails the authority hard rule because the bundled migration guide supplies direct procedures for billable AKS cluster creation, credential acquisition, staging deployment, OIDC/workload-identity enablement, and old-cluster deletion without a mandatory action-specific authorization checkpoint immediately before each consequential external mutation. Static rejection does not establish runtime behavior; behavioral validation remains not-run.