notes: Exact Azure-source package identity matches the previously reviewed Microsoft Skills package tree and SKILL.md blob, so compatible prior structured review evidence is reused. The package is strong prior art for read-oriented cost analysis: it separates query, forecast, and optimization intents; requires explicit scope selection for focused analyses; validates pricing; preserves total-bill context; handles Cost Management throttling conservatively; and warns about retention/tier tradeoffs. Unchanged adoption nevertheless fails the authority hard rule because optimization material includes live AKS add-on enablement and implementation commands/recommendations that can delete or snapshot-and-delete resources, alter storage lifecycle deletion/tiering, redundancy/SKU, retention, and other persistent cost-bearing settings without mandatory action-specific authorization immediately before mutation. The Free-to-Standard AKS tier change correctly requires explicit approval, but the adjacent cost-analysis add-on mutation does not. Preserve query, forecast, analysis, reporting, pricing validation, scope-selection, and recommendation mechanics for adaptation/reference use. Require explicit target, cost, production, retention/data-lifecycle, destructive-action, and resource-mutation authorization before live optimization. Behavioral validation remains not-run.