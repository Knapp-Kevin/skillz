notes: Exact Azure-source package tree and SKILL.md blob match the completed Microsoft Skills review byte-for-byte, so compatible complete-package evidence was reconciled rather than duplicated. Strong mechanisms are least-privilege-first role selection, escalation to custom-role generation only when no built-in role fits, explicit use of Microsoft.Authorization/roleAssignments/write as the grant prerequisite, and preference for User Access Administrator over Owner when role assignment is the only need. The skill asks tooling to generate CLI commands and Bicep snippets but does not instruct the host to execute them, assign roles, alter Azure state, or disclose credentials. Therefore the current action-specific mutation authorization hard fail is not triggered by the reviewed package itself; any later execution of generated artifacts is a separate host-agent action requiring its own scoped authorization. Portability is medium because the procedure is conceptually portable but depends on Azure-specific documentation, CLI-generation, and Bicep tooling. Static verification does not establish runtime behavior; behavioral validation remains not-run.