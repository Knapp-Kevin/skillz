notes: Exact Azure-source package tree and SKILL.md blob match the completed Microsoft Skills review byte-for-byte, so compatible complete-package evidence was reconciled rather than duplicated. The package contains only SKILL.md. Strong mechanisms include schema-first discovery, read-only cluster/database listing and KQL querying, early time filters, bounded exploratory result sets, aggregation guidance, and a CLI/REST fallback that remains query-oriented. Unchanged adoption fails current sensitive-data and authority governance because the stated use cases include SIEM/security events, audit logs, user behavior, telemetry, and raw row retrieval without a mandatory disclosure-scope, minimization, redaction, or sensitive-data authorization checkpoint before results are returned. The best-practice section also recommends stored functions, materialized views, retention policies, streaming ingestion, and Azure Monitor integration without explicitly separating those persistent changes behind action-specific authorization. Adaptation can preserve the query mechanics while requiring data-scope authorization and treating persistent optimization/ingestion changes as separate governed actions. Static rejection does not establish runtime behavior; behavioral validation remains not-run.