notes: Exact Azure-source package tree and SKILL.md blob match the completed Microsoft Skills review byte-for-byte, so compatible complete-package evidence was reconciled rather than duplicated. Strong mechanisms include a mandatory plan-first workflow, explicit approval before execution, subscription and location confirmation, destructive-action confirmation, Entra-only SQL guidance, specialized-skill routing, security hardening, functional verification, and a strict validate-before-deploy handoff that keeps deployment execution outside this skill. Unchanged adoption fails current authority governance because the skill requires writing .azure/deployment-plan.md as its very first action before workspace analysis or plan approval and does not first check whether that path already exists. The package's own global rules classify overwriting existing files as destructive and require ask_user, creating an internal safety conflict if an existing deployment plan would be replaced. Adaptation should preserve the staged preparation workflow but inspect the destination first, preserve an existing plan by default, and require explicit scoped approval before replacement. Static rejection does not establish runtime behavior; behavioral validation remains not-run.