notes: Exact Azure-source package identity matches the previously reviewed Microsoft Skills package exactly, so compatible complete-package review evidence is reconciled rather than repeated. Review covered SKILL.md and bundled pre-deploy checklist, global rules, authentication guidance, live RBAC verification, azd/azcli/Bicep/Terraform/CI-CD recipes, SQL managed-identity and Entra-auth guidance, EF migrations, post-deployment verification, troubleshooting, and SDK references. Strong mechanics include mandatory azure-prepare and azure-validate prerequisites, validation proof, subscription and region confirmation, resource/environment conflict checks, explicit ask_user for destructive, cost-impacting, and security/RBAC actions, RBAC propagation checks, structured recipes, error recovery, and post-deploy verification. Unchanged adoption still fails the authority hard rule because required post-deployment guidance can grant managed identities SQL permissions and apply EF Core schema migrations after deployment without a dedicated action-specific authorization boundary immediately before those separate persistent identity/access and database changes. Preserve the strong deployment safeguards for adaptation/reference use and require fresh database-owner, identity/access, schema-migration, production, target, and rollback authorization before post-deploy mutation. Behavioral validation remains not-run.