notes: Fresh exact-package review covers SKILL.md plus all 16 bundled reference files. Strong prior art includes clear app-type and OAuth-flow selection, least-privilege API-permission guidance, production preference for managed identity/certificates over secrets, HTTPS redirect guidance, token-validation reminders, MSAL/Azure Identity examples, IaC guidance, and extensive troubleshooting/reference material. Unchanged adoption fails the authority hard rule because the workflow and CLI reference directly create, update, and delete app registrations and service principals; grant and delete API permissions; invoke tenant admin consent; add/remove owners; reset/delete credentials; and include bulk deletion without mandatory action-specific authorization checkpoints immediately before those consequential identity/access mutations. Secret discipline also fails unchanged adoption: az ad app credential reset emits a live client secret in command output and the reference explicitly tells the operator to save that output, rather than requiring a secure external credential path with disclosure minimization. Preserve the identity/OAuth design material and safer credential guidance for adaptation/reference use. Require explicit scoped authorization before every mutation and secure external handling for generated credentials. Behavioral validation remains not-run.