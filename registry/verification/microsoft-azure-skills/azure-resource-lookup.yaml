notes: Exact static review covers the complete pinned Azure azure-resource-lookup package, SKILL.md plus references/azure-resource-graph.md. Its tree and SKILL.md blob exactly match the completed Microsoft Skills package, so compatible semantic evidence was reconciled rather than repeated. Useful mechanisms include precise resource-inventory triggers and non-triggers, dedicated-MCP-tool-first routing, Azure Resource Graph fallback, explicit subscription and result limits, JMESPath output shaping, orphaned-resource patterns, tag coverage checks, provisioning/health inspection, and an explicit prohibition on ARG mutations. The hard fail is narrower than the cloud behavior: the package's Quick Reference and missing-extension recovery instruct `az extension add --name resource-graph`, which installs persistent local tooling without a mandatory action-specific authorization checkpoint. Under current authority governance, unchanged adoption is therefore rejected. Preserve the read-only lookup/query methods as adaptation/reference evidence, but require the host to establish authorization before any extension installation. Behavioral validation remains not-run.
