notes: Exact Azure-source package tree and SKILL.md blob match the completed Microsoft Skills review byte-for-byte, so compatible complete-package evidence was reconciled rather than duplicated. The package contains only SKILL.md and relies on shared Azure troubleshooting references. Strong mechanisms include SDK/version identification, resource-health-first diagnosis, documentation lookup, connection/entity configuration checks, and read-oriented namespace, hub, queue, topic, subscription, log, and health inspection. Unchanged adoption fails current authority governance because the diagnosis workflow terminates in applying remediation without a mandatory action-specific authorization checkpoint. The shared authentication guidance also recommends consequential production identity/security and credential operations including managed-identity/RBAC configuration, secret or certificate rotation, and enabling Defender for Cloud, again without a per-action authorization boundary. Adaptation can retain the diagnostic sequence while forcing a read-only stopping point and requiring explicit scoped approval before any application, identity, security-control, credential, messaging-state, or infrastructure mutation. Static rejection does not establish runtime behavior; behavioral validation remains not-run.