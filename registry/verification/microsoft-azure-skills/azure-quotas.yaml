notes: Exact Azure-source package tree and SKILL.md blob match the completed Microsoft Skills review byte-for-byte, so compatible complete-package evidence was reconciled rather than duplicated. Strong mechanisms include explicit quota-name discovery instead of ARM-name guessing, CLI-first read workflows, current usage and available-capacity calculation, regional comparison, unsupported-provider fallback, and a warning that quota API "No Limit" responses do not establish unlimited capacity. Unchanged adoption fails current authority governance because quota increase requests and Microsoft.Quota provider registration can mutate subscription-scoped external state without a mandatory action-specific authorization boundary immediately before execution. The package also mandates installing the Azure CLI quota extension before use without first authorizing that local toolchain mutation. Adaptation should preserve the read and planning mechanics but place explicit scoped authorization before extension installation, provider registration, or quota-change submission. Static rejection does not establish runtime behavior; behavioral validation remains not-run.