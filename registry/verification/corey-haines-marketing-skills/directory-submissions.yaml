notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 0, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. Authority hard fail: ordinary workflows prescribe external form submission, directory/listing publication, Product Hunt/community activity, review solicitation and incentives, and outreach without distinct publication, communication, or money-bearing authorization checkpoints. Strong reusable mechanisms include launch-readiness gating, tiered directory prioritization, per-surface positioning variants, tracker discipline, destination-page readiness, and post-submission measurement. Material volatile claims and upstream eval expectations about Product Hunt timing/supporter thresholds, G2 review thresholds/report cutoffs/pricing, duplicate-content/AI ranking, backlink/DR thresholds, conversion rates, and directory counts lack adequate claim-level primary evidence. Upstream evals are intended behavior, not independent validation. Behavioral validation was not run."
