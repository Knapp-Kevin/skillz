notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 2, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 2, effectiveness design 1. AUTHORITY HARD FAIL: the custom-advisor path instructs the agent to save a dossier into the user's project without an explicit file-write authorization boundary. Otherwise this is one of the stronger Corey packages reviewed: it labels simulation, forbids fabricated quotes/endorsements, requires grounded frameworks, deliberately seats dissent, surfaces disagreement as the primary value, prefers primary sources for live research, and applies extra care to living advisors. Living-person simulation still requires exact/current-source discipline for quotes, attributed positions, named competitors, controversies, and evolving views. Preserve the seating protocol, disagreement map, grounding rules, and synthesis pattern; adapt custom-advisor persistence to propose content first and write only after explicit authorization. Behavioral validation was not run."
