notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 1, evidence discipline 0, dependency coherence 2, portability honesty 2, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. The exact package is useful editing prior art: it separates editing from initial drafting, applies multiple focused passes, preserves author voice while improving clarity and specificity, supplies a concise final checklist, provides plain-English alternatives, and distinguishes refresh from rewrite. No authority hard fail applies because ordinary execution critiques or rewrites supplied text and does not itself publish, send, spend, change access, or mutate external systems. Unchanged adoption is rejected because references/content-refresh.md asserts that outdated content is cited less in AI search and prescribes quarterly, 3-6 month, 6-month, and annual refresh cadences without claim-level evidence. Refresh guidance also encourages use or updating of testimonials, case studies, competitor material, pricing/features, traffic data, and search-intent signals without explicit source-verification, privacy/data-minimization, retention, consent, or source-terms boundaries. Behavioral validation was not run. Preserve the multi-pass editing method, checklist, plain-language substitutions, specificity/voice discipline, and refresh-vs-rewrite decision framework with current evidence and data-handling safeguards."