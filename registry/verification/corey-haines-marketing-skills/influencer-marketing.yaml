notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 1, dependency coherence 2, portability honesty 2, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 2. Authority hard fail: the package prescribes creator outreach, paid/gifted compensation, negotiated commercial terms, exclusivity/usage rights, creator-account operation, public posts, tracking setup, and paid-ad whitelisting without distinct authorization checkpoints for communication, money, legal/commercial commitments, publication, or data disclosure. Strong safeguards include explicit material-connection disclosure, no fabricated claims, platform-label guidance, advertiser responsibility, and the bundled UGC reference's compliance rewrite of stealth-account/comment-bounty tactics. Useful mechanisms include audience-fit vetting, compensation-model comparison, creative briefs, agreement dimensions, and qualified-outcome measurement. Compensation/engagement ranges and legal/platform requirements remain volatile and should be reverified for jurisdiction and current platform rules. Behavioral validation was not run."
