notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 1, failure handling 1, evidence discipline 0, dependency coherence 2, portability honesty 2, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. The exact package provides useful cold-outreach drafting prior art: peer-style brevity, problem-linked personalization, audience tone calibration, multiple copy frameworks, low-friction CTAs, non-repetitive follow-up angle rotation, breakup-email finality, critique heuristics, and correct routing of opted-in lifecycle nurture to a separate skill. The skill itself is generate-only: it writes or critiques copy and does not instruct the host to send messages, enroll prospects, mutate a CRM, or operate outreach tooling, so no authority hard fail is established at the package level. Unchanged adoption is still rejected because evidence discipline and safety context are insufficient for production reliance. Bundled references assert numerous volatile performance, deliverability, seniority, industry, regional, timing, and behavioral-effect claims with source-name attribution but without claim-level primary citations; several are framed as prescriptive truths despite conflicting data acknowledged elsewhere. Personalization guidance encourages person-level and psychographic research across LinkedIn, podcasts, job changes, funding, tech stack, and other signals without a meaningful privacy/data-minimization or jurisdictional compliance boundary. Subject-line guidance explicitly promotes internal-looking camouflage, which can slide from concise human tone into deceptive sender-context mimicry. The package lacks substantive CAN-SPAM/GDPR/CASL or equivalent unsolicited-outreach compliance guidance and lacks an explicit boundary requiring separate authorization before generated copy becomes actual external communication. Upstream evals/evals.json is intended-behavior evidence only; skillz did not run it. Behavioral validation was not run. Preserve the drafting, critique, framework, sequence-design, and lifecycle-routing mechanisms as adaptation/extraction evidence while requiring current primary-source verification for quantitative claims and explicit privacy/compliance/send-authorization safeguards before operational use."