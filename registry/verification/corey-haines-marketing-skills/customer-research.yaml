notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 1, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. AUTHORITY HARD FAIL: Mode 3 instructs CRM segmentation, direct outreach, incentives, interviews, and surveys without a real authorization boundary for communications, money-bearing incentives, customer-data access, or recording/data handling. Existing-asset analysis can involve support, NPS, churn, identity, and other customer data without explicit minimization/consent/retention boundaries. The package has unusually useful disconfirmation, source-bias, confidence-labeling, VOC extraction, JTBD, and persona guardrails, but quantitative PMF/sample/incentive guidance also needs source verification. Behavioral validation not run. Preserve read-only synthesis and research-design mechanisms with explicit authority/privacy safeguards."