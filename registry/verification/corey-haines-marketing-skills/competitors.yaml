notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 1, dependency coherence 2, portability honesty 2, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 1. The exact package is useful prior art for competitor/alternative content: four clear page formats, honest positioning rules, decision-oriented comparison sections, centralized competitor data, structured research, migration/support treatment, site architecture/internal linking, and correct routing of internal battlecards to sales-enablement. Unchanged adoption fails the authority hard fail because normal execution prescribes creating persistent competitor data and public page content, adding index/footer/internal links, and publishing identity-bearing comparative claims and CTAs without distinct explicit authorization checkpoints for file/site mutation and external publication/communication. Research guidance also reaches public reviews and customer conversations without explicit privacy/data-minimization/source-terms boundaries. Pricing, features, support, testimonials, search volume, migration claims, and competitor assertions are volatile or reputation-sensitive and need current claim-level verification before publication. The bundled content-architecture example contains dated Notion pricing/feature/migration facts and is illustrative, not current evidence. Upstream evals/evals.json is intended-behavior evidence only; skillz did not run it. Behavioral validation was not run. Preserve the read-only page-format selection, honest-comparison principles, centralized-data schema, comparison templates, research/update cadence, and sales-enablement routing as adaptation/extraction evidence behind explicit mutation/publication authority, privacy/source-terms safeguards, and current claim verification."