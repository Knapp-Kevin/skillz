notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 1, failure handling 1, evidence discipline 2, dependency coherence 1, portability honesty 1, usefulness/differentiation 2, adversarial resilience 2, effectiveness design 2. The exact package gives a coherent example-first workflow for translating natural-language structural queries into ast-grep patterns/rules, testing them on controlled snippets, debugging with AST inspection, and then scanning the target codebase. Its bundled rule reference materially improves self-containment. It writes only local temporary/example and YAML rule artifacts and otherwise performs read-oriented searches, so the current authority hard fail does not apply. Limitations: the ast-grep CLI/version is not pinned or checked; broad scans can surface sensitive code in output, so the host should retain repository scope and minimize disclosure; shell/inline-rule quoting deserves care when incorporating user-controlled patterns. Behavioral validation has not been run."
