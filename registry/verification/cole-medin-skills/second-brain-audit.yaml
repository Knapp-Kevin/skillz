notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 1, failure handling 2, evidence discipline 2, dependency coherence 2, portability honesty 2, usefulness/differentiation 2, adversarial resilience 2, effectiveness design 2. The skill distinguishes current state from historical events, checks always-loaded claims against fresher evidence, separates contradiction from lack of evidence, warns that a zero-result scanner is not a clean bill of health, avoids bulk conversion, and requires a shown diff plus approval before restructuring. The optional scanner is read-only and present in the source. One point is withheld on authority because the later write-path phase instructs updating the agent instruction file without restating the earlier approval requirement as explicitly as the restructuring phase. Upstream commit notes report behavioral checks, but no local behavioral validation was run here."
