notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 1, failure handling 1, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 2. The package is a useful whole-codebase priming procedure: it optionally anchors orientation to Jira/Confluence task context, inventories tracked structure, reads core documentation and representative implementation/configuration surfaces, checks recent git state, and produces a concise architecture/current-state summary. It performs no repository or external mutation. Unchanged use is nevertheless rejected because Atlassian issue/page bodies, repository rules/docs, and code are consumed as operative context without an explicit hostile-instruction boundary, and its output contract may reproduce externally retrieved task material without a mandatory secret/PII/sensitive-data minimization or redaction gate. Preserve its staged context loading, broad architecture orientation, current-state inspection, and scan-friendly synthesis as adaptation/extraction evidence. Behavioral validation has not been run."