notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 2, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 0, effectiveness design 2. The package contributes a strong integration discipline: detect project validation commands instead of hardcoding them; merge onto a disposable integration branch; run tests after each feature merge; stop on conflicts rather than auto-resolving; run the full suite before the original branch moves; provide exact rollback guidance; and ask before destructive cleanup. Unchanged use is rejected because branch creation and merges, especially the final merge into the original branch, lack a mandatory action-specific authorization boundary immediately before mutation. Repository-controlled CI workflows, Makefiles, manifests, and discovered validation commands are consumed as executable guidance without an explicit hostile-instruction boundary, creating command-execution risk in a malicious or compromised repository. Behavioral validation has not been run."