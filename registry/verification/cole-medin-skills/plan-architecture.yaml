notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 2, evidence discipline 2, dependency coherence 1, portability honesty 2, usefulness/differentiation 2, adversarial resilience 0, effectiveness design 2. The package usefully separates architecture from implementation planning, requires interactive user choice among multiple options, branches explicitly between greenfield and brownfield, grounds brownfield work in the existing codebase, prefers reversible decisions, and uses time-boxed spikes with decision rules for expensive uncertainty. Unchanged use fails the authority hard rule because its output contract may create a tracker page, edit an existing PRD/epic, or write a repository architecture.md without mandatory action-specific authorization immediately before mutation. It also treats tracker pages, repository content, reference documents, and web research as operative input without an explicit hostile-instruction boundary and has no mandatory secret/PII redaction gate before publishing architecture context externally. Preserve the conversational option exploration, reversibility test, spike decision rules, brownfield grounding, and architecture-vs-implementation separation as adaptation/extraction evidence. Behavioral validation has not been run."