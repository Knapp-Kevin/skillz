notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 1, dependency coherence 2, portability honesty 1, usefulness/differentiation 1, adversarial resilience 0, effectiveness design 2. The package is a concise sample-project setup procedure with coherent ordering: copy environment template, install dependencies, start PostgreSQL, apply migrations, start the development server, verify API/database health, and provide cleanup instructions. It also tells the operator to verify project-specific ports and service names. Unchanged use is rejected because it executes dependency installation, persistent database startup, schema migration, and server startup without mandatory action-specific authorization immediately before those consequential actions. It creates a live .env from repository-controlled material without an explicit hostile-instruction or secret-handling boundary, and health-check output lacks a mandatory sensitive-data minimization rule. Preserve the staged setup ordering, health checks, cleanup guidance, and project-specific verification note as adaptation/checklist evidence. Behavioral validation has not been run."