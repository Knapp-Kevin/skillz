notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 2, failure handling 1, evidence discipline 2, dependency coherence 2, portability honesty 2, usefulness/differentiation 2, adversarial resilience 2, effectiveness design 2. The workflow is advisory, limits itself to CLAUDE.md/AGENTS.md steering claims, checks them against git diff/status, and explicitly prefers no edit over context growth. It also separates false/stale rules from new durable invariants and requires explicit caller instruction before edits. One point is withheld on failure handling because the canonical skill does not spell out a clean stop/fallback when no rules file exists or when neither default diff range resolves. No local behavioral validation was run."
