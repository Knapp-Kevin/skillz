notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 1, failure handling 1, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 2. The package is a useful frontend-scoped priming procedure: it limits inspection to client-side surfaces, samples representative components, captures routing/state/styling conventions, includes current git state, and optionally anchors analysis to Jira/Confluence task context. It performs no repository or external mutation. Unchanged use is nevertheless rejected because Atlassian issue/page bodies, repository rules, README material, references, and source files are consumed as operative context without an explicit hostile-instruction boundary, and the output contract may summarize externally retrieved task content without a mandatory secret/PII/sensitive-data minimization or redaction gate. Preserve its scoped-context, representative-component, current-state, convention-summary, and context-window discipline as adaptation/extraction evidence. Behavioral validation has not been run."