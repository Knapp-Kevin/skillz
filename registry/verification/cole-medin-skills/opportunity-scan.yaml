notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 2, evidence discipline 2, dependency coherence 1, portability honesty 2, usefulness/differentiation 2, adversarial resilience 0, effectiveness design 2. The package is differentiated evidence-driven system-improvement guidance. It separates reactive one-run diagnosis from proactive recurrence scanning, requires learning the current host agent's actual extension points before mapping recommendations, reads bounded run artifacts in full while aggregating large log windows, weights an explicit user steer against evidence, refuses to manufacture durable rules for one-off failures, and chooses the smallest useful primitive in the target project's house style. The decisive defect is sensitive-data handling. Proactive mode may inspect session histories containing credentials, secrets, PII, private source, URLs, prompts, or other sensitive content and explicitly permits representative samples to enter agent context, but it provides no mandatory classification/redaction step, secure handling path, or disclosure-authorization boundary. It also does not define prompt-injection handling for untrusted artifact/log content. Current governance therefore rejects unchanged operational adoption while preserving target scoping, capability-first mapping, aggregate-not-ingest discipline, evidence weighting, one-off refusal, and smallest-durable-change selection as adaptation/extraction evidence. Behavioral validation has not been run."
