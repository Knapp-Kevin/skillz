notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 1, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 2. The skill provides a compact post-implementation accounting template covering changed files, validation outcomes, concrete successes and challenges, plan divergences with reasons, skipped items, and feedback into planning/execution guidance. Unchanged use is rejected because it persists an execution-report file without mandatory action-specific authorization immediately before mutation. Plan and repository/implementation context are consumed as operative inputs without an explicit hostile-instruction boundary, potentially sensitive implementation or validation material can be copied into the durable report without mandatory secret/PII/sensitive-data minimization, and validation results are not explicitly required to be grounded in captured evidence rather than recollection. Preserve the implementation-accounting structure, divergence taxonomy, skipped-item accounting, and process-feedback framing as adaptation/extraction evidence. Behavioral validation has not been run."