notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 2, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 1, effectiveness design 2. The package is a strong global-rules design procedure: it distinguishes greenfield architecture decisions from product context, derives brownfield rules from observed evidence, elicits working principles rather than inventing them, moves recurring detail into on-demand references, maps extension seams, and prunes generic always-on guidance. Unchanged use is rejected because it writes or replaces persistent CLAUDE.md/AGENTS.md and reference files without mandatory action-specific authorization immediately before mutation; protecting or backing up an existing rules file is a safeguard, not authorization. Repository-controlled documents, supplied specs/analysis, and web guidance are also consumed as operative content without an explicit hostile-instruction boundary, and commands or source-derived details may be persisted without a mandatory secret/PII/sensitive-data minimization gate. Preserve the evidence-backed derivation, greenfield/brownfield split, lean-context, seam-mapping, and user-elicitation mechanisms as adaptation/extraction evidence. Behavioral validation has not been run."