notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 2, dependency coherence 1, portability honesty 1, usefulness/differentiation 2, adversarial resilience 0, effectiveness design 2. The package is a compact four-stage orchestrator: prime codebase context, create a plan, implement from that plan, then commit, with explicit artifact handoff and a concrete final summary. Unchanged use fails the authority hard rule because its stated purpose is a hands-off autonomous feature build and it chains plan-file creation, source/test/documentation mutation, project- or plan-supplied validation command execution, staging, and git commit without mandatory action-specific authorization immediately before consequential mutations. It also inherits hostile-instruction risk from repository and plan inputs and sensitive/unrelated-file risk from the all-changes commit step. Preserve phase ordering, explicit inter-stage artifacts, and final evidence summary as adaptation/extraction evidence. Behavioral validation has not been run."