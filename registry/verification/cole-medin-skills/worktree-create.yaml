notes: "Rubric: trigger precision 2, procedural clarity 2, authority and safety 0, failure handling 1, evidence discipline 1, dependency coherence 2, portability honesty 1, usefulness/differentiation 2, adversarial resilience 0, effectiveness design 1. The package contributes a differentiated detect-don't-hardcode worktree setup method: inspect the repo once, derive install/config/health requirements, fan out isolated branches, assign non-colliding ports, verify readiness, refuse a ready claim on health failure, and provide cleanup accounting. Unchanged use is rejected because it mutates Git state, copies gitignored config/secrets, installs dependencies, may run code generation, start services, and create or use isolated databases/schemas without mandatory action-specific authorization immediately before those consequential operations. Repository-controlled README/manifests/scripts/workflows/config and discovered commands are consumed as operative instructions without an explicit hostile-instruction boundary. Secret-bearing files are intentionally duplicated into new worktrees without a secure minimization/handling rule beyond ignore checks, and health/error output lacks mandatory redaction. Behavioral validation has not been run."