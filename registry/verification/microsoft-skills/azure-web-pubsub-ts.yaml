notes: Exact complete-package review at the registered Microsoft Skills pin covered the single-file SKILL.md package. Useful material includes Azure Web PubSub service/client setup, Entra-first production authentication, client access token generation, targeted/broadcast/group messaging, group and connection lifecycle, connection permission management, reconnect handling, Express event handlers, and negotiate endpoints. Rejected unchanged because normal flows print credential-bearing client access URLs, send messages to all/users/connections/groups, add or remove group members, close individual/user/group/all connections, grant or revoke connection permissions, emit client events, log user and connection identifiers plus message bodies, and echo user-event data without mandatory hub/resource, recipient/audience, message/data-owner/classification, identity/access, per-action/disconnect, downstream-effect, disclosure, production, or credential-custody authorization. Connection-string and access-key paths are also available. Entra-first guidance, early connection validation, specific-group roles, expiration controls, and handler-before-start guidance are useful safeguards but do not authorize messaging, notification, access mutation, forced disconnects, credential disclosure, or production operation. Behavioral validation remains not-run.