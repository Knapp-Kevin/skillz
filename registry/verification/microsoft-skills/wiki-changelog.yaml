notes: Exact one-file package review. Preserve explicit source-repository resolution, time-bounded changelog grouping, change-type classification, README terminology grounding, linked commit/file citations, and prominent breaking-change treatment. No hard fail: canonical behavior reads Git/repository evidence and produces changelog text only. Limitations are Git-centric assumptions, weak handling of missing/invalid Git state, and insufficiently explicit inspection of diffs or other evidence before generating user-facing descriptions or migration notes from commit history. Any later write, commit, push, release publication, or external communication is a separate consequential action. Behavioral validation remains not-run.