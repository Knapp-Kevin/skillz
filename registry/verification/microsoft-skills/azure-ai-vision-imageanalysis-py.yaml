notes: Exact complete-package review at the registered Microsoft Skills pin. Useful material covers captions, dense captions, tags, object detection, OCR, people detection, smart cropping, URL/local-file analysis, Entra-first authentication, async operation, error handling, and client cleanup. Unchanged adoption is rejected because routine analysis transmits images or image references to an external AI service, may process people and OCR-derived sensitive content, and incurs service cost without distinct data classification, privacy/consent, external-processing/disclosure, output-handling, or budget authorization boundaries. Local-file examples read image bytes from disk and a legacy API-key path remains available through environment variables. Dependency installation is unpinned. Behavioral validation is not-run.