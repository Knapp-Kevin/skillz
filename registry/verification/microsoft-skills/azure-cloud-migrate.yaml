notes: Exact complete-package review covered SKILL.md and the full bundled reference tree for Functions, App Service, Container Apps, runtime conversion, assessment, deployment, and workflow tracking. The package provides valuable cross-cloud migration prior art: assessment-before-mutation, source-directory preservation, scenario routing, service mapping, runtime modernization, application-code conversion, migration-status reporting, service-discovery audits, and an explicit post-migration user choice between local testing and Azure deployment. It also explicitly requires ask_user for destructive actions. Unchanged adoption is nevertheless rejected under the current authority hard fail. The bundled Container Apps deployment path creates Azure resource groups, Log Analytics workspaces, environments, Key Vaults, managed identities, role assignments, container apps, external ingress, scaling configuration, and ACR imports; it also reads Kubernetes secret material and writes it to Key Vault and retrieves the Log Analytics primary shared key into a shell variable. The generic deploy choice and destructive-action rule do not establish mandatory per-resource target/environment, identity/access, security-control, secret/data-owner, credential-custody, network-exposure, production, retention/recovery, or cost authorization for these consequential actions. Preserve the assessment, staged conversion, source-preservation, compatibility, explicit deployment-choice, and progress-reporting patterns for adaptation/reference use with stronger action-specific authority and secret-custody gates. Behavioral validation remains not-run.