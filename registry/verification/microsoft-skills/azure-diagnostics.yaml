notes: Exact complete-package review covered SKILL.md and bundled App Service, Container Apps, Functions, KQL, Resource Graph, AKS, and messaging troubleshooting references. The package preserves strong systematic diagnosis, resource-health-first triage, Azure-side-before-Kubernetes evidence ordering, read-only fallback commands, root-cause evidence discipline, and an unusually explicit AKS guardrail requiring remediation approval before restart, delete, cordon, drain, scale, upgrade, or reconfiguration. Unchanged adoption nevertheless fails the authority hard rule because the App Service path presents production mutations including plan scaling, failed-request tracing, auto-heal/recycling, redeployment, app-setting changes, TLS certificate upload/binding, and DNS changes without a mandatory action-specific authorization checkpoint immediately before each mutation. A generic troubleshooting or remediation request is not sufficient authorization for target, production, availability, network/DNS, certificate, cost, and rollback effects. Preserve read-only diagnostic flow, evidence ordering, query patterns, AKS remediation gating, confidence reporting, and escalation mechanics for adaptation/reference use. Require fresh action-specific authorization before persistent production changes. Behavioral validation remains not-run.