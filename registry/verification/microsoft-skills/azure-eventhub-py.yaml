notes: Complete-package review at the registered Microsoft Skills pin, including checkpointing/partition references and setup_consumer.py. Useful material covers Entra-first authentication, batching, partition routing, consumer groups, checkpointing, async streaming, and bounded receive options. Unchanged adoption is rejected because the normal workflows send event payloads to an external metered service, receive and print event bodies/properties, mutate Blob Storage checkpoint state, and provide a CLI that sends test events without distinct publication/data-disclosure, storage-mutation, downstream-impact, retention, or budget authorization. The CLI also creates async credentials without explicit async credential context management despite the package lifecycle rule. Dependencies are unpinned. Behavioral validation is not-run.