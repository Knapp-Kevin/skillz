notes: Exact one-file package review at the registered Microsoft Skills pin. Useful material covers repository, tag and manifest inspection; Entra-first authentication; context-managed clients; artifact download; repository/manifest property controls; and cleanup of untagged manifests. Unchanged adoption is rejected because normal workflows can alter registry write/delete policy, delete entire repositories, manifests and tags, and automate image deletion without distinct registry/environment scope, mutation, destructive-action, retention, rollback, or approval boundaries. Artifact download writes layers to local storage. Positive safeguards include managed identity guidance and locking production images, but they do not establish action authorization. Installation is unpinned. Behavioral validation is not-run.