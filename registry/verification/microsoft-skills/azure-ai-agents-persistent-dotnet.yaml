notes: Exact package-tree review at the registered Microsoft Skills pin. The package provides useful Azure.AI.Agents.Persistent guidance for .NET, including agent CRUD, threads, messages, runs, streaming, function calling, file search, vector stores, Bing grounding, Azure AI Search, OpenAPI, Azure Functions, MCP, SharePoint, and Fabric tools. It is rejected unchanged under the current hard-fail authority rule because its primary workflow creates remote agents, threads, messages, runs, uploaded files, and vector stores; executes function/tool calls; reaches external search/data/tool services; and deletes remote resources during cleanup without a distinct affirmative authorization boundary appropriate to each consequential action. The function-calling example executes the requested function and submits outputs with toolApprovals: null, so tool availability or procedure flow is not action authorization. Credential examples use environment variables, placeholders, DefaultAzureCredential, and managed identity rather than asking for real secret values conversationally. Adaptation should preserve the SDK guidance while requiring explicit resource/cost/data/tool authorization before mutation or external access. Behavioral validation is not-run; no representative external scenario/adversarial evidence is claimed.