notes: Exact one-file package review. Strong points are mandatory source-repository resolution, actual-code-path tracing, claim-level source evidence, fact-versus-inference separation, explicit unknown markers, source comments on diagrams, source columns in structured tables, progressive disclosure, and concrete validation requirements. The package is generate-only: it instructs generation of Markdown content but does not itself require persistent workspace mutation, infrastructure changes, communications, credentials, or other external side effects, so the authority hard fail does not apply. Deductions reflect Git/VitePress assumptions and rigid minimum diagram/table requirements that can add ceremony or distort proportionality for small documentation scopes. Behavioral validation remains not-run.