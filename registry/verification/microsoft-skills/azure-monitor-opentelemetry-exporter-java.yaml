notes: Exact complete-package review at the registered Microsoft Skills pin, including bundled references/examples.md. Microsoft explicitly marks azure-monitor-opentelemetry-exporter deprecated and instructs migration to azure-monitor-opentelemetry-autoconfigure, so retired is the correct decisive state. The package remains useful migration/reference material for OpenTelemetry traces, metrics, span processors, semantic conventions, exception recording, and Azure Monitor/Application Insights wiring. Unchanged use is additionally unsuitable because examples export telemetry to an external service without a distinct telemetry-data/privacy/classification authorization boundary and demonstrate attributes such as order.id and customer.tier that may become identifying or sensitive production telemetry. Dependency guidance is non-reproducible/inconsistent: SKILL.md recommends azure-monitor-opentelemetry-autoconfigure LATEST while bundled migration examples use 1.0.0. Positive controls include environment-variable connection-string guidance, placeholder explicit credentials, strong deprecation/migration messaging, scoped span cleanup, and exception recording. Behavioral validation is not-run.