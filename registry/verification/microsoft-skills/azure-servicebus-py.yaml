notes: Exact complete-package review at the registered Microsoft Skills pin. The package contains SKILL.md, two substantial references, and an administrative setup CLI covering message publication and receipt, destructive settlement, sessions, scheduled messages, DLQ retry/archive/discard, transactions, competing consumers, and queue/topic/subscription management. Useful Entra-first authentication, reliable messaging, retry, batching, and orchestration patterns remain prior art. Unchanged adoption is rejected because it can publish externally consequential messages, complete or receive-and-delete queued data, dead-letter/reprocess/discard messages, cancel scheduled sends, mutate session state, and create/delete Service Bus entities without explicit entity/downstream scope, data-disclosure, settlement/destructive-action, rollback, or budget authorization. The setup CLI also permits a connection-string credential path. Behavioral validation is not-run.