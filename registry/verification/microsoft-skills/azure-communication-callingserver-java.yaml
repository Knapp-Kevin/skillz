notes: Exact complete-package review at the registered Microsoft Skills pin, including bundled references/examples.md. Microsoft explicitly marks Azure Communication CallingServer as deprecated and directs new development to Call Automation, making retirement the truthful decisive state rather than current unchanged eligibility. The package remains useful for recognizing legacy dependencies, mapping renamed classes, and migrating existing CallingServer code. The legacy recording example starts, pauses, resumes and stops external call recording without a mandatory participant-consent/privacy authorization boundary, while client creation relies on a connection-string placeholder rather than the hardened identity patterns used by newer packages. Retain as bounded migration/reference evidence only. Behavioral validation is not-run.