notes: Exact one-file review at the registered Microsoft Skills pin. Useful material covers CloudEvents/EventGridEvent schemas, Entra-first authentication, batching, namespace topics, sync/async publishing and routing metadata. Unchanged adoption is rejected because the core workflow publishes application payloads to an external event service that can trigger downstream systems and incur cost without distinct topic/audience, data-disclosure, publication/communication, downstream-impact or budget authorization. The async example also fails to close its DefaultAzureCredential despite the package's stated lifecycle rule. Installation is unpinned. Behavioral validation is not-run.