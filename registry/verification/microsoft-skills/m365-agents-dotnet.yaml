notes: Exact complete-package review at the registered Microsoft Skills pin. Useful Microsoft 365 Agents SDK guidance covers ASP.NET Core hosting, AgentApplication routing, token validation/MSAL authentication, conversation state and Copilot Studio connectivity. Rejected unchanged because normal handlers send external activities, the Copilot Studio client starts conversations and transmits prompts, and error handling deletes conversation state without distinct affirmative outbound-message, data-transmission and state-mutation authorization gates. Development mode intentionally leaves the incoming route without RequireAuthorization, which is acceptable as a local-development pattern but requires a hard production boundary. Credential examples use placeholders/configuration rather than conversational secret collection. Behavioral validation is not-run.