notes: Exact static review covered the complete pinned azure-quotas package: SKILL.md, references/commands.md, references/advanced-commands.md, and the bundled PowerShell/bash quota-check scripts. Strong mechanisms include quota resource-name discovery instead of ARM-name guessing, CLI-first read inspection, explicit usage/limit arithmetic, regional comparison, unsupported-provider fallbacks, and a useful warning that No Limit or Unlimited responses do not establish real capacity. Unchanged adoption fails current authority governance because the skill and command reference directly instruct az quota update/create and Microsoft.Quota provider registration without a mandatory action-specific authorization checkpoint immediately before those subscription-scoped mutations. The required az extension add prerequisite also mutates the local CLI environment without an explicit approval boundary. Adaptation should default to read-only list/show/usage operations and gate extension installation, provider registration, quota requests, and quota creation separately with target/scope confirmation and explicit authorization. Static rejection does not establish runtime behavior; behavioral validation remains not-run.