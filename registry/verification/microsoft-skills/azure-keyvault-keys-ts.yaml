notes: Exact complete-package review at the registered Microsoft Skills pin covered SKILL.md plus references/keys.md and references/secrets.md. Useful material includes Key Vault key creation/import, key lifecycle and rotation policies, cryptographic encrypt/decrypt/sign/verify/wrap/unwrap operations, backup/restore, secret CRUD/versioning, recovery, error handling, managed-identity guidance, and least-privilege reminders. Rejected unchanged because the package can create/import/rotate/disable/delete/purge/restore cryptographic keys, alter key operations and rotation policy, perform sensitive cryptographic operations, and mutate/delete/restore secrets without mandatory vault/resource, key-purpose, per-operation, destructive-action, recovery, production, or security-control authorization. The bundled secrets reference also demonstrates literal secret material, printing retrieved secret values, storing API keys and connection strings as examples, bulk-exporting every enabled secret into process memory, and writing secret backup material to a local file without mandatory secure external custody, disclosure, minimization, or retention boundaries. Positive advice about managed identity, soft-delete, purge protection, least privilege, and backing up before deletion is useful but does not constitute action authorization. Behavioral validation remains not-run.