notes: Exact static review covered the top-level SKILL.md and its bundled AKS autoscaler, rightsizing, Spot, VPA, and CLI reference material. The nested front-mattered azure-kubernetes-automatic-readiness package is independently eligible and is not dispositioned by this record. Useful mechanisms include explicit Day-0 versus Day-1 decision framing, AKS Automatic as a conservative default, strong networking/security/reliability recommendations, secret non-disclosure, subscription-context discovery without asking the user to paste identifiers, staged upgrade guidance, and scenario-specific deep dives. Unchanged adoption fails the authority hard rule because the workflow is explicitly for creating/configuring AKS and the bundled CLI reference directly supplies commands for billable cluster creation, workload identity, autoscaling, cluster credential acquisition, and monitoring enablement without a mandatory action-specific approval immediately before mutation. Static rejection does not establish runtime behavior; behavioral validation remains not-run.