notes: Exact complete-package review covered SKILL.md, auth-best-practices.md, patterns.md, policies.md, troubleshooting.md, and all four bundled SDK quick references. The package offers valuable Azure API Management AI-gateway mechanics including managed-identity backend authentication, RBAC-backed model access, token and request limiting, semantic caching, token metrics, content safety/jailbreak filtering, multi-backend routing, streaming, MCP exposure, multi-tenant metering, and troubleshooting. Unchanged adoption is rejected under the current authority hard fail. Normal documented flows enable APIM identity, create RBAC role assignments and APIM backends, import APIs, modify policy and routing behavior, alter content-safety/rate-limit security controls, expose APIs to agents as MCP-compatible tools, and test live AI endpoints without mandatory target/resource, identity/access, production-change, security-control, downstream-effect, data-transfer, telemetry-disclosure, or cost authorization. SKILL.md also instructs `az apim subscription keys list`, which can emit live APIM subscription credentials into tool/conversational output; passing a key to curl is shown without a secure-custody boundary. The auth reference strongly prefers managed identity and least privilege, but those are safeguards rather than action authorization. Preserve the gateway-policy, managed-identity, caching, cost-control, safety, load-balancing, MCP, and troubleshooting patterns for adaptation/reference use with explicit resource, identity/access, production-routing, security-control, data/disclosure, downstream-effect, cost, and credential-custody authorization. Behavioral validation remains not-run.