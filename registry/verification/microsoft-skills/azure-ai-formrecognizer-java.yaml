notes: Exact complete-package review at the registered Microsoft Skills pin. Useful Document Intelligence guidance covers current-generation migration, prebuilt analysis, local-file and URL analysis, custom models, classifiers and administration. Rejected unchanged because local files and potentially sensitive documents including IDs, invoices, receipts, tax forms and health-insurance cards can be transmitted to an external metered service without a mandatory approved-data-handling boundary, while custom models/classifiers are built and models deleted without distinct lifecycle/cost authorization. Bundled examples print extracted identity and document fields. The skill also pins 1.0.0 while identifying 1.0.7 as latest GA and instructing a current-doc lookup, so implementation is version-sensitive. Behavioral validation is not-run.