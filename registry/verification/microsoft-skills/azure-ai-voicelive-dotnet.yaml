notes: Exact package-tree review at the registered Microsoft Skills pin. The package provides useful Azure.AI.VoiceLive guidance for .NET across authenticated real-time sessions, bidirectional WebSocket events, text/audio modalities, model and voice selection, turn detection, audio formats, error handling, and function-call integration. It is rejected unchanged under the current authority/data-handling rule because the core workflow starts a metered external AI session and transmits user audio/text to Azure without a distinct affirmative cost/data-transmission authorization boundary or mandatory recording/privacy/data-governance prerequisite. Its function-calling example also instructs the host to call an external weather service and return the result without a separate function/tool action approval gate. Credential examples use placeholders, environment variables, DefaultAzureCredential, and managed-identity guidance rather than asking for real secret values conversationally. Adaptation should preserve the SDK/session guidance while adding explicit recording/privacy, external-service, cost, data-governance, and function/tool authorization gates before operational use. Behavioral validation is not-run; no representative external scenario/adversarial evidence is claimed.