notes: Exact static review covered the complete 14-file pinned azure-storage package: SKILL.md plus 13 bundled Markdown references covering authentication, SDK usage, Blob Storage, Queue Storage, File Shares, Data Lake, and Tables. Useful mechanisms include clear service-selection boundaries, access-tier and redundancy summaries, managed-identity production guidance, least-privilege RBAC, explicit warnings against hardcoded credentials and connection strings, and concise multi-language SDK references. Unchanged adoption fails the current authority gate because the package directly instructs Azure blob uploads and overwrite-capable SDK writes, local package installation across multiple ecosystems, MCP/setup enablement, credential or certificate rotation, and enabling Microsoft Defender for Cloud without a mandatory action-specific authorization checkpoint immediately before those consequential mutations. Its blob get/download flows can also expose arbitrary stored content without an explicit sensitive-data disclosure/minimization boundary. Retain the read-oriented storage taxonomy, authentication safeguards, and SDK patterns as adaptation/reference evidence, but require explicit scoped authorization for mutations and disclosure controls for storage reads. Behavioral validation remains not-run.