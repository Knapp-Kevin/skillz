notes: Exact complete-package review at the registered Microsoft Skills pin covered SKILL.md plus bundled sas-tokens.md and streaming.md references. Useful material includes Blob Storage client hierarchy, container/blob CRUD, streaming and staged block uploads, range downloads, browser uploads, copy operations, metadata/HTTP headers, progress/abort handling, authentication options, and SAS mechanics. Rejected unchanged because normal flows create/delete persistent containers and blobs, upload local or browser-selected data, mutate metadata/headers, stage and commit blocks, copy remote content, and materialize downloaded data without mandatory resource, data-owner/classification, mutation/destructive-action, production, retention/recovery, or cost authorization. Credential paths include account keys, connection strings, and SAS tokens. The SAS reference can mint broad write/delete/account-scoped delegation and explicitly prints credential-bearing SAS URLs, creating a secret-disclosure risk; downloads may also print or write blob contents without mandatory sensitive-data minimization or custody controls. Entra-first authentication, short-lived SAS guidance, HTTPS, least privilege, abort handling, and streaming are useful safeguards but do not authorize storage mutation, data disclosure, credential delegation, destructive lifecycle actions, or production use. Behavioral validation remains not-run.