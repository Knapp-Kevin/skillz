notes: Exact complete-package review at the registered Microsoft Skills pin covered the single SKILL.md file. Useful material includes PostgreSQL client and pool configuration, SSL, Entra ID token authentication and refresh, parameterized queries, transactions and rollback, typed query patterns, error handling, graceful shutdown, and pool sizing. Rejected unchanged because ordinary examples insert and mutate durable records, run arbitrary database queries and transactions, acquire and use access tokens as database passwords, offer password and credential-bearing connection-string authentication, and may log database error details without mandatory target/environment, database/data-owner, query/mutation, production, credential-custody, sensitive-output, retention/recovery, or consequential-operation authorization. Parameterized queries, SSL, transaction rollback, and Entra-first guidance reduce important risks but do not establish authority for database writes or sensitive-data access. Behavioral validation remains not-run.