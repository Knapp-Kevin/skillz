notes: >-
  Complete-package review covered SKILL.md and assets/template.py at the registered pin. The package is coherent and useful as FastAPI router prior art, but unchanged use is rejected under the authority hard fail. The bundled update endpoint authenticates the caller yet leaves the ownership check commented out as optional; the delete endpoint authenticates but performs no ownership/resource authorization before deletion. Both routes can mutate durable application state, and delete is destructive. Trigger guidance also does not establish non-trigger or authority boundaries. Preserve the CRUD structure, dependency injection, response models, and exception patterns only after adapting explicit resource-scope, ownership/role, destructive-action, and disclosure controls. No separate behavioral/adversarial evidence was run.