notes: Exact one-file package review. Preserve source-repository resolution, audience-specific Contributor/Staff Engineer/Executive/Product Manager decomposition, language-aware contributor guidance, evidence-linked diagrams and tables, and concrete path/name/Mermaid validation checks. Hard fail for unchanged adoption: after repository-context discovery, the procedure directs creation of onboarding/index.md plus four audience guides without a mandatory action-specific authorization checkpoint immediately before persistent workspace mutation. A second material weakness is unsupported-claim risk: executive and product requirements demand ownership, bus factor, cost/scaling, SLA/current metrics, roadmap, compliance, planned status, and recommendations without a mandatory rule to mark unavailable evidence as unknown rather than infer it. Behavioral validation remains not-run.