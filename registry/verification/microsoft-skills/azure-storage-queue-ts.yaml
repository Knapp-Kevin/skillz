notes: Exact complete-package review at the registered Microsoft Skills pin covered the single-file SKILL.md package. Useful material includes Queue Storage client hierarchy, queue CRUD and metadata, message send/receive/peek/update/delete/clear operations, visibility timeout management, poison-message routing, worker/batch patterns, message encoding, SAS generation, error handling, and authentication choices. Rejected unchanged because normal flows create/delete persistent queues, mutate queue metadata, publish arbitrary external message payloads, receive and print message content and pop receipts, delete individual messages, clear entire queues, repeatedly execute downstream handlers, move poison-message payloads between queues, and update durable message content/visibility without mandatory resource, payload/data-owner/classification, downstream-effect, per-action/destructive-action, production, retention/recovery, or cost authorization. Credential paths include account keys, connection strings, SAS tokens, and SAS generation; queue SAS grants read/add/update/process and the account SAS example grants broad queue service permissions. Entra-first production guidance, poison handling, visibility extension, dequeue-count checks, and batch patterns are useful safeguards but do not authorize external publication, payload disclosure, downstream actions, destructive message lifecycle, delegated credentials, or production use. Behavioral validation remains not-run.