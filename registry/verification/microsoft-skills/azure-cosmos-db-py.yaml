notes: Exact complete-package review at the registered Microsoft Skills pin, including five references and three Python templates. Useful material covers RBAC-first authentication, emulator isolation, parameterized queries, partition-key strategy, typed service layers, testing, graceful degradation, connection lifecycle and CRUD. Unchanged adoption is rejected because normal workflows create, update and delete durable application data without a distinct data-scope, tenant/workspace authorization, mutation, destructive-action, retention, rollback or approval boundary. Although the skill states partition-key access must match user authorization, bundled service examples accept workspace_id/author_id and perform writes/deletes without establishing the caller authorization contract. The package also contains inconsistent sync-versus-async guidance and broad exception/traceback logging that needs secret/privacy-safe adaptation. Installation is unpinned. Behavioral validation is not-run.