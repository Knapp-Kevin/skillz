notes: Exact one-file package review. Strong points are concrete VitePress scaffolding, dark-only Mermaid theme configuration, layered CSS/inline-style handling, SSR-aware use of setup/onMounted instead of enhanceApp, click-to-zoom behavior, Markdown compatibility post-processing, and explicit build-output location. Unchanged adoption fails the current authority hard rule because it directs creation of a persistent wiki-site tree and package.json, dependency installation with npm install, and execution of a production build without a mandatory action-specific authorization checkpoint immediately before those writes and executions. The package also assumes Node/npm, VitePress/Vue, and specific Mermaid plugin behavior, limiting portability. Preserve the packaging and rendering mechanisms for adaptation under an explicit host-side authorization boundary. Behavioral validation remains not-run.