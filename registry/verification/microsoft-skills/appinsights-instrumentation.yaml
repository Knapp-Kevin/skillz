notes: Exact complete-package review covered SKILL.md, LICENSE.txt, examples/appinsights.bicep, scripts/appinsights.ps1, references/aspnetcore.md, auto.md, container-apps.md, nodejs.md, python.md, and the four SDK quick references. The package offers useful App Insights/OpenTelemetry selection and setup guidance, distinguishes guidance requests from explicit component-addition requests, and includes practical resource, application-code, Container Apps, tracing, and KQL references. Unchanged adoption is rejected under the current authority hard fail. Despite routing explicit mutation requests toward azure-prepare, the package itself instructs creation of Log Analytics and Application Insights resources, App Service/Container App/Function App configuration mutation, application/IaC changes, telemetry export, and eventual deployment without a mandatory action-specific authorization boundary for target subscription/resource group/app, production change, cost, telemetry destination/data classification, or deployment. The Container Apps reference retrieves the workspace primary shared key into a shell variable and performs secret/configuration mutation without a credential-custody authorization gate. Guidance to store the App Insights connection string as a Container Apps secret is useful but does not cure the broader missing authority boundary. Preserve instrumentation architecture, OpenTelemetry initialization, secret-reference, tracing, resource-topology, and KQL mechanics for adaptation/reference use with explicit target/resource, production-change, cost, telemetry-data/disclosure, and credential-custody approval gates. Behavioral validation remains not-run.