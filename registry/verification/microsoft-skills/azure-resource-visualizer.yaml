notes: Exact static review covered the complete pinned azure-resource-visualizer package: SKILL.md, assets/example-diagram.md, assets/template-architecture.md, and references/azure-resource-graph.md. Useful mechanisms include explicit resource-group selection, read-only Azure inspection, complete resource inventory, network/data/identity/configuration relationship mapping, verification-before-diagram discipline, meaningful secret placeholders instead of secret values, layered Mermaid synthesis, and a structured architecture-document template. The Azure cloud workflow itself explicitly prohibits modifying or deleting resources. The hard fail is the bundled Azure Resource Graph reference, which presents `az extension add --name resource-graph` as a prerequisite; that command installs persistent local tooling without a mandatory action-specific authorization checkpoint immediately before the host mutation. Under current authority governance, unchanged adoption is therefore rejected. Preserve the read-only topology and documentation methods as adaptation/reference evidence, but require host authorization before any extension installation. Behavioral validation remains not-run.