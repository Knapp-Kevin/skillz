notes: Exact complete-package review at the registered Microsoft Skills pin. The package is a single SKILL.md and offers useful TypeScript prior art for text translation, transliteration, language detection, single-document translation, batch document translation, status/pagination handling, and Azure identity integration. Rejected unchanged under the current authority and secret/sensitive-data hard rules because normal examples transmit arbitrary user text and document content to Azure without mandatory data-classification, subject/data-transfer, destination/region, minimization, retention, or output-disclosure boundaries. Batch document translation generates credential-bearing source and target container SAS URLs, sends them to the translation service, starts a billable service-side operation, and writes translated content into persistent target storage without sufficient credential-custody, storage-scope, write/downstream-effect, overwrite/recovery, or budget authorization. API-key authentication is also shown without a repository-enforced secure external credential path. Behavioral validation remains not-run.