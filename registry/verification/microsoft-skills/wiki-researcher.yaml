notes: Exact one-file package review. Strong points are mandatory repository-context resolution, tracing actual code paths rather than guessing from names or conventions, reading real implementations, following call chains, distinguishing fact from inference, explicit evidence standards for architectural and data-flow claims, confidence ratings, and open-question boundaries. The procedure is read-only and does not require persistent workspace mutation, infrastructure changes, communications, credentials, or other consequential side effects, so the authority hard fail does not apply. Deductions reflect Git-specific repository resolution, forcing a user question even when the host may already know the repository context, a fixed five-iteration research ceremony, and requiring at least one Mermaid diagram and table in every iteration regardless of whether they improve the answer. Behavioral validation remains not-run.