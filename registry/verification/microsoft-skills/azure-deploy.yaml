notes: Exact complete-package review covered SKILL.md and the bundled pre-deploy checklist, global rules, authentication guidance, live RBAC verification, azd/azcli/Bicep/Terraform/CI-CD recipes, SQL managed-identity and Entra-auth guidance, EF migrations, post-deployment verification, troubleshooting, and SDK references. This package is unusually strong deployment prior art: it requires a prior azure-prepare plan and azure-validate proof, forbids self-asserting validation, confirms actual subscription and region, checks resource-group and Container Apps conflicts, requires ask_user for destructive, cost-impacting, and security/RBAC actions, verifies RBAC propagation, and performs structured post-deploy verification. Unchanged adoption still fails the authority hard rule because required post-deployment guidance can grant managed identities SQL permissions and apply EF Core schema migrations after deployment without a dedicated action-specific authorization boundary immediately before those separate persistent identity/access and database changes. The user's request to deploy and the generic destructive-action rule do not automatically authorize every post-deploy permission/schema mutation. Preserve the validation-proof, target confirmation, conflict detection, destructive/security/cost confirmation, recipe selection, recovery, RBAC health-check, and verification mechanics for adaptation/reference use. Require fresh database-owner, identity/access, schema-migration, production, target, and rollback authorization before post-deploy mutation. Behavioral validation remains not-run.