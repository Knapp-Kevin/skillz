notes: Exact complete-package review at the registered Microsoft Skills pin covered SKILL.md plus bundled semantic-ranking.md and vector-search.md references. Useful material includes Azure AI Search client setup, index creation/configuration, document upload and batch mutation, keyword/vector/hybrid/semantic search, filtering/facets, autocomplete/suggestions, integrated vectorization, captions/answers, and tuning guidance. Rejected unchanged because normal flows create or alter persistent indexes, upload/merge/delete indexed documents, transmit query and content data to Azure search/semantic/vectorization services, permit an admin-key credential path, and print returned content/debug information without mandatory service/index, data-owner/classification, document mutation/deletion, production, credential-custody, external-disclosure, retention/recovery, or sensitive-output authorization. Entra-first examples, filters, and search-quality best practices are useful safeguards but do not establish authority for data ingestion, deletion, disclosure, or production index mutation. Behavioral validation remains not-run.