notes: Exact complete-package review at the registered Microsoft Skills pin covered SKILL.md plus references/bulk-operations.md and references/query-patterns.md. Useful material includes Entra-first authentication, partition-key design, point reads, parameterized queries, continuation pagination, CRUD, bulk execution, indexing, diagnostics, retry handling, and client lifecycle. Rejected unchanged because the package creates databases and containers, creates/replaces/upserts/deletes durable items, and performs bulk mutation/destruction without mandatory environment/resource, data-scope, mutation, destructive-action, recovery/retention, or budget/throughput authorization boundaries. The package says to confirm destructive actions, but confirmation is not a substitute for action authorization under current governance. Query and diagnostic patterns can also expose item content or operational detail without mandatory classification, minimization, or output-disclosure controls. DefaultAzureCredential is a positive credential pattern and no literal secret value is required by the reviewed package. Behavioral validation remains not-run.