notes: Exact complete-package review at the registered Microsoft Skills pin. The package contains SKILL.md plus audio-streaming and function-calling references. Useful mechanics include bidirectional WebSocket audio, microphone capture/playback, VAD, transcription, event handling, function calling, browser support, and cleanup. Rejected unchanged under current authority and secret/sensitive-data rules because normal flows capture and transmit live microphone audio, transcripts, conversation content, locations, and tool arguments/results to Azure or downstream services without mandatory subject consent, data-classification, destination/region, minimization, retention/redaction, or output-disclosure boundaries. The function-calling reference enables model-triggered external actions including appointment booking and other API calls without a real action-specific authorization gate; prompting the model to confirm details is not equivalent to authorization. API-key authentication is presented alongside identity credentials without a repository-enforced secure external credential path, and personal/custom voice identifiers introduce additional identity/biometric-sensitive context without explicit authority. Behavioral validation remains not-run.