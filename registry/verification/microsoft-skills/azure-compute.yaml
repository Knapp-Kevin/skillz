notes: Exact complete-package review covered SKILL.md and the bundled VM recommendation, creation, troubleshooting, capacity reservation, Essential Machine Management, pricing, quota, VM-family, IaC, delivery, security, networking, and management references. The package contains unusually strong planning safeguards for VM/VMSS creation: read-only SKU/image/quota validation, adaptive requirement gathering, a user-visible Plan Card, cost surfacing, separation of artifact generation from live apply, and an explicit extra confirmation before compute_vm_create / compute_vmss_create. Unchanged adoption still fails the authority hard rule because the capacity-reservation workflow proceeds from gathered parameters directly to creation of billable CRG/reservation resources, while EMM guidance orchestrates subscription-level enrollment/offboarding, resource-provider registration, workspace creation, managed-identity/security configuration, and related operations without a mandatory action-specific authorization checkpoint immediately before each consequential mutation. Preserve the routing, validation, recommendation, cost, plan-card, and generate-only mechanics for adaptation/reference use. Require explicit target-resource/subscription, cost, identity/access, security-control, production, and destructive/offboarding authorization before live mutation. Behavioral validation remains not-run.