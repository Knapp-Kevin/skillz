notes: Exact complete-package review at the registered Microsoft Skills pin. The package is a single SKILL.md and provides useful TypeScript prior art for Azure Content Safety text/image analysis, severity handling, blocklists, REST error handling, and constrained production credentials. Rejected unchanged under the current hard authority and sensitive-data rules because normal analysis examples transmit arbitrary text/images to Azure without a mandatory disclosure/privacy authority gate; remote blob URL analysis lacks a trusted-source/network boundary; blocklist examples create, mutate, and delete persistent service state without action-specific approval; and recommended moderation logging lacks minimization, redaction, and retention constraints. Behavioral validation remains not-run.