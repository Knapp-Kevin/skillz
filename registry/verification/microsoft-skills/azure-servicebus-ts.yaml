notes: Exact complete-package review at the registered Microsoft Skills pin covered SKILL.md plus bundled error-handling.md and queues-topics.md references. Useful material includes Service Bus queues/topics/subscriptions, batching, sessions and session state, scheduling/cancellation, receive modes, message settlement, dead-letter processing, lock renewal, retries, graceful shutdown, idempotent processing, and poison-message handling. Rejected unchanged because normal flows publish payloads externally, complete/delete or otherwise settle durable messages, dead-letter/defer/abandon messages, schedule future delivery, write session state, reprocess DLQ payloads, and invoke downstream business handlers without mandatory destination/resource, payload/data-owner, downstream-effect, settlement/destructive-action, production, retention/recovery, or budget authorization. References also print raw message bodies, DLQ payloads, entity paths, namespaces, and detailed errors without mandatory sensitive-data minimization or redaction. Entra-first authentication, peek-lock, idempotency, DLQ handling, retry guidance, and graceful shutdown are useful safeguards but do not establish authority for external publication, message destruction, downstream effects, or sensitive output. Behavioral validation remains not-run.