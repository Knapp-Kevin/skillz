notes: Exact complete-package review at the registered Microsoft Skills pin covered the single SKILL.md file. Useful material includes Azure-hosted Playwright setup, Entra/workload identity, cloud browser scaling, manual connections, CI/CD integration, reporter configuration, traces/videos, migration from the retired package, and worker-scaling patterns. Rejected unchanged because normal flows execute browser automation against external targets, establish billable cloud browser sessions, can expose network-reachable test targets through exposeNetwork, publish test results and artifacts to Azure, and configure CI identity-token permissions without mandatory target/environment, test-data, mutation/external-side-effect, publication/retention, network-exposure, cost, or production authorization boundaries. Test suites can themselves perform consequential writes or communications against the chosen target, so merely instructing the host to run them does not supply authorization. Positive use of Entra identity and production credential guidance is useful but does not cure these missing action boundaries. Behavioral validation remains not-run.