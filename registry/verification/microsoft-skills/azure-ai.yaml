notes: Exact complete-package review covered SKILL.md, references/auth-best-practices.md, and all 15 bundled SDK quick references. The package is a concise router across Azure AI Search, Speech, OpenAI, Document Intelligence, Vision, Translation, Transcription, and Content Safety, with useful managed-identity guidance and condensed SDK mechanics. Unchanged adoption is rejected under the current authority and sensitive-data hard fail. The bundled search references recommend document indexing, buffered uploads, and create_or_update_index operations; transcription guidance sends audio files or blob-backed content to Azure and uses a subscription key string from an environment variable; the broader router also encourages OCR, speech synthesis, translation, vision, content-safety, and model interactions that can transmit user or application content externally. None of those workflows requires mandatory data-owner/classification, external-disclosure/model-transfer, target-resource, persistent-mutation, production, retention, cost, or action-specific credential-custody authorization. The auth guide's managed-identity, narrow-RBAC, no-hardcoded-secret, and Key Vault recommendations are strong safeguards but do not themselves authorize consequential operations or sensitive-data transfer. Preserve service-selection, hybrid/vector search, authentication, transcription, OCR, translation, and SDK patterns for adaptation/reference use with explicit data-transfer, target-resource, mutation, production, retention, cost, and credential-custody gates. Behavioral validation remains not-run.