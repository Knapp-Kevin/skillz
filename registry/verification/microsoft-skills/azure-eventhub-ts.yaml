notes: Exact complete-package review at the registered Microsoft Skills pin covered SKILL.md plus references/checkpointing.md and references/event-processing.md. Useful material includes Entra-first producer/consumer setup, event batching, partition targeting, consumer groups, event positions, persistent Blob checkpointing, load balancing, lag monitoring, graceful shutdown, retry/error handling, and idempotent-processing guidance. Rejected unchanged because normal flows publish event payloads to an external Event Hub, create/update persistent Blob checkpoint state, and may drive downstream processing without mandatory destination, payload-classification/disclosure, environment/resource, write, downstream-effect, retention/recovery, or budget/throughput authorization. The bundled checkpointing reference also presents storage and Event Hubs connection strings as normal credential paths, while subscription examples log arbitrary event bodies, properties, and system properties without mandatory secret/PII minimization or redaction controls. DefaultAzureCredential and ManagedIdentityCredential are positive credential patterns, but they do not cure the missing action and data authority boundaries. Behavioral validation remains not-run.