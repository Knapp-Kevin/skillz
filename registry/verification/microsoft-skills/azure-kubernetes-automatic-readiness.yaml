notes: Exact static review covered SKILL.md and all four bundled references: constraint-spec-v1.yaml, common-fixes.md, mcp-integration.md, and migration-guide-summary.md. Strong mechanisms include a mandatory read-only cluster-assessment boundary, conservative secret handling, explicit approval before any file write, deterministic patch versus context-dependent remediation separation, combined-diff approval for batch fixes, offline fallback, and explicit constraint-spec version disclosure. Unchanged adoption fails the authority hard rule because the bundled migration guide supplies direct procedures for billable AKS cluster creation, credential acquisition, staging deployment, OIDC/workload-identity enablement, and old-cluster deletion without a mandatory action-specific authorization checkpoint immediately before each consequential external mutation. The top-level assessment guardrail is stronger than the migration reference it routes users into, so adaptation can preserve the assessment mechanics while adding per-action authorization to migration guidance. Static rejection does not establish runtime behavior; behavioral validation remains not-run.