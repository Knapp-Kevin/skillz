notes: Exact package-tree review at the registered Microsoft Skills pin. Strong authoring guidance emphasizes concise context, progressive disclosure, explicit source context for SDK/API skills, current-documentation verification, safe credential patterns, lifecycle cleanup, structured package layout and clear best practices. Bundled Python helpers can initialize, validate and package local skill directories, so use requires ordinary host authorization for the target filesystem, but the package does not cross the hard consequential-authority boundary by itself and does not solicit actual secrets into conversational context. Upstream scripts remain reference-package tooling rather than skillz-owned execution machinery. Behavioral validation is not-run; Azure SDK/authentication conventions and host skill formats remain freshness-sensitive.