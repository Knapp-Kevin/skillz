notes: Exact package-tree review at the registered Microsoft Skills pin. The package clearly separates management-plane scheduler/task-hub provisioning from the Durable Task data plane and uses sound Azure credential guidance. Rejected unchanged because normal workflows create Dedicated or Consumption schedulers, task hubs and retention policies, scale capacity and IP allowlists, and delete hubs/schedulers without a distinct affirmative resource, cost, network, retention or deletion authorization boundary. Preserve as adaptation/reference evidence with explicit scheduler-cost, network, retention and lifecycle gates. Behavioral validation is not-run.