notes: Exact package-tree review at the registered Microsoft Skills pin. The package provides useful Azure API Center management guidance for .NET across centralized API inventory, workspaces, APIs, versions, definitions, environments, deployments, metadata schemas, specification import/export, authentication, lifecycle metadata, discovery, and error handling. It is rejected unchanged under the current authority/data-handling rule because normal workflows create or update Azure API Center services, workspaces, APIs, versions, definitions, environments, deployments, and metadata schemas and import API specifications without distinct affirmative infrastructure-mutation/cost/data-transmission authorization boundaries or a mandatory approved-data-handling prerequisite. The specification-import example reads a local OpenAPI file and transmits its contents to Azure. Credential guidance otherwise uses environment variables, placeholders, DefaultAzureCredential, and managed identity rather than conversationally solicited secrets. Adaptation should preserve the API-governance and SDK guidance while adding explicit cloud-resource mutation, cost, local-read, and specification/data-transmission authorization gates before operational use. Behavioral validation is not-run; no representative external scenario/adversarial evidence is claimed.