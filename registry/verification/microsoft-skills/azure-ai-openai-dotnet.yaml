notes: Exact package-tree review at the registered Microsoft Skills pin. The package provides useful Azure.AI.OpenAI guidance for .NET, including chat completions, streaming, structured outputs, reasoning models, Azure AI Search RAG, embeddings, image generation, audio transcription/text-to-speech, authentication, error handling, and function/tool calling. It is rejected unchanged under the current authority/data-handling rule because its primary examples directly invoke metered external AI services and transmit prompts, search-derived content, audio, image-generation requests, and other user/application data without a distinct affirmative cost/data-transmission authorization boundary or mandatory approved-data-handling prerequisite. The function-calling example only surfaces requested tool calls and the best-practices section says to validate tool arguments before execution, which is useful safety evidence but does not authorize the external service calls themselves. Credential examples use environment variables, placeholders, DefaultAzureCredential, and managed identity rather than asking for real secret values conversationally. Adaptation should preserve the SDK/API guidance while adding explicit cost, data-governance, and external-service authorization gates before operational use. Behavioral validation is not-run; no representative external scenario/adversarial evidence is claimed.