notes: Exact static review covered the complete 43-file pinned azure-upgrade package: SKILL.md plus 42 bundled Markdown/Python reference, template, workflow, and migration files. Strong mechanisms include mandatory assessment before upgrade, explicit target plan/SKU confirmation, ask_user before creating Azure resources and before destructive/irreversible changes, keeping the original workload intact until validation, documented rollback, and idempotent/resumable automation. Unchanged adoption fails current secret-handling governance because the bundled Functions automation reads the live AzureWebJobsStorage connection string into a shell variable and passes it directly to blob list/download operations, unnecessarily surfacing credential material instead of using an identity-based secure credential path. The same prerequisite sequence installs the resource-graph Azure CLI extension without a distinct action-specific authorization checkpoint. Retain the assessment, confirmation, rollback, and migration-planning mechanics as adaptation/reference evidence. Behavioral validation remains not-run.