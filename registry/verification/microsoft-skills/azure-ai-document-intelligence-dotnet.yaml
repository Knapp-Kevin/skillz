notes: Exact package-tree review at the registered Microsoft Skills pin. The package provides useful Azure.AI.DocumentIntelligence guidance for .NET, including prebuilt invoice/receipt/layout/ID analysis, custom models and classifiers, authentication, confidence handling, diagnostics, and long-running operations. It is rejected unchanged under the current hard-fail authority rule because its primary workflows include BuildDocumentModelAsync, BuildClassifierAsync, and DeleteModelAsync without a distinct affirmative authorization boundary appropriate to creating or deleting Azure-side resources. It also demonstrates transmission of potentially sensitive invoices, receipts, identity documents, tax forms, health-insurance cards, and arbitrary documents to an external service without making approved data handling/privacy authorization a mandatory precondition. API-key and SAS examples use placeholders/environment variables rather than asking for actual secret values conversationally, which is preserved as positive evidence. Adaptation should retain the technical guidance while adding explicit mutation/cost authorization and document-data governance gates. Behavioral validation is not-run; no representative external scenario/adversarial evidence is claimed.