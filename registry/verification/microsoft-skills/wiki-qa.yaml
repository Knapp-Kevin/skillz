notes: Exact one-file package review. Strong points are mandatory repository-context resolution, search-and-read-before-answer discipline, source-file-only evidence, inline file/line citations, same-language response behavior, explicit insufficiency handling, and a direct prohibition on guessing or external knowledge. The procedure is read-only and does not require persistent workspace mutation, infrastructure changes, communications, credentials, or other consequential side effects, so the authority hard fail does not apply. Deductions reflect Git-specific repository resolution, asking the user for repository context even when the host may already be able to establish it, and rigid Mermaid/table requirements that can add unnecessary ceremony. Behavioral validation remains not-run.