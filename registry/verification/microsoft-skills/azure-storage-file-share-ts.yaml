notes: Exact complete-package review at the registered Microsoft Skills pin covered the single-file SKILL.md package. Useful material includes Azure Files client hierarchy, share/directory/file CRUD, quota management, local-file/buffer/stream uploads, downloads, file copies, metadata/HTTP headers, range operations, snapshots, SAS generation, error handling, and authentication choices. Rejected unchanged because normal flows create/delete persistent shares, directories, files, and snapshots; mutate quotas, metadata, headers, and byte ranges; upload local data and streams; copy remote content; and materialize downloaded data without mandatory resource, data-owner/classification, mutation/destructive-action, production, retention/recovery, or cost authorization. Credential paths include account keys, connection strings, and SAS tokens; the share-SAS example grants read/create/write/delete/list permissions for 24 hours. Download examples can print or write file contents without mandatory sensitive-data minimization or custody controls. Entra-first authentication guidance, quotas, snapshots, idempotent *IfExists methods, and streaming are useful safeguards but do not authorize storage mutation, data disclosure, credential delegation, destructive lifecycle actions, or production use. Behavioral validation remains not-run.