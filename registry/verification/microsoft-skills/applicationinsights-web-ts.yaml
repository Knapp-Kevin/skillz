notes: Exact package-tree review at the registered Microsoft Skills pin. Strong guidance covers browser RUM, framework integration, telemetry initializers, PII/secret scrubbing, distributed tracing, click analytics and OpenTelemetry GenAI semantic conventions. Rejected unchanged under the current hard authority rule because its primary setup path directs early browser telemetry initialization and automatic page/dependency collection without requiring user consent or an approved data-handling policy before telemetry leaves the client. Consent gating appears later as optional privacy guidance rather than as a mandatory authorization boundary, and click/user-context examples add consequential privacy scope. Retain as adaptation/reference evidence with a required consent/data-governance gate. Behavioral validation remains not-run; package APIs, browser privacy behavior and OTel GenAI conventions are freshness-sensitive.