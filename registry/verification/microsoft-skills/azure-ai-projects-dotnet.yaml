notes: Exact package-tree review at the registered Microsoft Skills pin. The package provides useful Azure.AI.Projects guidance for .NET across project clients, persistent and versioned agents, connections, deployments, datasets, indexes, evaluations, Azure OpenAI access, authentication, and available agent/tool integrations. It is rejected unchanged under the current authority/data-handling rule because primary workflows create and delete remote agents and threads, create agent versions, upload and delete datasets, create/update and delete search indexes, run evaluations, and invoke metered model/search services without a distinct affirmative resource/cost/data-transmission authorization boundary or mandatory approved-data-handling prerequisite. The connection example also demonstrates includeCredentials: true as a normal retrieval option without an explicit credential-access authorization gate. Credential setup otherwise uses environment variables, placeholders, DefaultAzureCredential, and managed identity rather than asking for real secret values conversationally. Adaptation should preserve the SDK/API guidance while adding explicit mutation, cost, data-governance, credential-access, and external-service authorization gates before operational use. Behavioral validation is not-run; no representative external scenario/adversarial evidence is claimed.