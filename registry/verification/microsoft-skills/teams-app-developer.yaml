notes: Exact package review of the front-mattered SKILL.md and its bundled workflow/reference tree. Strong points are smallest-workflow routing, mandatory sub-skill reading before execution, Playground-first local testing, explicit long-running/background-process handling, context resolution, and extensive troubleshooting/platform references. Unchanged adoption fails the authority hard rule because the package directs global CLI installation, project scaffolding and file moves, tenant app/AAD registration and provisioning, Azure resource-group/resource creation, cloud deployment, authentication, Teams sideloading/sharing/publishing, and related consequential operations without a distinct action-specific authorization checkpoint immediately before each operation. Secret discipline also fails the current conservative standard: the root explicitly says to ask users for real missing environment values, including Azure OpenAI API keys, instead of preferring a secure external credential path. Preserve workflow routing, decomposition, and diagnostic guidance for adaptation behind explicit per-action authorization and secure credential injection. Behavioral validation remains not-run.