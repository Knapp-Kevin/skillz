notes: Exact complete-package review at the registered Microsoft Skills pin covered SKILL.md plus references/keys.md and references/secrets.md. Useful material includes Key Vault secret CRUD/versioning, recovery, backup/restore, expiration, managed-identity guidance, least-privilege reminders, key lifecycle and rotation, and cryptographic operation patterns. Rejected unchanged because the package can set, retrieve, print, list, delete, permanently purge, recover, back up, restore, and bulk-handle secret material while also creating/rotating/deleting/purging cryptographic keys and performing encrypt/decrypt/sign/verify/wrap/unwrap operations without mandatory vault/resource, secret-purpose, data-owner, per-operation, destructive-action, recovery, production, or security-control authorization. The material demonstrates literal secret values, raw secret-value output, API keys and connection strings as stored values, and backup/export material without a mandatory secure external custody, minimization, redaction, retention, or disclosure contract. Positive advice about managed identity, soft-delete, purge protection, expiration, least privilege, and backing up before deletion is useful but does not constitute action authorization. Behavioral validation remains not-run.