notes: Exact complete-package review at the registered Microsoft Skills pin, including bundled references/examples.md. The package is useful Azure Web PubSub Java prior art for broadcast and targeted messaging, group/user/connection administration, client access-token issuance, permission management, asynchronous operations, and chat-service patterns. Unchanged use is rejected because normal examples send user/application content externally, mutate group membership, terminate individual/user/group connections, grant and revoke SEND_TO_GROUP permission, and issue bearer-capable client access URLs without distinct communication, membership, destructive-connection, access-control, token-secret, privacy/data, or service-cost authorization boundaries. Both the main skill and bundled complete application print token.getUrl()/the WebSocket access URL, creating a concrete credential-disclosure risk. Positive controls include placeholders, environment-backed connection strings in bundled examples, a production-restricted DefaultAzureCredential pattern, token-expiration guidance, least-role guidance, and hub isolation. Behavioral validation is not-run.