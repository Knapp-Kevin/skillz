notes: Exact complete-package review at the registered Microsoft Skills pin, including bundled references/examples.md. The package is useful Cosmos DB Java prior art for client creation, partition keys, consistency, CRUD, SQL queries, paging, async flows, request-unit visibility, and authentication. Unchanged use is rejected because examples create/delete databases and containers, create/replace/upsert/delete records, perform broad queries, consume metered RUs, and print user/item data without distinct data-access, mutation, destructive-action, privacy/logging, or cost authorization boundaries. The top-level Maven example uses LATEST rather than an exact SDK version. Positive controls include environment-backed key examples, DefaultAzureCredential in bundled examples, parameterized-query examples, and explicit RU visibility. Behavioral validation is not-run.