notes: Exact package-tree review at the registered Microsoft Skills pin. The package provides useful Azure Maps guidance for .NET across geocoding, reverse geocoding, routing, route matrices, route ranges, map rendering, IP geolocation, weather, authentication, rate-limit handling, and SAS construction. It is rejected unchanged under the current authority/data-handling rule because normal examples transmit addresses, coordinates, route origins/destinations, IP addresses, and related location context to a metered external service without a distinct affirmative data-transmission/cost authorization boundary or mandatory approved location/privacy handling prerequisite. The SAS example requests an account SAS token through Azure Resource Manager without a separate credential-issuance authorization boundary, and the map-tile example writes to the local filesystem. Credential guidance otherwise uses environment variables, placeholders, DefaultAzureCredential, and managed identity rather than conversationally solicited secrets. Adaptation should preserve the geospatial SDK/query guidance while adding explicit location/privacy, cost, credential-issuance, and local-write authorization gates before operational use. Behavioral validation is not-run; no representative external scenario/adversarial evidence is claimed.