notes: Exact static review covered the complete pinned azure-reliability package: SKILL.md plus 12 bundled reliability references. Strong mechanisms include scoped read-oriented discovery, feature-pivoted assessment, explicit choice between live CLI and IaC patching, quick-win sequencing, separate storage-migration confirmation, explicit consent before source-code health-endpoint changes, and a hard stop before multi-region work. Those are valuable staged-authorization patterns. Unchanged adoption is rejected under the repository's secret discipline because bundled references/configure-storage.md retrieves a live storage connection string with `az storage account show-connection-string --query connectionString -o tsv` and then instructs using that credential in Function App settings, causing raw secret material to be emitted into command output rather than transferred through a secure external credential path or redacted mechanism. The package is otherwise authority-conscious, so preserve its assessment, staged consent, and remediation sequencing as adaptation/reference evidence. Behavioral validation remains not-run.