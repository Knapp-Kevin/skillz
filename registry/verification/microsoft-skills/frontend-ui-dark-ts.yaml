notes: Exact complete-package review at the registered Microsoft Skills pin covered SKILL.md plus three Markdown references, four bundled Segoe UI TTF assets, and two Foundry logo PNG assets. The skill has a precise frontend trigger and coherent local implementation path for React/Vite/Tailwind dark dashboards, admin panels, responsive shells, theme/design tokens, glass effects, reusable components, routing, touch targets, and Framer Motion patterns. It directs local project creation and npm dependency installation, so authority is characterized as mutating, but it does not itself instruct cloud-resource mutation, credential disclosure, external messaging, identity/access change, payment, production traffic, or sensitive-data transfer. Dependency and portability limitations are material but bounded: examples target the reviewed React 18, React Router 6, Framer Motion 11, Tailwind CSS 3, Vite 5, and TypeScript 5 generation; bundled Segoe UI/font/logo assets should retain applicable upstream package terms; and some copied component patterns need host-level accessibility hardening, notably modal focus management and reduced-motion behavior. These limitations do not create a current hard fail for the exact pinned package. Behavioral validation remains not-run.