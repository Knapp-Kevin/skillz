notes: Exact complete-package review at the registered Microsoft Skills pin. The package is a single SKILL.md and provides useful TypeScript prior art for Document Intelligence prebuilt models, document/layout/table extraction, batch analysis, REST error handling, and custom model/classifier lifecycle. Rejected unchanged under the current hard authority and sensitive-data rules because normal examples transmit documents and extracted identity, health-insurance, tax, banking, invoice, receipt, address, birth-date, document-number, and other potentially sensitive fields to Azure without mandatory subject/data authority, destination/region approval, minimization, retention, redaction, or output-disclosure controls; remote document URLs lack an explicit trusted-source boundary; custom training uses a credential-bearing Azure Storage container SAS URL without a secure external credential path; and build, compose, classifier, and delete operations mutate persistent billable service state without action-specific training/model, destructive-action, rollback, or budget authorization. Behavioral validation remains not-run.