notes: Exact complete-package review covered SKILL.md plus all 16 bundled references for AZD, Azure CLI, Bicep, Terraform, policy, region, Aspire/Functions secret-storage configuration, error handling, environment setup, and static RBAC verification. Strong prior art includes a hard prepare-before-validate prerequisite, real-command proof before status promotion, static least-privilege role review, subscription/location confirmation, what-if/preview checks, explicit blockers for unsupported Aspire resources, and refusal to deploy after failed validation. Unchanged adoption fails the authority hard rule because the AZCLI and AZD validation recipes directly install persistent host tooling when missing and generate package-lock.json when absent without a distinct action-specific authorization checkpoint. The broader workflow also instructs the agent to fix build/configuration failures before proceeding; the package-level destructive-action rule covers destructive/overwrite/security cases but is not a fresh authorization boundary for every persistent setup or workspace mutation. Preserve the validation sequencing, proof discipline, blocker handling, preview checks, and static role-verification mechanics for adaptation/reference use. Require explicit authorization before installing tools, changing dependencies or lockfiles, editing source/IaC/configuration, or otherwise mutating the workspace beyond the already-authorized validation scope. Behavioral validation remains not-run.