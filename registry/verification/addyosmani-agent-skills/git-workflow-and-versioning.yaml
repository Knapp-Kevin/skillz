notes: "Rejected for unchanged reuse at the pinned version. The skill has strong atomic-commit, worktree, scope-summary, tag, changelog, and consumer-impact patterns, but the generic 'always' trigger and several hard preferences exceed safe portable guidance. Most importantly, the save-point pattern recommends `git reset --hard HEAD` after a failed increment, which can destroy unrelated uncommitted work; release examples push tags to a remote; pre-commit checks assume npm/TypeScript; line-count targets and trunk/squash preferences are presented too categorically; and grep-based secret detection is not a sufficient safety check. Retain as reference/adaptation evidence, but require repository-specific workflow and explicit authority boundaries before reuse. Exact pinned fingerprint confirmed. Behavioral validation remains pending and is not required for this static rejection."
