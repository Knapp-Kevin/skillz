notes: "Plan status and subscription/region confirmation are prerequisites, not action-specific deployment approval. The root routes directly into azd up/provision and Terraform apply; SQL grant-and-migrate scripts assign db_datareader/db_datawriter/db_ddladmin, and CI examples use noninteractive azd up without guaranteed environment approval. Global rules gate destructive/costly/security actions but do not consistently gate each deployment, database mutation or pipeline activation. Deployment plans, resource inventory, live role reads and SQL/database migrations require tenant/data scope, change-window and retention boundaries; no separate approval for database migration side effects. Preserve: Validation-proof and pre-deploy checks, explicit destructive-action rules, managed identity guidance, split provision/deploy, role propagation verification, recovery recipes and post-deploy endpoint checks. No scanner, Azure execution, behavioral validation, admission or pin movement."
