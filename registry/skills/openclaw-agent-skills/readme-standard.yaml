rationale: "REJECT unchanged: mandatory verification requires installing/building packages, executing every README command and probing external links without a separate command/network/target authorization gate. A README can contain untrusted commands. The progressive documentation spine, factual-preservation gate and dynamic badge guidance remain valuable checklist prior art. Trigger: Author or review a README for a matching project, adapting house conventions to project needs. Non-trigger: No automatic dependency installation, executing arbitrary quickstart commands or outbound private-repository link probes from a documentation-only request."
