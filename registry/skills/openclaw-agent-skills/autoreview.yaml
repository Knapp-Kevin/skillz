rationale: "REJECT unchanged: an explicit request for code review authorizes a review but does not independently approve disclosure of potentially confidential source, diff, prompt/dataset material, or private repository context to the selected external inference provider or default web-search path. TruffleHog secret scanning and sandbox isolation reduce risks but do not establish recipient, scope, retention, cost, or private-data disclosure authority. Preserve exact Git target pinning, reviewer isolation, pre-send secret screening, bounded passes, and structured finding verification as ADAPT/EXTRACT/CHECKLIST prior art. Trigger: user-requested second-model code review. Non-trigger: implicit pre-commit/PR review, unapproved private-code egress, or automatic fixes."
