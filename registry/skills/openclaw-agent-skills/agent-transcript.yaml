rationale: "REJECT unchanged: automatic find scans up to 400 local cross-agent session logs before separate approval to access those private records. The explicit approval to insert a redacted PR/issue section is valuable but does not authorize broad private session discovery or local preview persistence. Redaction uses best-effort regex, not a guarantee of safe public disclosure; preserve consent/trim/checklist design. Trigger: PR/issue provenance when agent-authored; hosted *.openclaw.ai sessions excluded by default. Non-trigger: No unrelated local sessions, unapproved private-log inspection, or public transcript insertion."
