rationale: "REJECT unchanged: explicit one-snapshot request and named receiver are helpful, but the procedure does not require the user to authorize the actual Gateway operator.read audience, data categories, retention, and further visibility before exporting locally redacted private conversation content. Regex/heuristic redaction is not disclosure clearance. Opt-in persistent Stop hooks likewise lack an explicit bounded duration, recipients, future private-session scope, and revocation/retention contract. Preserve exact-session fail-closed resolution, local dry-run, bounded redaction, read-only receiver projection, HTTPS and token hygiene as ADAPT/EXTRACT/CHECKLIST evidence. Trigger: explicitly requested session sharing. Non-trigger: silent transcript publication, unscoped future hook uploads, or sharing private session content on provider capability alone."
