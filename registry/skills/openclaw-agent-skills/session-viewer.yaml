rationale: "REJECT unchanged: default generated HTML embeds normalized session records and searchable tool inputs/outputs; --raw embeds original JSONL. Source importer retains reasoning/system events and raw payloads. A user request to view a transcript is not permission to publish or persist sensitive full-content copies at arbitrary paths; no disclosure, minimization, destination or retention gate. Preserve format importers and local viewer design as isolated adaptation prior art. Trigger: Explicit local session viewing/export with known source and output destination. Non-trigger: No automatic sharing or publishing of raw transcripts, reasoning, system/developer instructions, tool outputs, credentials or private session data."
