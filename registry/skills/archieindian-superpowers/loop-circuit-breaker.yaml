rationale: "REJECT unchanged. Useful normalized retry-signature concept, but check.py persists first 100 characters of raw tool arguments and first 200 of errors, potentially secrets, URLs or PII, with no redaction or retention authorization. Its TRIP is advisory and depends on host integration; deterministic versus transient heuristics are not reliable proof. Trigger: analyzing repeated tool errors. Non-trigger: automatic sensitive tool-call capture or assured enforcement. Upstream MIT grant is incomplete at the registered pin (#544); no vendoring or unchanged-use clearance."
