rationale: "REJECT unchanged. Mandatory weekly recursive scanning of private credential-bearing config lacks separately authorized file scope. --fix-permissions chmods files without action-specific approval. SKILL.md recommends real secret literals in shell export examples and a shell profile/.env migration path without secure credential handling; gitignore check is heuristic and does not establish repository exclusion. Preserve non-secret pattern/permissions checklist. Trigger: Owner-authorized static credential-storage review with redacted evidence. Non-trigger: Unapproved secret reads, automatic chmod, pasting actual credentials into chat/shell transcripts or proof of encryption. Pinned source-owned package inspected; no code executed, no vendoring, source license incomplete (#544), package-security and behavioral validation not-run."
