rationale: "REJECT unchanged 10/20. The ORPHAN_NODE check labels any valid depth>0 root without a parent as HIGH orphan, contradicting the compactor's active higher-depth roots. --check writes persistent finding state; --fix deactivates stale nodes and mutates the DAG without independent authorization or backup. Auto-fixable HIGH findings are excluded by severity, despite repair-plan listing. Preserve check taxonomy with corrected root semantics. Trigger: Static DAG integrity checklist and repair-plan critique. Non-trigger: Unapproved weekly audits, private-state reads, auto-deactivation or assurance that eight checks establish integrity. Pinned source-owned package inspected, no scripts run. Upstream MIT-labeled grant incomplete (#544); no vendoring, scanner or behavioral approval."
