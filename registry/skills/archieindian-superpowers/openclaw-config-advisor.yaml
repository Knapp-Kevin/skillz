rationale: "REJECT unchanged. The read-only config claim omits persistent state writes and broad recursive reading of .env/credential-bearing configuration without explicit private-access scope. Detection is keyword presence across concatenated files, not provider/MCP/channel configuration validation; state persists exact file paths and findings. It avoids printing matched secret values, a useful narrow safeguard. Trigger: Advisory checklist for owner-supplied redacted OpenClaw configuration. Non-trigger: Unapproved recursive credential reads, comprehensive config correctness certification or persistent scan history without consent. Pinned source-owned package inspected; no code executed, no vendoring, source license incomplete (#544), package-security and behavioral validation not-run."
