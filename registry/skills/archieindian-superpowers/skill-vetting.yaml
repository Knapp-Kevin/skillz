rationale: "REJECT unchanged. The 0-flags means safe-to-install decision and 1-2 flags means install-with-caution policy are unsupported by a heuristic pattern scan; no independent authorization, full dependency review or trustworthy threat model. The claim that roughly 17 percent of ClawHub skills are malicious is unsourced in this pinned package. Preserve red-flag checklist but never promote scan absence to security clearance. Trigger: pre-admission source triage. Non-trigger: automatic installation or unchanged-use approval."
