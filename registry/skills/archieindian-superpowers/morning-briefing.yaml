rationale: "REJECT unchanged. Recurring private task/handoff reads and channel delivery require separate source/account/audience/schedule approval. run.py only prints a briefing and marks it delivered in local state without sending through a messaging channel or receiving a delivery receipt; this creates false delivery assurance and suppresses later attempts. A no-PyYAML fallback flattens nested YAML state. Trigger: User-requested local draft of a daily priority brief from authorized inputs. Non-trigger: Unapproved recurring private-state access, messaging, or verified notification delivery. Exact four-file pinned package inspected without execution or vendoring. Upstream MIT terms are incomplete (#544); security and behavioral validation not-run."
