rationale: "REJECT unchanged. The procedure suggests dependency installation and modifying target scripts/frontmatter without separate change approval. Bundled checker uses importlib.import_module to probe imports, which can execute untrusted module top-level code; this is not a safe passive inspection of unknown packages. Preserve static OS/binary dependency inventory, but replace import probes with non-executing checks. Trigger: host portability review. Non-trigger: automatic install or execution of untrusted imports."
