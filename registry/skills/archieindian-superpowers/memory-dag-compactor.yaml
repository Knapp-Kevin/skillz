rationale: "REJECT unchanged 10/20. Nightly private MEMORY.md ingestion and persistent DAG writes lack consent, retention and recurrence scope. compact.py uses deterministic text slicing (10 lines/200 or 150 characters), not the claimed depth-aware LLM prompts or lossless summaries; entry IDs and child deactivation can mask omitted details. Preserve source-linked hierarchical summary design, not unchanged execution. Trigger: Opt-in design review of hierarchical memory summarization. Non-trigger: Unapproved nightly processing, private memory reads, state writes or lossless-recall claims. Pinned source-owned package inspected, no scripts run. Upstream MIT-labeled grant incomplete (#544); no vendoring, scanner or behavioral approval."
