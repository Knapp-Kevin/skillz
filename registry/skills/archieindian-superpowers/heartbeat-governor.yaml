rationale: "REJECT unchanged. Claimed automatic pause/abort/alert enforcement only sets local YAML paused flags and prints notices; no scheduler cancellation, live-run termination or notification transport is implemented. Per-run and wall-clock breaches are logged after a run is recorded. Daily-run breaches print alerts without skipping actual executions. Unapproved recurring monitoring, budget changes and restart state are consequential. Trigger: Design/reference checklist for host-enforced budget and cancellation contracts. Non-trigger: Actual spending protection, live abort, scheduler pause, unattended alerts or autonomous budget updates. Pinned source-owned package inspected; no code executed, no vendoring, source license incomplete (#544), package-security and behavioral validation not-run."
