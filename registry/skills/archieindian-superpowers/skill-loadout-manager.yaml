rationale: "REJECT unchanged. --activate updates only its own YAML state and prints that OpenClaw will load the selection; no integration with the actual OpenClaw skill loader is established. Token savings are heuristic, and loadouts can include previously rejected safety skills or suppress needed controls. Activation and persistent skill-selection changes lack independent authorization. Trigger: Advisory design of scoped skill selection and prompt-budget tradeoffs. Non-trigger: Proven loader behavior, enforced safety pinning, unapproved profile activation or validated token savings. Pinned source-owned package inspected; no code executed, no vendoring, source license incomplete (#544), package-security and behavioral validation not-run."
