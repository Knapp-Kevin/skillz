rationale: "REJECT unchanged 9/20. Recursive scanning includes .env, private logs, CSV PII and other sensitive content; copies full plaintext into a second durable store without access, retention or deletion gates. Structural JSON/CSV summaries and --restore can print secret/PII values. Token savings are heuristic and not measured host usage. Preserve redacted structural-preview method only. Trigger: Scoped structural inspection of an authorized oversized file. Non-trigger: Automatic recursive private scanning, plaintext duplication, unredacted preview/export or claimed actual token savings. Pinned source-owned package inspected, no scripts run. Upstream MIT-labeled grant incomplete (#544); no vendoring, scanner or behavioral approval."
