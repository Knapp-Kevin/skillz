rationale: "REJECT unchanged. Weekly scanning of installed private skill trees lacks separate read/schedule/retention approval. Regex pattern hits cannot establish malware absence; --baseline unconditionally trusts whatever files currently exist, and --resolve only marks findings in local YAML. The claimed ORPHAN check is absent from audit_skill. Baseline drift is useful provenance evidence, not security clearance. Trigger: Design of owner-scoped file fingerprint/drift checks and triage categories. Non-trigger: Safe-to-install clearance, autonomous recurring scans, verified malicious-code detection or self-authorized trusted baselines. Pinned source-owned package inspected; no code executed, no vendoring, source license incomplete (#544), package-security and behavioral validation not-run."
