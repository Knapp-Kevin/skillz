rationale: "REJECT unchanged 8/20. Unapproved nightly private-memory graph/digest persistence and --prune destructive MEMORY.md rewrite. graph.py resets added_at and last_referenced to now and is_stale to false on every build, so advertised staleness detection cannot work. Heuristic lexical contradiction and token-saving claims are unvalidated; digest can omit evidence. Preserve graph/dedup ideas as checklist. Trigger: Static evaluation of memory graph construction and duplicate review. Non-trigger: Autonomous prune, private-memory ingestion, digest injection or claim of proven staleness/30-60% savings. Pinned source-owned package inspected, no scripts run. Upstream MIT-labeled grant incomplete (#544); no vendoring, scanner or behavioral approval."
