rationale: "REJECT unchanged 14/20. Good stop/name-loop/escalate discipline, but ordinary invocation writes persistent state containing attempted approaches and context without an independent storage/privacy scope. Referenced recovery skills may themselves be rejected unchanged. Preserve the read-only recovery decision tree as adaptation material. Trigger: Agent appears stuck after repeated failures. Non-trigger: Automatic durable private troubleshooting logs, permission to mutate unrelated files or invoke unqualified dependencies. Pinned source-owned package inspected, no scripts run. Upstream MIT-labeled grant incomplete (#544); no vendoring, scanner or behavioral approval."
