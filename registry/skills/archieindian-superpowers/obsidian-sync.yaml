rationale: "REJECT unchanged. Nightly replication of private memory into an Obsidian vault lacks separate read, destination, disclosure, retention and schedule authorization. SKILL.md promises never to overwrite manually edited vault files, but sync.py uses shutil.copy2 for any differing destination, destroying edits; --set-vault persists a nonexistent path after warning. Symlink/destination ownership is not validated. Trigger: Explicitly authorized memory export design with conflict-safe preview and privacy filtering. Non-trigger: Unattended sync, append-only guarantees, or lossless conflict handling. Exact four-file pinned package inspected without execution or vendoring. Upstream MIT terms are incomplete (#544); security and behavioral validation not-run."
