rationale: "REJECT unchanged. Baseline stores full private identity and memory documents as reversible base64 in state, not merely hashes; sensitive-content duplication, retention and access are unapproved. Weekly monitoring is implicit and --restore overwrites live workspace files without independent exact-target approval. Hash changes alone cannot distinguish authorized updates from compromise. Trigger: planning integrity checks. Non-trigger: silent private-memory backups, recurring monitoring or restoration. Upstream MIT grant is incomplete at the registered pin (#544); no vendoring or unchanged-use clearance."
