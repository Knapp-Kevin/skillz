rationale: "REJECT unchanged 14/20. Handoff template preserves decisions and test status, but mandates writing task and memory files with potentially sensitive context and deleting the handoff after pickup without independent access/retention authorization. Passing-test checkbox is not evidence of execution. Preserve redacted portable handoff format. Trigger: Authorized transfer of an unfinished task across sessions. Non-trigger: Unapproved persistent handoff/memory writes, automatic deletion, private context disclosure or fabricated passing tests. Pinned source-owned package inspected, no scripts run. Upstream MIT-labeled grant incomplete (#544); no vendoring, scanner or behavioral approval."
