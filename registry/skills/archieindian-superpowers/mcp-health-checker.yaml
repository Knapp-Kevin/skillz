rationale: "REJECT unchanged. check.py starts configured MCP server commands with inherited/configured environment and performs outbound HTTP probes without per-server execution, network or credential scope authorization. Six-hour cron and persistent health state are assumed; a probe can cause real side effects or private-data disclosure. Trigger: designing MCP observability. Non-trigger: automatically spawning local services, contacting private endpoints or reading credential-bearing config. Upstream MIT grant is incomplete at the registered pin (#544); no vendoring or unchanged-use clearance."
