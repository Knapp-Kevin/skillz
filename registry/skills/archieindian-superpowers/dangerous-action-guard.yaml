rationale: "REJECT unchanged. Manifest describes a useful five-minute explicit-confirmation protocol, but bundled audit.py --confirm does not check confirmation phrase or compare its command to pending_action and records outcome=executed before any action is evidenced. Confirmation text is not an enforceable action permit; raw commands and user phrases persist. Trigger: reviewing proposed destructive or external action. Non-trigger: authorizing, executing, or proving an action. Preserve the scope/expiry checklist, not the audit result as execution proof. Upstream MIT grant is incomplete at the registered pin (#544); no vendoring or unchanged-use clearance."
