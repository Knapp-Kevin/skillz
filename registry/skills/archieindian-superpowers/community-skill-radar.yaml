rationale: "REJECT unchanged. A declared three-day cron and Reddit fetches plus persistent PROPOSALS.md/state writes lack independent schedule, network, storage, source-terms and retention authorization. Popularity/keyword scoring is discovery intelligence, not evidence of skill quality; the code groups by title-derived slugs, not semantic equivalence, and search failures can be silently ignored. Trigger: Owner-scoped, manually authorized discovery and signal triage. Non-trigger: Autonomous source admission, safe-to-install recommendation, automatic issue/skill creation or unattended monitoring. Exact four-file pinned package inspected without execution or vendoring. Upstream MIT terms are incomplete (#544); security and behavioral validation not-run."
