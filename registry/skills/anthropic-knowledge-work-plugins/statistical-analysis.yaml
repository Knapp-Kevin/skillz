rationale: Broad and useful statistical vocabulary with strong cautions on outliers, causal claims, multiple comparisons, practical significance, survivorship bias, and false precision. Unchanged reuse is too textbook-prescriptive about universal reporting choices, alpha 0.05, p-value interpretation, test selection, sample-size rules of thumb, and forecasting defaults without enough emphasis on design assumptions and power/model diagnostics.
