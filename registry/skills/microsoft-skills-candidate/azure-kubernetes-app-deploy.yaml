rationale: "REJECT unchanged. Strong framework detection, non-root/read-only-rootfs Docker and Kubernetes templates, Workload Identity, DS001-DS013 checklist and git-SHA image tags are reusable design/checklist material. But broad production deployment, registry build, automatic CI and cluster/identity mutations lack scoped approval. Rollback-on-failure is effectively bypassed when rollout fails before deployed=true is written, because the workflow's failure condition requires that output. The sibling constraint-spec-v1.yaml describes 21 workload safeguards rather than the local 13-rule checklist, requiring scope reconciliation; do not equate this static comparison with live cluster policy. Preserve reference/extraction value only."
