permission_tier: cloud-migration-production-mutation-and-sensitive-credential-reference
portability: medium
review_status: rejected
dependency_status: complete-50-blob-exact-candidate-static-review
dependencies: Azure MCP documentation/best-practices and service tools; Azure CLI and extensions; authenticated Azure identity; Bash/jq or PowerShell 7; Java/Maven/Gradle/OpenRewrite/Python 3.10+ for SDK migration; external independently versioned Redis migration skills; 50 source-owned package blobs
trigger_boundary: Azure plan/SKU/service migration and Java SDK modernization; not cross-cloud migration, unapproved resource operation, or automatic third-party Redis skill installation
authority_profile: read-only assessment plus billable resource creation, RBAC/identity and settings mutation, deployment, trigger cutover, DNS/routing and destructive cleanup
privacy_profile: AzureWebJobsStorage connection strings, function access keys, ARM bearer tokens, application settings, code packages, private telemetry and migration status artifacts require owner scope, minimization, secure external credential paths and retention control
import_eligibility: rejected-unchanged
rationale: Candidate 50-file package has useful scenario routing, assessment, rollback, source-app preservation and many Windows action-specific approval gates. Unchanged adoption fails because Linux migration retrieves live AzureWebJobsStorage into an environment variable and uses it for storage operations; Windows inventory and package retrieval also access credential-bearing settings; Java plan/summary templates recommend parsing legacy credential files despite package-specific guidance prohibiting that pattern. Azure CLI extension installation and Java workspace edits/commits lack consistent action-specific authorization. Keep safe design and migration methodology as adaptation/extraction/checklist evidence; do not run bundled tooling from this passive repository. No security scan or behavioral evaluation was performed.
