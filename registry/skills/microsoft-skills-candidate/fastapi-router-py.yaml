rationale: "REJECT unchanged 11/20. Bundled template allows unauthenticated list/get via optional get_current_user, with no tenant-scoped service filter. PATCH ownership check is commented out and DELETE never checks owner, despite docstrings claiming ownership is required. Unauthenticated list/get can disclose tenant/user resources; authenticated-but-unauthorized update/delete can alter or destroy another user's records. User identity alone is not resource authorization. Preserve: Typed response models, bounded pagination, dependency injection, HTTP status semantics and service layering; adapt with mandatory resource-level and tenant authorization on every endpoint. Package security and behavioral validation not-run; July source pin unchanged."
