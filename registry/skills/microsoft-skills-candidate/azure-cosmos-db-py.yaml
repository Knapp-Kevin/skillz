rationale: "REJECT unchanged 10/20. Service CRUD accepts workspace_id/author_id without establishing caller authority; cross-partition queries, upsert and delete are executable without per-action authorization. Cross-partition move inserts then deletes without approved ownership/compensation. Potential injection sink from raw extra_filter SQL concatenation if untrusted; substring-based emulator detection can disable TLS verification on non-emulator hostnames; broad exception tracebacks can disclose endpoints and request context. Preserve: RBAC-first credential selection, emulator isolation, typed service layers, parameterized value bindings, partition design and fixture patterns; adapt with explicit tenant/operation permits, structured query builders, safe TLS, lifecycle and retention policies. Package security and behavioral validation not-run."
