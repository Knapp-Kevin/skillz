dependencies: Azure Developer CLI and Azure CLI; Azure MCP and azure-validate/azure-deploy/azure-quotas/other independent skills; Bicep/Terraform/Docker/SDKs; Azure subscriptions, identity, RBAC, Key Vault, SQL, Functions, App Service, Container Apps, Durable Task Scheduler; source-owned Bash/PowerShell SQL grant helpers and 166 upstream package files
trigger_boundary: azd-focused Azure preparation and IaC/config generation; not generic non-azd deployment, unapproved Azure provisioning, cross-cloud migration or automatic deployment
