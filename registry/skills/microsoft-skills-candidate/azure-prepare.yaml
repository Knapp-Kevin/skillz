rationale: All 166 distinct exact candidate source blobs read at registered candidate tree. Strong root plan-first and validation/deploy separation are contradicted by mandatory first-action .azure/deployment-plan.md write before checking existing content; nested app-service and Functions recipes call azd up/provision/deploy --no-prompt; Key Vault SDK prints secret.value; CLI reference passes secret value in an argument; Durable Task Scheduler troubleshooting recommends 0.0.0.0/0 allowlisting; SQL helper grants data roles and optionally db_ddladmin without a separate owner approval gate. Extract planning, managed identity, Entra-only SQL, rollback and two-phase IaC patterns with scoped authority, secure credential broker, safe plan-file handling and no direct deployment. No security or behavioral assessment executed.
