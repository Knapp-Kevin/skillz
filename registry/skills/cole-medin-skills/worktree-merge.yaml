rationale: Strong local integration pattern that isolates risky combination work on a disposable integration branch, validates after each merge, stops on conflict rather than auto-resolving, runs the full repository-defined suite before touching the original branch, and makes worktree/feature-branch cleanup optional. Unchanged adoption is rejected because it creates and merges branches, including the final merge into the original branch, without a mandatory action-specific authorization boundary immediately before that consequential mutation. It also treats repository-controlled CI workflows, Makefiles, manifests, and discovered validation commands as executable guidance without an explicit hostile-instruction boundary, so a malicious or compromised repository could steer command execution. Preserve the integration-branch staging model, incremental validation, conflict stop, rollback guidance, full-suite gate, and explicit cleanup choice as adaptation/extraction evidence.