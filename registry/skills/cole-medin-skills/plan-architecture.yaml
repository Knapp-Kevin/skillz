rationale: Strong architecture-planning reference that keeps implementation detail out of architecture, distinguishes greenfield from brownfield, explores multiple approaches with trade-offs, prefers reversible decisions, recommends spikes for expensive uncertainty, and explicitly keeps the user in the decision loop. Unchanged adoption fails the authority hard rule because its output paths include creating a tracker page, editing an existing PRD/epic, or writing a repository architecture.md without a mandatory action-specific authorization boundary immediately before those mutations. It also consumes tracker pages, repository content, reference documents, and web research as operative input without an explicit hostile-instruction boundary, and it lacks a mandatory secret/PII redaction gate before publishing architecture context to an external tracker. Preserve its conversational option exploration, reversibility test, spike decision rules, brownfield-first codebase grounding, and separation between architecture and implementation planning as adaptation/extraction evidence.