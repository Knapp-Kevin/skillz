rationale: Strong pre-commit review reference that gathers project context first, inspects full changed/new files rather than diff fragments alone, checks logic/security/performance/quality/standards, and asks the reviewer to verify findings with targeted tests and contextual validation before reporting them. Unchanged adoption fails the authority hard rule because the procedure creates a persistent repository artifact under .claude/code-reviews without a mandatory action-specific authorization checkpoint immediately before mutation. Repository instructions and changed source are also consumed as operative review input without an explicit hostile-instruction boundary, and the reporting contract lacks an explicit secret/PII redaction rule even though secret exposure is one of the review targets. Preserve its context-first full-file review, concrete severity/file/line reporting, verify-before-report discipline, and real-bugs-over-style focus as adaptation/extraction evidence.