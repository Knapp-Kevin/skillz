rationale: Strong global-rules design reference that separates product context from technical architecture, derives brownfield rules from observed evidence, elicits working principles from the user, pushes recurring detail into on-demand references, identifies codebase seams, and aggressively prunes generic guidance. Unchanged adoption is rejected because the procedure writes or replaces persistent CLAUDE.md/AGENTS.md and reference files without a mandatory action-specific authorization immediately before mutation; a backup warning is not authorization. It also consumes repository documents, user-supplied specs/analysis, and current web guidance as operative inputs without an explicit hostile-instruction boundary, and it can persist commands or source-derived details without a mandatory secret/PII/sensitive-data minimization check. Preserve its evidence-backed rule derivation, greenfield/brownfield split, lean-context discipline, seam mapping, and user-elicited working-principles method as adaptation/extraction evidence.