rationale: Strong meta-skill for classifying skill type, gathering trigger/task context, planning progressive-disclosure resources, preserving behavior during refactors, wiring bundled resources, and validating structure, triggers, disclosure, independent review, and real-use behavior. Unchanged adoption is rejected because create/refactor/porting paths write, move, copy, and remove persistent skill files without mandatory action-specific authorization immediately before mutation. Repository/codebase files, existing prompts/skills, external pointers, and runtime-gathered context are consumed as operative material without an explicit hostile-instruction boundary, and there is no mandatory secret/PII/sensitive-data minimization gate before copying source material into persistent skills or references. Preserve the proportional skill-type model, progressive-disclosure craft rules, behavior-preserving refactor method, resource wiring discipline, and layered validation gates as adaptation/extraction evidence.