rationale: Strong repository-detected worktree setup method with explicit branch input, stack detection, isolated dependency installation, per-worktree port assignment, health-check gating, parallel fan-out, exact failure reporting, and cleanup guidance. Unchanged adoption is rejected because it creates branches/worktrees, copies gitignored config and secrets, installs dependencies, may generate artifacts, start services, and create or use isolated databases/schemas without a mandatory action-specific authorization boundary immediately before those mutations and side effects. It also treats repository-controlled manifests, scripts, CI workflows, README/config, .worktreeinclude, and discovered commands as operative input without an explicit hostile-instruction boundary. Secret-bearing files are intentionally copied into new worktrees without a secure handling/minimization rule beyond gitignore checks, and generated health/error output lacks a mandatory redaction boundary. Preserve the detect-don't-hardcode setup model, isolation checklist, failure-to-ready gate, and cleanup accounting as adaptation/extraction evidence.