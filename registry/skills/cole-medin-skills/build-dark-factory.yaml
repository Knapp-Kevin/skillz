rationale: Highly developed reference for decomposing unattended software delivery into guidance, validation, workflow, deployment, and trigger layers, with strong observability, protected-surface, holdout, staged-autonomy, and refusal concepts. Unchanged adoption fails the current authority hard rule because the procedure directs the host to mutate the user's repository, install workflow/factory machinery, commit files, configure deployment, and ultimately enable unattended auto-merge/deployment behavior without a mandatory action-specific authorization checkpoint immediately before each consequential mutation. The autonomy interview is valuable intent evidence but does not replace authorization for concrete repository, CI, deployment, traffic, or scheduled external-state changes. Preserve the methods and safeguards as adaptation/extraction evidence rather than unchanged operational guidance.
