rationale: Strong pull-request review reference that separates author and reviewer context, checks PR state before verdict, loads project standards and documented deviations, runs validation, reads every changed file in full, categorizes high-confidence findings by severity, and preserves a human final-approval boundary. Unchanged adoption fails the authority hard rule because it checks out PR code, executes project- or plan-supplied validation commands, writes a persistent review report, and posts approve/request-changes/comment actions to GitHub without a mandatory action-specific authorization checkpoint immediately before those consequential mutations and external communications. PR bodies, repository instructions, plans, reports, and changed source are also consumed as operative input without an explicit hostile-instruction boundary, and outward review text lacks a mandatory secret/PII redaction check. Preserve its fresh-eyes separation, state guard, full-file review, severity model, validation evidence, and human-final-call design as adaptation/extraction evidence.