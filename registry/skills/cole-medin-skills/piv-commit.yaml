rationale: Strong compact reference for reading project commit conventions, inspecting status/diff before committing, using conventional atomic summaries, and reporting what changed. Unchanged adoption fails the authority hard rule because it stages and commits all uncommitted changes without a mandatory action-specific authorization checkpoint immediately before mutation. Its all-changes staging instruction can also capture unrelated work, secrets, credentials, generated artifacts, or sensitive files without classification/exclusion. Preserve convention lookup, pre-commit inspection, message discipline, and post-commit summaries as adaptation/extraction evidence.
