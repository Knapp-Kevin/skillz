rationale: Strong backlog-decomposition reference with explicit PRD traceability, small-ticket discipline, verifiable acceptance criteria, phase grouping, platform selection, and a real pre-creation confirmation checkpoint. Unchanged adoption is still rejected because the confirmation previews titles and phase grouping rather than the full externally published ticket bodies, while descriptions and acceptance criteria are copied from repository PRD content into Jira or GitHub. The procedure therefore lacks an authorization/redaction boundary appropriate to possible secret, PII, or other sensitive-data disclosure, and it treats PRD content as operative instructions without an explicit hostile-instruction boundary. Preserve its decomposition, traceability, bounded ticket sizing, acceptance-criteria, and pre-mutation preview methods as adaptation/extraction evidence.