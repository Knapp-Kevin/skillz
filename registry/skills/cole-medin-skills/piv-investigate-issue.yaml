rationale: Strong evidence-led root-cause-analysis reference that separates symptom from cause, fans out bounded codebase exploration, requires file-and-line evidence for a 5 Whys chain, distinguishes regression from long-standing behavior, assesses impact, and produces a reviewable RCA with explicit confidence. Unchanged adoption fails the authority hard rule because it writes a repository RCA document and posts an external GitHub issue comment without a mandatory action-specific authorization checkpoint immediately before those consequential mutations. The issue/comments are also treated as operative investigation input without an explicit hostile-instruction boundary, and the external comment path lacks a mandatory secret/PII/redaction review before disclosure. Preserve its parallel exploration map, evidence-backed causal chain, confidence signaling, impact assessment, and implementation-handoff structure as adaptation/extraction evidence.