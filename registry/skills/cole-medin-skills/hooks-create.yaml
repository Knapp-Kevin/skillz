rationale: Strong reference for translating a behavioral guarantee into a scoped Claude Code lifecycle hook, selecting blocking-capable events correctly, failing open on unexpected hook errors, preserving existing hook configuration, avoiding uv/project-environment mistakes, and proving both allow/block behavior before handoff. Unchanged adoption fails the current authority hard rule because the procedure directly writes hook code and settings into the user's project and executes the generated hook without a mandatory action-specific authorization checkpoint immediately before those consequential mutations. Notification hooks may also produce external communications. Preserve the event-selection, matcher-scope, fail-open, environment-isolation, stop-loop, merge-not-overwrite, and bidirectional verification methods as adaptation/extraction evidence.
