rationale: Compact orchestration reference that sequences context loading, planning, implementation, validation inherited through piv-implement, commit, and a concrete final handoff. Unchanged adoption fails the authority hard rule because it explicitly promises a hands-off autonomous feature build and chains plan-file creation, source/test/documentation mutation, validation-command execution, staging, and commit without mandatory action-specific authorization immediately before consequential mutations. It also inherits hostile-instruction and sensitive-file risks from operative repository/plan input and the all-changes commit step. Preserve its phase ordering, explicit artifact handoff between phases, and final evidence summary as adaptation/extraction evidence.