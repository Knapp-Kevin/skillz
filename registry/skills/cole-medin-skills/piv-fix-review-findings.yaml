rationale: Strong review-remediation reference that treats reviewer findings as evidence rather than commands, requires whole-review triage, preserves bounded PR scope, fixes findings one at a time with proof tests, and separates defer/manual/noise outcomes. Unchanged adoption fails the authority hard rule because it may create tracker issues, mutate source and tests, commit changes, and push a PR branch without mandatory action-specific authorization immediately before those consequential mutations. Preserve its triage taxonomy, human-scope primacy, incremental fix-and-test loop, and explicit outcome report as adaptation/extraction evidence.
