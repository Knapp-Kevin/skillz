rationale: Strong decomposition reference that ties architecture-aware vertical slicing to explicit dependency graphs, parallel waves, per-ticket context, acceptance criteria, and just-in-time planning. Unchanged adoption fails the authority hard rule because it writes multiple persistent tracker tickets or a local docs/tickets artifact without mandatory action-specific authorization immediately before those mutations. It also consumes epic, architecture, tracker, and repository content as operative instructions without an explicit hostile-instruction boundary and lacks a mandatory secret/PII redaction check before publishing ticket context. Preserve its architecture-aware slicing, dependency mapping, per-ticket context, and just-in-time planning methods as adaptation/extraction evidence.