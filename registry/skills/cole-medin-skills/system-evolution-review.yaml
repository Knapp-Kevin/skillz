rationale: Strong process-retrospective method for comparing a generated plan with an execution report, classifying justified versus problematic divergence, tracing root causes, and turning repeated process failures into concrete improvement proposals. Unchanged adoption is rejected because the procedure writes a persistent system-review artifact without mandatory action-specific authorization immediately before mutation. It also treats plan/report contents and repository-controlled skill files as operative inputs without an explicit hostile-instruction boundary, and can reproduce sensitive plan/report material into the saved review without mandatory secret/PII/sensitive-data minimization. Preserve the divergence taxonomy, root-cause tracing, pattern-compliance checklist, and concrete improvement-action framing as adaptation/extraction evidence.