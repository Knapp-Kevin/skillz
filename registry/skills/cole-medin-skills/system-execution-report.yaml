rationale: Strong post-implementation evidence template that captures changed files, validation outcomes, concrete successes and challenges, plan divergences with reasons, skipped items, and actionable process recommendations. Unchanged adoption is rejected because the procedure writes a persistent execution-report artifact without mandatory action-specific authorization immediately before mutation. It also treats plan and repository/implementation context as operative input without an explicit hostile-instruction boundary, can persist sensitive implementation or validation material without mandatory secret/PII/sensitive-data minimization, and does not require evidence-backed derivation of reported validation results before recording them. Preserve the structured implementation-accounting, divergence taxonomy, skipped-item accounting, and improvement-feedback framing as adaptation/extraction evidence.