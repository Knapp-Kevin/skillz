rationale: Strong issue-remediation reference that requires full RCA reading, explicit drift detection before implementation, bounded plan adherence, regression and edge-case tests, validation reruns, manual reproduction, and deviation reporting. Unchanged adoption fails the authority hard rule because it creates branches, mutates source/tests/documentation, and may comment on, relabel, or close GitHub issues without mandatory action-specific authorization immediately before those consequential mutations. RCA and issue content are also trusted as operative instructions without an explicit hostile-instruction boundary. Preserve its drift-stop, plan-bounded implementation, regression-test, validation, and deviation-reporting methods as adaptation/extraction evidence.
