rationale: Strong plan-execution reference that requires full-plan reading, ordered task execution, per-task validation, full-suite reruns, final verification, and explicit implementation/deviation reporting. Unchanged adoption fails the authority hard rule because it may create a feature branch and then mutate source, tests, documentation, and repository report files without a mandatory action-specific authorization checkpoint immediately before those consequential mutations. It also executes plan-supplied validation commands exactly as written without an explicit hostile-instruction or command-safety boundary. Preserve its task ordering, incremental validation, drift visibility through reports, and evidence-linked completion methods as adaptation/extraction evidence.
