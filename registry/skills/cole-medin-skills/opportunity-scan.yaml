import_eligibility: rejected-unchanged-reference-and-adaptation-only
rationale: Strong reference for evidence-driven AI-layer improvement: separate reactive single-run diagnosis from proactive recurrence scanning, learn the host's real extension points before prescribing a primitive, aggregate large logs instead of ingesting them wholesale, distinguish system gaps from one-offs, and recommend the smallest durable change in the project's existing house style. Unchanged adoption fails the current sensitive-data hard rule because proactive scanning may process session histories containing secrets, credentials, PII, private code, or other sensitive material and explicitly allows representative samples to enter agent context without a mandatory redaction/classification and disclosure-authorization boundary. Preserve the target scoping, capability-first mapping, aggregation, evidence weighting, one-off refusal, and smallest-durable-change methods as adaptation/extraction evidence.
