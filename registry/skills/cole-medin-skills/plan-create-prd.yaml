rationale: Strong problem-first product-planning reference that separates intent from engineering decisions, demands evidence rather than invented requirements, uses explicit interview gates, requires a falsifiable wrong condition, defines a thin end-to-end MVP, distinguishes reversible from expensive decisions, and records non-goals and open questions. Unchanged adoption fails the authority hard rule because the output contract writes a persistent repository PRD or creates/updates an external tracker artifact without a mandatory action-specific authorization boundary immediately before mutation. It also consumes user research, support tickets, analytics, competitor material, product documents, and tracker context as operative input without an explicit hostile-instruction boundary, and it lacks a mandatory secret/PII/sensitive-data redaction gate before publishing PRD evidence externally. Preserve its problem-first interview, evidence/assumption distinction, falsifiable hypothesis, wrong-condition discipline, thin-MVP framing, and intent-versus-engineering separation as adaptation/extraction evidence.