rationale: Strong compact reference for base-branch detection, clean-state checks, duplicate-PR avoidance, convention/template-aware PR bodies, validation/deviation disclosure, and explicit review handoff. Unchanged adoption fails the authority hard rule because it pushes a branch and creates an external pull request without a mandatory action-specific authorization checkpoint immediately before those consequential remote mutations. Preserve its preflight, context gathering, transparent validation reporting, and reviewer handoff as adaptation/extraction evidence.
