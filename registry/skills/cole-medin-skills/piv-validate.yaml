rationale: Strong validation-orchestration reference that emphasizes project-specific commands, correct working directories, cross-platform awareness, full-surface coverage, continue-after-failure evidence collection, and one PASS/FAIL summary without mixing remediation into validation. Unchanged adoption fails the authority hard rule because it executes commands discovered from repository-controlled files and may start a live application smoke test without a mandatory action-specific authorization boundary immediately before consequential execution. It also lacks an explicit hostile-instruction boundary for repository-provided commands and a required secret/PII redaction rule before reproducing failing command output. Preserve its validation matrix, working-directory discipline, cross-platform checks, failure aggregation, and report-only separation as adaptation/extraction evidence.