rationale: Compact first-run setup checklist with a sensible environment-copy, dependency-install, database-start, migration, server-start, health-check, and cleanup sequence. Unchanged adoption is rejected because it performs consequential local mutation and external side effects without mandatory action-specific authorization immediately before dependency installation, persistent database startup, schema migration, or server startup. It also directs creation of a live .env from repository-controlled material without an explicit hostile-instruction or secret-handling boundary, and its health-check output has no mandatory sensitive-data minimization rule. Preserve the staged setup ordering, explicit health checks, cleanup guidance, and project-specific-value verification note as adaptation/checklist evidence.