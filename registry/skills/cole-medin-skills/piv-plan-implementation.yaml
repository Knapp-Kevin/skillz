rationale: Strong context-rich implementation-planning reference that inherits upstream architecture decisions, performs codebase and dependency analysis before asking a bounded clarifying cluster, records assumptions explicitly when clarification is declined, maps implementation tasks to concrete files and acceptance criteria, and carries validation commands plus testing strategy into the handoff. Unchanged adoption fails the authority hard rule because the procedure creates a persistent repository plan under .claude/plans without a mandatory action-specific authorization checkpoint immediately before mutation. Ticket, epic, architecture, repository-rule, and researched external content are also consumed as operative planning input without an explicit hostile-instruction boundary. Preserve the interview gate, inherit-dont-redecide discipline, assumption/GOTCHA treatment, context-reference map, acceptance-criterion traceability, and one-pass implementation handoff as adaptation/extraction evidence.