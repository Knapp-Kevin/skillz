rationale: "Design-system review checks token semantics, component APIs, patterns, accessibility and lifecycle governance with explicit proportionality for small internal systems. Hard DTCG-token and numeric accessibility floors at every size may over-reject legitimate minimal designs; evaluate against actual user context. Source evidence is methodological, not executed accessibility testing."
