rationale: Exact static review of azure-validate at the registered Microsoft Azure Skills pin, bound to package tree SHA f0eac59b12bba969fdec0e29b7558e441f7be14f and SKILL.md blob e852edd0519414ed61ee39d786b50bd8a8b0d389. These exact package identities match completed Microsoft Skills evidence, so compatible complete-package semantic evidence was reconciled rather than repeated. Preserve its prepare-before-validate gate, evidence-backed validation proof, static least-privilege RBAC review, subscription/location confirmation, deployment blockers, what-if checks, and explicit refusal to mark a plan Validated before real checks succeed. Unchanged adoption is rejected because required validation recipes can install Azure CLI/AZD tooling and generate package-lock.json without a distinct action-specific authorization boundary, while the workflow directs the agent to fix validation/build failures before proceeding. The global destructive-action rule does not independently authorize persistent host-tool installation or every workspace mutation. Behavioral validation has not been run.