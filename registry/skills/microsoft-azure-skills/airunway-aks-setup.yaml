rationale: Azure-source exact package tree and SKILL.md blob match the already REJECTED Microsoft Skills companion at 15/20; this corrects a cross-source eligibility contradiction without modifying the pinned package. Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 72ec58c0a7c574dc71e14c63feb3d2aa529849ac and SKILL.md blob 26bbd92815116826696fb6380d37446a285496b9 plus the complete bundled reference tree. The package contains unusually good positive-action safeguards for a consequential cloud workflow: it reports the active kubectl context, requires confirmation before installs/deployments, calls out GPU cost, confirms model choice, and keeps gated Hugging Face token entry in a no-echo terminal path with a permissioned temporary file rather than conversational context. Unchanged adoption is nevertheless rejected because troubleshooting/rollback gives destructive commands for deleting ModelDeployment resources and secrets and undeploying providers/controllers without requiring a fresh action-specific destructive authorization boundary. The main confirmation rule covers install/deployment actions, not rollback/delete/undeploy operations. Because those operations materially affect persistent Kubernetes/AKS state and credentials, the current authority hard-fail rule blocks unchanged promotion. Retain the staged verification, provider-selection, GPU/model-sizing, secret-custody, readiness, and rollback mechanics as strong adaptation/reference evidence, but add explicit target/resource and destructive-action authorization before reuse. Behavioral validation has not been run.