rationale: Exact Azure-source package tree 1240c9672f0101c65ab0dbc461f9515a200b4486 and SKILL.md blob 835bc5e854d9cabfc6021a9bfc6d7fbb8c594abb exactly match the completed Microsoft Skills package, so compatible complete-package semantic evidence is reconciled rather than repeated. The package has unusually strong staged authorization for assessment and remediation, but bundled configure-storage.md retrieves a live storage connection string into command output and then uses that credential in app settings. That violates the current secret-and-sensitive-data discipline because raw secret material is exposed to command/conversational handling instead of a secure external credential path or redacted transfer. Preserve the staged reliability assessment, consent mechanics, and remediation sequencing as adaptation/reference evidence. Behavioral validation has not been run.