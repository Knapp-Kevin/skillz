rationale: Exact static review of azure-storage at the registered Microsoft Azure Skills pin, bound to package tree SHA 58ffdd0c0f466a983a0064239d481fb08e58b7c8 and SKILL.md blob 21bdc643b63e040a9b1efe7422474cfb393ddc85. Exact package identity matches completed Microsoft Skills evidence, so compatible complete-package semantic evidence is reused. Preserve its service-selection guidance, access-tier and redundancy summaries, passwordless production-authentication guidance, least-privilege RBAC advice, and multi-language SDK references as adaptation/reference evidence. Unchanged adoption is rejected because the package directly instructs blob uploads and overwrite-capable SDK writes, host package installation, setup/enabling actions, credential rotation, and enabling Defender for Cloud without a mandatory action-specific authorization checkpoint immediately before those consequential mutations. Blob download/get paths also lack an explicit sensitive-data disclosure/minimization boundary. Behavioral validation has not been run.