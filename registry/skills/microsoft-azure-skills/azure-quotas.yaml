rationale: Exact Azure-source package tree 8a628e265ecb05a8f78a9a7e4e4772fb82d78c40 and SKILL.md blob cbd67b6c336362ee343390e713b91b5662841038 exactly match the completed Microsoft Skills package, so compatible complete-package semantic evidence is reconciled rather than repeated. Preserve quota-name discovery, CLI-first read workflows, usage/capacity calculation, regional comparison, unsupported-provider fallback, and the warning that API "No Limit" output does not prove unlimited capacity. Unchanged adoption fails the current authority rule because the package can issue subscription-scoped quota updates and provider registration without a mandatory action-specific authorization checkpoint immediately before those external mutations. It also requires installing the Azure CLI quota extension as an unconditional prerequisite without first authorizing that local toolchain mutation. Adaptation should separate read-only inspection from mutation and require scoped authorization before extension installation, provider registration, and quota-change requests. Behavioral validation has not been run.