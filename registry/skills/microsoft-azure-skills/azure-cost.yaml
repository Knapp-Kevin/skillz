rationale: Exact Azure-source package identity matches the previously reviewed Microsoft Skills package tree SHA b9f59c28575280e1f76aaf2b94d92b040b571c52 and SKILL.md blob 8755e1c4db79a8e1bc44d6d1cdd1d3c55e5976e4, so compatible prior semantic-review evidence is reconciled rather than repeated. Preserve read-oriented cost query and forecast mechanics, explicit scope selection, rate-limit handling, pricing validation, cost visibility, and optimization heuristics. Unchanged adoption remains rejected under the authority hard fail because bundled optimization guidance can enable the AKS cost-analysis add-on and includes implementation commands/recommendations for deleting or snapshot-and-deleting disks, applying lifecycle deletion/tiering rules, changing redundancy/SKUs, retention, and other persistent cost-affecting resource settings without a mandatory action-specific authorization boundary immediately before those consequential mutations. The Free-to-Standard AKS tier upgrade does require explicit approval, but enabling the add-on itself does not. Require explicit target, cost, production, retention, data-lifecycle, destructive-action, and resource-mutation authorization before applying optimization changes. Behavioral validation has not been run.