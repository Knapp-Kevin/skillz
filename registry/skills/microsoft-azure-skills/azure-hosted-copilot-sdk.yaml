rationale: Fresh exact-version review was required because the Azure-source package tree ee166d12b8f9a88a1d4d932a23e844d8203efa13 and SKILL.md blob 64b239df00aa320b64a9009c1875b303a87080b1 do not match the previously reviewed Microsoft Skills copy. Preserve the strong codebase-detection/routing rules, temp-directory scaffolding safeguard, managed-identity/DefaultAzureCredential guidance, Key Vault/RBAC patterns, BYOM authentication guidance, and explicit separation of preparation from the downstream deployment skill. Reject unchanged adoption under the current authority hard rule because generic build/modify/prepare triggers route into a mandatory Step 4 deployment chain and compose azure-deploy, whose current exact-version review is itself rejected for consequential post-deployment identity/database mutation paths without a distinct action-specific authorization boundary. A generic build or modify request is not sufficient authorization for those persistent external effects. No workflow reviewed here asks the host agent to paste literal secret values into conversational context; the package instead favors CLI token acquisition, secure azd environment handling, Key Vault, managed identities, and passwordless credentials. Behavioral validation has not been run.