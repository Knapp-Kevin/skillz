rationale: Exact Azure-source package tree 3254fb7a6f2c11b698e7e58ce49aeb4b86f787a9 and SKILL.md blob 113c40edd44841b05b26ab836604c6a6d644fef4 exactly match the completed Microsoft Skills package, so compatible complete-package semantic evidence is reconciled rather than repeated. Preserve its plan-first preparation sequence, explicit plan approval before Phase 2, Azure subscription/location confirmation, destructive-action confirmation rule, Entra-only SQL guidance, specialized routing, validation-before-deploy handoff, and separation of preparation from deployment execution. Unchanged adoption fails the current authority rule because the skill mandates writing .azure/deployment-plan.md as the very first action, before workspace analysis or approval, without first checking whether that path already exists. Its own global rule classifies overwrite as destructive and requires ask_user, so the mandatory skeleton write can conflict with the package's safety contract and overwrite an existing deployment-plan artifact without action-specific authorization. Adaptation should first inspect the target path and require scoped approval before replacing an existing plan while preserving the remainder of the staged workflow. Behavioral validation has not been run.