rationale: Exact Azure-source package tree 620e71b64d369c1ea3aa5c8f4feee7793841e7a5 and SKILL.md blob a261c21ed056be1958902cf23f6ae4879001b404 match the previously reviewed Microsoft Skills package exactly, so compatible complete-package semantic evidence is reconciled rather than repeated. The package has a substantive multi-stage authority model: resource selection requires approval; Phase 5 requires separate manual explicit plan approval before IaC generation; Phase 7 presents deployment risks and requires a fresh user reply, explicitly rejects the original task prompt or vague assent as authorization, confirms subscription/resource group, and requires explicit confirmation for destructive actions. Security-related environmental insights cannot weaken posture unless the user explicitly requested that weaker posture. No workflow was found that solicits literal secrets into conversational context. Preserve as verified static reference for enterprise Azure planning and provisioning; host agents must still honor package gates and local authority constraints. Behavioral validation has not been run.