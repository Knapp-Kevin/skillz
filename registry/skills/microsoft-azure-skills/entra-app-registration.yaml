rationale: Exact static review of entra-app-registration at the registered Microsoft Azure Skills pin, bound to package tree SHA 9796dd5d6b70d96a7defe3ee3e542fecdef5904c and SKILL.md blob 9253ba09a6f71ea5b2bda0dd128d481bec321e52. No compatible prior exact-package companion exists in the repository, so this unit received fresh structured semantic review. Preserve its app-type/OAuth selection guidance, least-privilege recommendations, managed-identity and certificate preference for production, redirect-URI guidance, MSAL examples, and broad troubleshooting/reference coverage. Unchanged adoption is rejected because the package directly instructs app-registration creation/update/deletion, service-principal creation/deletion, permission grants, admin consent, owner changes, credential reset/deletion, and bulk cleanup without mandatory action-specific authorization immediately before those identity/access mutations. The credential-reset example also emits a live client secret into command output and tells the operator to save that output, which violates the repository's conservative secret-handling boundary when a secure external credential path should be used. Behavioral validation has not been run.