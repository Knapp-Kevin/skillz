rationale: Exact Azure-source package tree b52d696609b18a5dc2bae21e368812fe7b020ec5 and SKILL.md blob 02ac75d2ba22b4d7aa1e74469b01575281f05ddc exactly match the completed Microsoft Skills package, so compatible complete-package semantic evidence is reconciled rather than repeated. The skill is concise and least-privilege oriented: it asks the host to resolve the minimal built-in role first, generate a custom definition only when necessary, then generate CLI and Bicep artifacts rather than execute assignments itself. It correctly identifies Microsoft.Authorization/roleAssignments/write as the capability needed to grant roles and recommends User Access Administrator over Owner for role-assignment-only needs. Because the reviewed package is generate-only and contains no command-execution or external mutation step, the action-specific mutation authorization hard fail does not apply to unchanged use. Operational use of generated commands remains subject to the host agent's separate scoped authorization boundary. Behavioral validation has not been run.