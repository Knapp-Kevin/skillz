rationale: Exact Azure-source package tree 3a892f03908cf1a388ac9d3da91764bef1e9501c and SKILL.md blob dc60b612a54d125bca4feb92b2bfead2ee757873 match the completed Microsoft Skills package exactly, so compatible complete-package static review evidence was reconciled rather than repeated. The primary workflow is read-only against Azure and requires explicit resource-group selection before analysis; it maps resource relationships, forbids secret values in diagrams, and generates a requested Markdown/Mermaid architecture artifact. Preserve its scoped discovery, topology synthesis, secret-placeholder discipline, complete-resource inventory, and diagram/documentation patterns. Unchanged adoption is rejected because the bundled Azure Resource Graph reference presents `az extension add --name resource-graph` as a prerequisite, installing persistent local tooling without a mandatory action-specific authorization checkpoint immediately before that host mutation. Behavioral validation has not been run.
