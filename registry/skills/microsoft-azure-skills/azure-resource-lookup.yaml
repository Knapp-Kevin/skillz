rationale: Exact Azure-source package tree 19e257c3720521014d81cd3dbf4e188e0ece621b and SKILL.md blob d16d74bd6369fd15f8d96ff0b637ac361c7d6e13 match the completed Microsoft Skills package exactly, so compatible complete-package static review evidence was reconciled rather than repeated. The package is intentionally read-oriented for Azure inventory, cross-subscription lookup, tag/configuration audits, orphan discovery, and health-state inspection; ARG itself is explicitly constrained to read-only use and mutations are routed elsewhere. Preserve its dedicated-tool-first routing, explicit subscription/result scoping, query-shaping patterns, and orphan/tag inventory mechanisms. Unchanged adoption is rejected because the Quick Reference and missing-extension recovery instruct `az extension add --name resource-graph`, which mutates the host environment by installing a CLI extension without a mandatory action-specific authorization checkpoint immediately before that change. Behavioral validation has not been run.
