rationale: A differentiated customer-research package with useful jobs-to-be-done, pain/trigger/outcome extraction, source weighting, confidence labeling, quote-bank synthesis, disconfirmation discipline, public-source research, and interview/survey methods. Unchanged adoption fails the authority hard fail because the primary-research mode prescribes CRM segmentation, customer recruitment/outreach, interviews/surveys, and paid incentives without a distinct authorization checkpoint for customer communications, sensitive/customer-data use, or money-bearing actions. Public-source and support-ticket workflows also need stronger privacy, minimization, retention, consent, and source-terms boundaries, while several PMF, sample-size, incentive, and source-confidence heuristics are presented without claim-level primary evidence. Preserve the read-only analysis, source-weighting, disconfirmation, and synthesis mechanisms; gate active research and incentives behind explicit authority and data-governance safeguards.
