rationale: Useful prior art for launch-readiness screening, directory prioritization, per-surface positioning variants, submission tracking, destination-before-distribution discipline, and post-submission measurement. Unchanged adoption fails the authority hard fail because normal workflows instruct form submission, listing publication, community activity, review solicitation and incentives, outreach, and other identity-bearing external actions without a distinct authorization checkpoint for each communication, publication, or money-bearing action. The package and its evals also encode volatile or weakly sourced Product Hunt timing/supporter rules, G2 thresholds/report cutoffs/pricing, backlink/DR heuristics, duplicate-content/AI-ranking assertions, directory counts, conversion ranges, and GEO claims as expected truths. Preserve readiness, prioritization, positioning, and tracking mechanics behind explicit publication/communication/spend authority and current platform-source verification.
