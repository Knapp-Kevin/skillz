rationale: A deep and differentiated paid-media operating package with strong evidence-coverage semantics, benchmark discipline, prompt-injection treatment for fetched ad data, payback/budget reasoning, channel-specific playbooks, and a notably good audit rule that defaults live-account changes to a reviewable plan requiring explicit user approval. Unchanged adoption is nevertheless rejected under the authority hard fail because that approval boundary is not consistently routed across the package: the main skill and operational references prescribe live budget changes, campaign/ad-set launches, audience/customer-list operations, platform/account setup, spend-bearing tests, recurring scheduled Slack delivery, and persistent research artifacts without requiring the same distinct authorization for each material external action, spend, communication, data disclosure, or mutation. Preserve the read-only audit, decision-support, evidence, budgeting, and reversible-change mechanisms as adaptation/extraction evidence while making the explicit approval boundary universal.
