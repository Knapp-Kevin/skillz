import_eligibility: rejected-unchanged-reference
rationale: Strong four-branch prospect qualification and evidence-lineage methods, but unchanged use fails action-specific authorization. Phase 3 requires deliverability verification before adding email contacts, and the bundled data-sources reference routes addresses to Truelist or comparable external validators, including paid single/bulk API requests and CSV uploads, without an explicit approval boundary for contact-data disclosure, provider, scope, retention, cost, or secure credential path. The upstream Truelist integration puts email addresses in URL query parameters and exposes an account endpoint capable of returning API keys; those are additional leakage risks, not evidence of an actual leak. Optional enrichment and GitHub-user profiling also require scoped data-processing authority. Keep read-only public-source research, anti-scraping safeguards, demand-signal provenance, privacy-aware filtering, and manual outreach separation as ADAPT/EXTRACT/CHECKLIST prior art. No scanner or behavioral execution was performed.
