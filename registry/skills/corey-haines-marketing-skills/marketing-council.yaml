rationale: Differentiated multi-perspective deliberation prior art with explicit simulation labeling, designated dissent, disagreement maps, anti-fabrication rules, primary-source preference, living-advisor recency caution, and grounded synthesis. Unchanged adoption fails the authority hard rule because the custom-advisor path explicitly tells the agent to persist a dossier into the user's project without a distinct file-write authorization checkpoint. Living-person simulation and attributed-framework use also require exact-source/current-source discipline so paraphrases, direct quotes, endorsements, competitor comments, and time-sensitive positions do not become invented or stale claims. Preserve the seating protocol, dissent requirement, disagreement map, grounding rules, and synthesis pattern; adapt custom-advisor persistence to propose content first and write only after explicit authorization.
