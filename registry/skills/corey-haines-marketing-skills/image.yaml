rationale: Useful visual-production prior art with a clear model/tool selection map, prompt structure, real-screenshot-over-hallucinated-UI rule, brand-consistency guidance, aspect-ratio planning, asset-type distinctions, and web-image optimization checklist. Unchanged adoption fails the authority hard fail because ordinary procedures move from planning into paid external generation/API use and persistent asset/file mutation via design tools and shell/image commands without distinct cost, upload/disclosure, or file-mutation authorization checkpoints. The package also asks about API-key availability without clarifying secure credential paths, and lacks robust copyright/trademark, likeness/consent, provenance, confidential-brand-asset, and reference-image disclosure safeguards. Model capabilities/pricing, platform dimensions, browser support, and performance claims are volatile and need current primary verification. Preserve tool selection, prompting, screenshot integrity, and optimization mechanisms behind explicit authority/rights/data boundaries.
