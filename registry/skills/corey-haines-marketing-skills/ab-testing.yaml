rationale: A useful experiment-planning package with strong hypothesis framing, precommitted sample-size discipline, primary/secondary/guardrail metrics, test documentation, and continuous experimentation mechanics. Unchanged adoption is rejected because its core statistical guidance contains material internal inconsistency and misleading interpretation: the SKILL.md quick sample-size table materially disagrees with the bundled sample-size guide for the same baseline/lift combinations, and both the skill and reference language misstate frequentist significance as the probability that an observed difference is due to random chance. The reusable planning and documentation mechanisms remain valuable adaptation/extraction evidence after statistical correction.
