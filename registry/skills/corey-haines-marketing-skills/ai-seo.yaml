rationale: A deep and differentiated AI-search optimization package with useful people-first framing, evidence/source discipline, extractability patterns, volatility awareness, and explicit acknowledgement that Google does not require AI-specific markup. Unchanged adoption is rejected because the exact pinned package contains materially incorrect crawler/control guidance: it identifies GPTBot as powering ChatGPT search and says blocking it prevents ChatGPT citation, while current OpenAI guidance uses OAI-SearchBot for public-web search discovery; it also treats Google-Extended as controlling Google AI Overviews/Search citation even though Google states Google-Extended does not affect Google Search. The package additionally recommends mutating robots.txt, schema, machine-readable site files, public profiles/community participation, and other publication surfaces without a consistently explicit mutation/publication/identity authorization boundary. Preserve the content-structure, citation-quality, measurement, volatility, and agent-readiness mechanisms as adaptation/extraction evidence after correcting crawler semantics and placing external mutations/publication behind explicit approval.
