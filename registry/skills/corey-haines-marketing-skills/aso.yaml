rationale: A useful read-only ASO audit framework with strong trigger precision, prompt-injection treatment for fetched listing/review content, platform differentiation, brand-maturity context, explicit evidence gaps, structured scoring, competitor comparison, and actionable report mechanics. Unchanged adoption is rejected on exact-version correctness/evidence grounds: the package presents several volatile or weakly sourced claims as settled platform facts, including Apple screenshot-caption indexing, prescriptive Google Play keyword-density targets, and benchmark/conversion claims whose bundled citations are source-name summaries rather than claim-level traceable evidence. Preserve the audit structure, platform comparison, visual-review workflow, uncertainty handling, and report mechanics as adaptation/extraction evidence after re-verifying volatile platform facts and removing unsupported optimization heuristics.