rationale: Strong onboarding audit and minimum-path-to-value prior art with activation modeling, sequencing, empty-state, checklist, and experiment concepts. Unchanged adoption is rejected because benchmark and abandonment claims lack claim-level evidence, analytics/event guidance lacks explicit privacy/minimization/retention boundaries, and friction/urgency experiments are not consistently constrained by accessibility and non-coercion safeguards. Preserve the activation and minimum-path mechanisms for adaptation.
