import_eligibility: rejected-unchanged-reference
rationale: A useful community-strategy framework with shared-identity framing, member-first value, launch/growth playbooks, community health metrics, platform selection, scaling phases, ambassador-program structure, and support/community loops. Unchanged adoption is rejected because normal procedures prescribe identity-bearing outreach and welcome messages, public posting/announcements, moderator-role and access changes, referral/revenue-share incentives, member tracking/monitoring, and other external community actions without distinct explicit authorization checkpoints. The package also presents volatile health benchmarks and flagship growth statistics without claim-level primary sourcing, and member-level monitoring/research needs stronger privacy/data-minimization boundaries. Preserve the read-only strategy, community-model, health-audit, journey-design, and measurement mechanisms as adaptation/extraction evidence behind explicit communication, access/role, commercial-incentive, tracking/data, and publication authority boundaries plus current source verification.