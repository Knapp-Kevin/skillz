rationale: A differentiated retention framework with useful voluntary/involuntary churn separation, exit-survey and reason-to-offer mapping, visible cancellation paths, dunning/recovery structure, cohort measurement, and some privacy/compliance awareness. Unchanged adoption is rejected under the authority hard fail because normal procedures prescribe changing subscriptions, discounts, pauses, billing retry/dunning configuration, account access state, customer-success routing, analytics instrumentation, proactive intervention triggers, and customer email/in-app communications without distinct explicit authorization checkpoints before those money-bearing, persistent, identity-bearing, and communication side effects. Several benchmark and regulatory claims are also presented without claim-level sourcing. Preserve the read-only diagnosis, segmentation, cancellation UX, measurement, and recovery-planning mechanisms as adaptation/extraction evidence behind explicit spend/billing/account/communication/data authority boundaries and current legal/source verification.