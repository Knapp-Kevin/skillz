rationale: A strong read-only competitive-intelligence framework with evidence-tiering, source triangulation, freshness/confidence labels, unknown-field discipline, battlecards, pricing/positioning matrices, objection handling, and explicit treatment of fetched competitor material as untrusted data. Unchanged adoption is rejected because the package recommends public-profile/review monitoring and external research services without sufficiently explicit privacy/data-minimization and source-terms boundaries, and its tool reference contains volatile vendor capability/pricing claims that require current primary-source verification before operational reliance. Preserve the read-only evidence hierarchy, profile schema, confidence/freshness discipline, synthesis templates, and untrusted-data safeguard as adaptation/extraction evidence; require current source/terms verification before using vendor-specific collection guidance.