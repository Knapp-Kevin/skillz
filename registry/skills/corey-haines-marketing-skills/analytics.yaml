rationale: A useful analytics-planning and debugging package with strong decision-first measurement framing, naming discipline, validation checklists, consent/privacy guidance, and concrete GA4/GTM implementation references. Unchanged adoption is rejected under the authority hard fail because normal implementation procedures directly prescribe creating or changing analytics properties, streams, tags, events, advertising links/audiences, site instrumentation, and telemetry without a distinct explicit authorization checkpoint before those external or persistent mutations. The package also handles privacy-sensitive behavioral/user/account identifiers and third-party tracking pixels; its privacy section is useful but does not itself authorize collection, disclosure, or activation. Preserve planning, event-taxonomy, debugging, data-quality, minimization, and consent mechanisms as adaptation/extraction evidence behind explicit mutation and sensitive-data authority boundaries.