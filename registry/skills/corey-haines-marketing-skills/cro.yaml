rationale: A useful read-only CRO audit and experiment-design framework covering value proposition, headline, CTA, hierarchy, trust, objections, friction, page-specific analysis, form optimization, and hypothesis generation. No authority hard fail applies because ordinary execution analyzes and recommends rather than directly publishing or mutating a site. Unchanged adoption is rejected because the bundled form guidance states unsupported quantitative field-count conversion penalties and other universalized UX claims, encourages enrichment/inference and detailed behavioral form tracking without explicit privacy, minimization, consent, retention, or disclosure boundaries, and recommends social-proof, security, review, and case-study claims without an explicit current claim-verification rule. Preserve the audit, prioritization, experiment, and form-design mechanisms with evidence and data-handling safeguards.