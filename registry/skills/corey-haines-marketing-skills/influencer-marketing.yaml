rationale: A differentiated creator-program package with useful audience-fit vetting, compensation-model comparison, written-agreement checklist, disclosure/compliance emphasis, creative-brief discipline, tracking/ROI methods, ambassador design, and a bundled UGC playbook that explicitly rewrites undisclosed-comment and stealth-account tactics toward disclosed operation. Unchanged adoption still fails the authority hard fail because ordinary procedures prescribe creator outreach, paid/gifted compensation, commercial commitments, exclusivity and usage-right agreements, account operation, content publication, tracking setup, and paid-ad whitelisting without distinct authorization checkpoints for communications, money, legal/commercial commitments, identity-bearing publication, or data disclosure. Compensation/engagement benchmarks and legal/platform guidance are also volatile and require current jurisdiction/platform verification. Preserve vetting, disclosure safeguards, brief design, agreement dimensions, and measurement behind explicit authority and current legal/platform checks.
