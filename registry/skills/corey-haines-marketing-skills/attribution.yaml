rationale: A differentiated attribution framework with strong model limitations, source-of-truth discipline, triangulation, incrementality, self-reported attribution, business-type forks, and unusually careful fail-closed identity/PII guardrails. Unchanged adoption is rejected under the authority hard fail because the first-party build track directly prescribes persistent site instrumentation, analytics identity/profile mutation, third-party URL metadata transmission, webhook-driven identity merges and conversion events, CRM attribution writes, account rollups, and production configuration changes without a distinct explicit authorization checkpoint before those external mutations and privacy-sensitive data disclosures. Preserve the read-only interpretation, measurement, reconciliation, evidence-confidence, minimization, and implementation-hardening mechanisms as adaptation/extraction evidence behind explicit mutation and sensitive-data authority boundaries.