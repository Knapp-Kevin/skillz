rationale: A useful generate-only editing framework with a disciplined multi-pass process, plain-language guidance, specificity and voice checks, and refresh/accuracy checklists. No authority hard fail applies because ordinary execution critiques and rewrites supplied copy rather than publishing or mutating external systems. Unchanged adoption is rejected because the refresh reference makes volatile SEO/AI-search assertions and prescriptive refresh-cadence claims without claim-level evidence, while guidance to update testimonials, case studies, competitor material, pricing, features, and traffic-derived decisions lacks explicit source-verification, privacy/minimization, and source-terms boundaries. Preserve the editing passes, checklist, plain-language substitutions, and refresh-vs-rewrite decision framework with current evidence and data-handling safeguards.