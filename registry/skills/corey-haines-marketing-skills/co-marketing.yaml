rationale: A useful co-marketing planning framework with clear partner-fit scoring, campaign-format selection, partnership-alignment questions, lead-handling considerations, measurement, and routing boundaries. Unchanged adoption is rejected because normal procedures include identity-bearing partner outreach, shared lead handling, cross-company data and metrics sharing, publication/promotion, discounts, events, integrations, and other external commitments without distinct explicit authorization checkpoints before those communications, disclosures, publications, money-bearing offers, or external mutations. The bundled partnership reference also presents numerous volatile quantitative claims and a permissionless brand-association tactic without claim-level primary sourcing or adequate trademark/authorization caution. Preserve the read-only partner identification, scoring, campaign ideation, agreement checklist, and measurement mechanisms as adaptation/extraction evidence behind explicit communication, publication, data-sharing, commercial, and external-action authority boundaries plus current source verification.