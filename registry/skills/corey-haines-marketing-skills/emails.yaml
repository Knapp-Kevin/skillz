rationale: A useful generate-only lifecycle-email design package with clear sequence routing, one-email-one-job, value-before-ask, structured trigger/goal/timing/exit-condition outputs, onboarding/nurture/re-engagement patterns, and explicit separation from in-app onboarding and cold outreach. No authority hard fail is established because ordinary execution drafts and plans rather than sending or changing an ESP. Unchanged adoption is rejected because timing, length, subject-line, open/click/unsubscribe, and lifecycle benchmark guidance is materially prescriptive without claim-level evidence; behavior/profile/usage segmentation and personalization guidance lacks explicit privacy, consent, minimization, retention, and purpose-limitation boundaries; and the package does not clearly require a separate send/automation authorization before implementation. Preserve sequence architecture and drafting mechanisms with current evidence, data-governance safeguards, and explicit implementation authority.
