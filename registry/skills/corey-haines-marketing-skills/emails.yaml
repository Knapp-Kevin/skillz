rationale: Useful sequence architecture, entry/exit framing, one-email-one-job discipline, lifecycle taxonomy, and output templates. No authority hard fail applies to the canonical skill because it drafts/plans sequences rather than directly sending them. Unchanged adoption is rejected because it normalizes automated marketing, segmentation, re-engagement, billing, NPS/review/referral messaging and tool handoffs without adequate consent, unsubscribe/suppression, transactional-vs-marketing, sensitive segmentation, privacy, and claim-verification boundaries; timing/length heuristics are presented too generally.