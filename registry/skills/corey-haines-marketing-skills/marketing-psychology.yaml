rationale: Broad behavioral-principle catalog useful for hypothesis generation and critique. Unchanged adoption is rejected because many psychological effects are presented as operational truths without claim-level evidence or uncertainty, and some recommended tactics include coercive or dark-pattern-adjacent defaults such as opt-out enrollment, urgency, loss aversion, and friction manipulation without explicit ethical, consent, accessibility, or vulnerable-user safeguards. Preserve neutral explanatory mechanisms and testable hypotheses only.
