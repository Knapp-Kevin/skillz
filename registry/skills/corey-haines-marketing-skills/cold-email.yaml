rationale: A useful cold-outreach writing framework with strong brevity, peer-tone, problem-linked personalization, low-friction CTA, framework selection, follow-up angle rotation, and explicit routing away from lifecycle nurture. The skill itself is generate-only and does not instruct the host to send messages or enroll prospects. Unchanged adoption is nevertheless rejected because its bundled references present many volatile benchmark, deliverability, regional, and behavioral claims with source-name attribution rather than claim-level primary evidence; some guidance encourages internal-looking camouflage and psychographic/person-level research without adequate compliance, privacy, consent, or anti-deception boundaries for unsolicited outreach. Preserve the drafting, critique, framework, and sequence-design mechanisms as adaptation/extraction evidence while treating benchmarks as hypotheses requiring current verification and adding explicit compliance/privacy and send-authorization boundaries before operational use.