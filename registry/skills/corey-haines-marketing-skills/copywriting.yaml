rationale: A strong generate-only page-copy framework with precise routing, context gathering, clarity/specificity/customer-language rules, page structures, CTA guidance, voice/tone calibration, output annotations, and useful message-market-fit heuristics. No authority hard fail applies because the skill produces copy rather than publishing or mutating external systems. Unchanged adoption is rejected because the exact package presents several volatile or weakly sourced conversion-performance claims as established facts, including the SavvyCal roughly-3x case and +81% conversion/-38% sales-cycle/-28% CAC/+175% referral metrics, and encourages voice-of-customer use from reviews/interviews/support tickets without explicit privacy, minimization, consent, or source-terms boundaries. Preserve the drafting, critique, structure, routing, and message-market-fit mechanisms with current claim verification and customer-data safeguards.