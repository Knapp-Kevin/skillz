rationale: Focused read-only Fireflies transcript retrieval with good meeting-identity verification, pagination guidance, local filtering, and an explicit instruction not to print or commit the API key. Unchanged adoption fails current secret and authority rules because the invalid-key recovery path tells the agent to ask the user for a new credential and update a local environment file without directing secure external credential entry or establishing separate authorization for credential-store mutation. Preserve the retrieval, transcript-identity verification, local filtering, and large-output handling patterns as adaptation/extraction evidence.
