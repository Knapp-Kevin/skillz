rationale: Broad, well-documented DeepAPI router with strong secret non-disclosure, idempotency, dry-run support, endpoint-specific references, polling/error recovery, and several local approval checks in high-risk subflows. Unchanged adoption fails current authority rules because normal web/search/research use is routed to paid external calls without a distinct spend authorization, open-web search mandates 5+ separate API calls, failed work and product-friction reports can be sent externally without separate communication authority, and the skill launches its updater automatically once per day. Preserve the routing, dry-run, idempotency, failure-recovery, endpoint-selection, and secret-handling patterns as adaptation/extraction evidence.
