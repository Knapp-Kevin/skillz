rationale: Parallel independent review, deduplication, explicit triage, and approval before fixes are useful mechanisms. Unchanged adoption fails the authority boundary because approval to fix the shortlist is treated as authorization to stage, commit, and push to GitHub. Remote repository mutation requires a distinct shipping authorization unless the user's request already explicitly includes it.
