rationale: Pi-specific web routing has useful query-depth scaling, specialized code search, large-content retrieval, source-list fallback, and context-management patterns. Unchanged adoption fails the money-bearing authority hard fail because failure of the nominal zero-config Exa/Perplexity/Gemini chain directs the agent to a DeepAPI fallback capable of paid external requests without a distinct spend-authorization checkpoint. Preserve routing, query-depth, retrieval, and context-management mechanisms as adaptation/extraction evidence.
