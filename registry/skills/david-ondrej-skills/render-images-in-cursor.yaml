rationale: Focused workaround for Cursor image-rendering failure modes. It copies an already-selected image into the active workspace, embeds the in-workspace path, opens an editor-tab fallback, and asks the user to confirm visibility. The workflow is useful but strongly Cursor-specific and performs bounded local workspace mutation, so unchanged reuse requires host fit.
