import_eligibility: rejected-unchanged-reference
rationale: Provides a useful layered pattern for SELECT-only agent database access with explicit denylisting, read-only transactions, timeouts, human-applied production DDL, verification, and rollback guidance. Unchanged adoption is rejected because the workflow first directs the agent to write the role-creation SQL to a repository file and then tells the human to paste the whole file into Supabase while explicitly acknowledging that it contains the password. That creates an avoidable credential-bearing file and editor-history exposure path instead of requiring secure secret injection outside the generated artifact. The broad grant-plus-denylist model also requires careful local adaptation for sensitive-table coverage and optional RLS bypass. Preserve the architecture and verification ideas, but extract or adapt them with secure credential handling rather than using unchanged.
