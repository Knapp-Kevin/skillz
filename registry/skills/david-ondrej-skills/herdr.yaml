rationale: High-detail Herdr orchestration reference with strong workspace targeting, read-before-message discipline, explicit protection against unrequested pane lifecycle changes, and useful empirically documented failure modes. Unchanged adoption is rejected because the launch procedure mandates auto-approval or permission-bypass modes such as cursor-agent --yolo, codex --yolo, and claude --dangerously-skip-permissions, relying on a global deny-list hook rather than establishing an action-specific authorization boundary for the downstream agent's consequential mutations or external effects. Preserve the targeting, status-verification, and orchestration mechanisms as adaptation evidence.
