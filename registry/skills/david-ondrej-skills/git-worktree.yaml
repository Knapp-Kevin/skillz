rationale: "The mandatory worktree bootstrap tells the host to copy .env/.env.local and local databases into every new worktree, including an automatic Cursor setup example. Creating an isolated checkout does not authorize duplicating credentials or sensitive production/customer data into additional agent-accessible directories. The procedure lacks a separate scope/minimization/retention boundary for those copies. Preserve one-task-one-worktree, explicit human merge review, port isolation and cleanup safeguards as adaptation/checklist evidence."
