rationale: A compact manual-only uncertainty audit for consequential choices made during current work. It asks the agent to identify only decisions it is genuinely unsure about, consider strong alternatives, suppress already-settled choices, and answer concisely. The workflow is read-only and carries no mutation, external action, spend, credential, communication, persistence, or sensitive-data side effect. Its principal limitation is evidentiary: it relies on the agent's current context and introspection rather than requiring retrieval or explicit supporting evidence, so omissions and confidence calibration remain host-agent responsibilities.
