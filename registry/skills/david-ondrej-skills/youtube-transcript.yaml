rationale: The transcript extraction flow has useful idempotency, caption-only fallback, language handling, duplicate-caption avoidance, bounded retry, bot-detection stop behavior, and deterministic filename/output patterns. Unchanged adoption fails the authority hard fail because the primary path can incur paid DeepAPI spend without a distinct spend-authorization checkpoint, the workflow writes transcript artifacts to the filesystem even for trigger phrases that do not explicitly request persistence, and first local-fallback failure directs yt-dlp self-update without distinct software-mutation authorization. Preserve the transcript-extraction, retry, bot-detection, and caption-normalization mechanisms as adaptation/extraction evidence.
