rationale: The one-question-at-a-time scoping loop, explicit options with a preferred recommendation, decision capture, read-first implementation handoff, and compact implementation-prompt discipline are useful planning patterns. Unchanged adoption fails the authority hard fail because answering the scoping questions automatically directs the agent to update repository documentation immediately, including superseding prior decisions, without a distinct repository-mutation authorization boundary. Invoking a scoping interview authorizes analysis and questioning, not file mutation. Preserve the question sequencing, decision recording model, and implementation-handoff structure as adaptation/extraction evidence.
