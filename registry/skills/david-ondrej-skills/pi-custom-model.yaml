rationale: Provides a focused manual procedure for registering an exact custom or routing-variant model slug in Pi when the saved default silently falls back. The package disables implicit invocation, requires confirming the model slug and credential presence without requesting or exposing credential values, preserves the user's thinking-level setting, distinguishes project overrides, and verifies registry visibility after mutation. Preserve the Pi-specific file layout and provider metadata assumptions, and treat the optional live model smoke test as requiring separate authority because it can incur external API cost.
