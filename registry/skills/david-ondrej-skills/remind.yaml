rationale: The exact pinned package is manual-only and read-only, with a useful 80/20 recap plus plain-English simplification mechanism. Unchanged adoption is rejected because it unconditionally requires repeating the very first user prompt, which can unnecessarily reproduce sensitive, very long, stale, or irrelevant content and directly conflicts with its own shorter/simpler objective. The core recap-and-simplify pattern remains useful adaptation/extraction evidence when the first-message replay requirement is removed or made relevance- and sensitivity-aware.
