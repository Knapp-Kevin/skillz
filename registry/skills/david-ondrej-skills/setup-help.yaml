rationale: Provides a clear progressive-disclosure interaction pattern for guiding a user through setup one atomic step at a time while keeping no more than eight future steps visible. The generic scope is also its blocking weakness: it can guide consequential setup involving credentials, infrastructure, money-bearing resources, access controls, communications, or sensitive data without requiring a separate action-specific authorization boundary or secure credential-handling rule. Preserve the one-step-at-a-time UX and checklist-reconciliation method as adaptation/extraction evidence, but do not adopt unchanged as an operational setup procedure.
