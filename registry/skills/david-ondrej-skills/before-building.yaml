rationale: A deliberately tiny pre-build decision checkpoint that surfaces only one to three consequential choices, gives compact options plus a recommendation, and then stops for user answers. It performs no mutation, external action, credential handling, or cost-bearing operation. The main limitation is epistemic rather than authority-related: it explicitly forbids reading files, searching, or using tools, so its recommendations must remain preliminary and should not substitute for repository-aware investigation when project facts matter. That constraint lowers evidence and effectiveness scores but does not create a verification hard fail for its narrow role as an early framing prompt.
