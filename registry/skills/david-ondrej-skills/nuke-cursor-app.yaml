rationale: Provides a narrowly scoped manual recovery procedure for restarting the Cursor desktop application when the user explicitly invokes it. The package disables implicit invocation, matches only the Cursor application bundle path, excludes CursorUIViewService, attempts graceful quit before stronger termination, verifies all Cursor processes are gone, verifies relaunch before claiming success, and keeps metrics reads read-only. The local destructive action is therefore bounded by an explicit user request and careful process identity checks. Preserve the macOS/Cursor-specific assumptions and the requirement to warn when an important local agent run may be in flight.
