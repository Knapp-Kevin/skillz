rationale: Shopping-research workflow has strong purchase-side boundaries, price-tier effort scaling, shop-trust checks, evidence discipline, and API-key non-disclosure. Unchanged adoption fails the money-bearing authority hard fail because ordinary mid-range and expensive shopping research directs one or more paid DeepAPI requests without a distinct spend-authorization checkpoint; automatic trigger wording can route a shopping request into those billable calls merely because credentials are configured. Preserve the price-tier research scaling, shop-verification, evidence, and purchase-boundary patterns as adaptation/extraction evidence.
