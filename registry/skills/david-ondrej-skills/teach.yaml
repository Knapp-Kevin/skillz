rationale: The exact pinned package contains a strong teaching method: mission grounding, trusted-source research, retrieval practice, spacing, interleaving, zone-of-proximal-development selection, tight feedback loops, learning records, and compact reference artifacts. However ordinary execution mandates persistent workspace mutation across MISSION.md, RESOURCES.md, lessons, reference documents, learning records, and NOTES.md without a distinct authorization checkpoint for file mutation. It also encourages opening lesson files through a CLI command when possible without a separate execution boundary. Mission changes do require confirmation, which is a useful safeguard, but that narrower confirmation does not authorize the broader persistent-write workflow. Preserve the package as adaptation/extraction evidence rather than unchanged adoption.
