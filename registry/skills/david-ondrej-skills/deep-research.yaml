rationale: Provides a disciplined source-backed research workflow with manual invocation, environment-based credential handling, idempotency keys, bounded retry behavior, and citation/report handling. Unchanged adoption fails the current money-bearing authority rule because the workflow defaults to a paid request with maxCostUsd 0.70 and can fan a larger report into multiple independently billable calls without requiring a distinct user authorization for the aggregate spend. Preserve its prompt construction, secret handling, idempotency, failure handling, and synthesis mechanics as adaptation/extraction evidence.
