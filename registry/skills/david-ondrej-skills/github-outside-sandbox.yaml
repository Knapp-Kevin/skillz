rationale: Provides a compact and useful execution-context recovery pattern for Git and GitHub operations that fail only because a sandbox blocks Keychain authentication, network access, or .git writes. The skill starts in the sandbox, escalates only the blocked command, explicitly limits host execution to the user's authorization, forbids token copying and broad bypass wrappers, requires concrete escalation justification, and verifies from the host context before asking the user to reauthenticate. Its bundled OpenAI policy permits implicit invocation, but the procedure does not independently grant a new Git or GitHub action; it changes execution context only for an operation already within user authority. Preserve that distinction. Portability is medium because the exact escalation mechanism is host-specific and the examples are Codex-oriented.
