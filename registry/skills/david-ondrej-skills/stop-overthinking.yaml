rationale: The exact pinned package is deliberately small, manual-only, read-only, and highly portable. It asks the agent to surface critical or serious issues, otherwise declare readiness to proceed, and provide concise practical next steps. Bundled OpenAI policy disables implicit invocation. It has no mutation, external action, spend, credential, communication, persistence, or sensitive-data side effect. Its limitations are minimal failure/evidence guidance and modest differentiation, but its explicit trigger and stop-overthinking objective are coherent for unchanged reference use.
