rationale: "New launches have an explicit request and dry-run gate, but the ordinary resume path executes cursor-agent --yolo --trust --resume without separately authorizing bypass of downstream agent permission controls. Resume intent does not grant blanket authority for later writes, credential access, external effects or money-bearing actions. This is the same delegated-authority class already rejected in the related Herdr procedure. Preserve worktree identity, no-duplicate resume, dry-run, and live-state verification as adaptation evidence."
