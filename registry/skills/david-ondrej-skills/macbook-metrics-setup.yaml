import_eligibility: reference-only
rationale: Provides a thoughtful low-overhead architecture for local Mac performance collection, WAL-safe SQLite snapshots, explicit nullable handling for undocumented metrics, ADR/schema discipline, and an opt-in per-app extension. Unchanged adoption is not eligible because the default architecture installs persistent LaunchAgents and automatically pushes a database containing detailed machine-activity telemetry to GitHub every three hours without a separate explicit authorization boundary for sensitive-data transmission. The text simultaneously claims "No cloud, no telemetry" and "local-only" while prescribing remote GitHub backup, a materially misleading privacy characterization. Preserve the local collection, low-overhead, WAL-safe backup, and opt-in monitoring patterns as reference evidence, but require explicit authorization and accurate disclosure before any external synchronization.
