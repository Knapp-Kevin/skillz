rationale: The exact pinned package contains useful bucket routing, append-only numbering discipline, source attribution, narrow staging, and no-force-push safeguards. Unchanged adoption is rejected because normal execution mandates persistent file mutation plus git pull, commit, and push based on source-specific claims of standing pre-authorization rather than a real current authorization boundary appropriate to repository mutation and external communication. It also hard-codes one user's ~/ideas layout and private workflow assumptions, making portability low. Preserve the capture/routing/source-line mechanism as adaptation or extraction evidence, but require host-specific destination discovery and explicit current mutation/push authority.
