rationale: The five-angle questioning loop, read-first documentation refresh, README-versus-ADR separation, concise ADR shape, and iterative knowledge extraction are useful documentation patterns. Unchanged adoption fails the authority hard fail because ordinary execution requires repository-document mutation after every user answer with no distinct file-mutation authorization checkpoint. Asking to explore or document project thinking authorizes the interview objective, not unconditional edits after each response. Preserve the question diversity, documentation partitioning, and decision-capture mechanisms as adaptation/extraction evidence.
