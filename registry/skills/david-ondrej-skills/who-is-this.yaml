rationale: The identity-disambiguation stop, cross-platform evidence gathering, claim-versus-evidence discipline, missing/private-profile handling, and concise verdict format are useful background-research patterns. Unchanged adoption fails the authority hard fail because ordinary execution mandates multiple paid-capable DeepAPI calls without a distinct spend-authorization checkpoint and transmits person-specific profile/social data to an external service without a separate sensitive-data disclosure boundary. Manual invocation authorizes the research objective, not the money-bearing service use or external transmission path. Preserve the identity-verification, evidence-ranking, uncertainty-labeling, and output-discipline mechanisms as adaptation/extraction evidence.
