rationale: Provides a privacy-first, local-first productivity telemetry design with explicit separation between explanation, project build, and installation; read-only collection; aggregate-only persistence and transmission; secure webhook handling outside conversational context; coverage/error semantics; idempotent delivery; and a verification gate. Local installation, scheduling, native-store inspection, and Discord delivery are consequential, but the procedure scopes creation and installation to the user's requested mode, requires permission for live delivery testing, and requires disclosure/authorization before changing storage or off-device data boundaries. Preserve the macOS- and Discord-specific assumptions when reusing unchanged.
