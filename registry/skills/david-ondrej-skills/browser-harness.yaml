rationale: Provides strong browser-control mechanics, screenshot-first verification, auth-wall stopping behavior, and useful local/remote connection guidance, but unchanged adoption fails the current authority standard. The bundled installation reference directs the agent to update installed code automatically without asking the user, permits stronger local process termination during troubleshooting, and can create billable remote cloud browser sessions. Those consequential mutations and external/cost-bearing actions require distinct authorization boundaries rather than being inferred from setup or browser-task intent. Preserve the package as adaptation/extraction and negative authority-boundary evidence.
