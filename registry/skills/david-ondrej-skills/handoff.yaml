rationale: Strong session-continuity procedure that explicitly disables implicit invocation, prioritizes state and decision rationale over duplicated artifacts, tells the next agent to verify handoff claims against source files, requires secret and PII redaction, and writes only a temporary handoff file by default. Invocation itself supplies the authority boundary for the bounded local file write; hosts without filesystem access need adaptation rather than unchanged use.
