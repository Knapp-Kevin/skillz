rationale: The exact pinned package is deliberately narrow and read-only. It requires explicit invocation, directs complete reading of every ADR markdown file under docs/adr/, has no mutation or external side effect, and carries no secret, spend, communication, or sensitive-data disclosure path. The procedure is useful when complete ADR context is genuinely needed, though it lacks graceful handling for absent or very large ADR collections and its abrasive wording is unnecessary to the mechanism.
