rationale: Exact package-tree reconciliation at the registered AWS pin, bound to tree SHA 43c2466d8273ab986787caa07c03085f9f7da46d. The query core is strong: read-only catalog analytics, mandatory snapshot_time filtering, workgroup/output confirmation, sensitive organizational-metadata treatment, KMS guidance and least-privilege Lake Formation access recommendations. Rejected unchanged because the package also includes enable and permissions paths that mutate the DataZone export configuration and grant Lake Formation permissions without a distinct affirmative authorization gate. Retain the query core as adaptation/reference evidence. Export timing, SageMaker Unified Studio/DataZone terminology, schemas, pricing and APIs are freshness-sensitive.