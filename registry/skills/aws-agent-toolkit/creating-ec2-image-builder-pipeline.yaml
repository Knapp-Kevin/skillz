rationale: EC2 Image Builder pipeline package bound to the registered AWS pin and exact package tree SHA 1d5acab602162d9049f0f592134eab24dbce29f6. The package provides deterministic step ordering, exact-ARN reuse instead of manual construction, least-privilege handling for optional ECR access, post-step response verification, build-status reporting, cleanup commands, and explicit cost implications. However, the procedure mandates execution of every step after required parameters are gathered, creating IAM roles/profiles, Image Builder components/recipes/configurations/pipelines, starting a build, cross-region AMI distribution, and a launch template without a distinct explicit user-authorization gate for the overall consequential mutation set. User confirmation is requested only after failures or when dependencies are missing, which is not consent to create resources. The instruction that all steps MUST execute and MUST NOT be skipped compounds the authority problem. Retain as reference/adaptation material but reject unchanged under the current mutation-consent standard. Portability is low because it is tightly coupled to AWS Image Builder/IAM/EC2/SSM/ECR and AWS-specific ARN/resource semantics. AMI availability, managed-policy requirements, pricing/cost assumptions, build timings and service API details are freshness-sensitive.