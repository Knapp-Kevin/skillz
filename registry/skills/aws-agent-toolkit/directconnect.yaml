rationale: Exact pinned AWS package bound to tree SHA 430158f244ef5583a04a448e6589911d7a3bc60a. The router and references contain strong domain-specific mechanisms: deliberate connection-model routing, immutable VIF-type and MTU decision warnings, BGP MD5 secret handling, least-privilege IAM constraints, encryption warnings, route-leak cautions, cross-account handshakes, resiliency/failover distinctions and verification after configuration. Rejected unchanged because mutating procedures can create Direct Connect virtual interfaces and other network resources once task parameters are collected and certain parameter choices are confirmed, but there is no distinct explicit authorization gate for the consequential infrastructure mutation itself. Confirming an MTU or public-prefix ownership is not authorization to create a VIF. Portability is low because the package is deeply bound to AWS Direct Connect and physical/on-premises networking. Port speeds, quotas, pricing, supported features, BGP constraints and encryption capabilities require current AWS evidence.