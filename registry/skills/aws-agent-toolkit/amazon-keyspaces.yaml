rationale: Exact pinned Amazon Keyspaces package at tree SHA a20b245aecdf8532d6c04e0b760cc2932833b4c8. The skill combines planning, compatibility, pricing, migration and operational procedures with consequential control-plane mutations. It has unusually explicit confirmation boundaries for create/modify work, separate warn-before-execute operations, a refuse list for irreversible or high-risk actions, tagging requirements, parameter/context constraints, and post-mutation observability guidance. Portability is low because the procedure is deeply coupled to Amazon Keyspaces, AWS IAM/CLI/MCP semantics, regional feature/pricing data, and bundled TypeScript/reference assets. Hosts should treat inline pricing and feature matrices as freshness-sensitive and should not equate the skill's simulated-script presentation mode with actual behavioral execution evidence.