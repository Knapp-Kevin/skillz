rationale: >-
  Purpose/non-trigger: Orchestrate setup of one or both AWS agents; not a safe general-purpose 'connect' command absent scoped authorization. Exact pinned package tree f60a821d6b1e8fd380cc68526199a2be314f71f2, manifest blob f855a5727278411904e4ba6a835691ef77069fef. This thin dispatcher invokes both setup workflows by default on broad 'set up/configure/connect' triggers. Its DevOps child has unapproved unpinned installation and private-read steps; its Security child can create or overwrite IAM, S3 lifecycle and persistent AgentSpace resources. The 'only one if needed' branch is useful, but there is no independent action-specific authority boundary before delegation. Reject unchanged; retain dependency routing as CHECKLIST/COMPOSE input. Source pin is fixed, package-specific freshness unknown; security scan and behavioral validation not established.
