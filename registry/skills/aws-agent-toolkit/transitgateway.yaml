rationale: Exact pinned AWS package bound to tree SHA 8be9f11202144145c5fffd4751f89a013a886ada. Strong mechanisms include segmentation-first architecture, CIDR-overlap hard stops, per-AZ attachment guidance, dedicated attachment subnets, route-completeness checks, ephemeral least-privilege credentials, encrypted flow/audit logging and clear blast-radius warnings. Rejected unchanged because the hub-creation procedure asks for segmentation intent and topology parameters, then creates the transit gateway, flow logging, VPC attachments and route mutations without a distinct explicit approval gate for those consequential billable and cross-network changes. Choosing segmentation intent is a design decision, not authorization to execute the build. Portability is low and Transit Gateway pricing, quotas, attachment behavior and routing semantics require current AWS evidence.