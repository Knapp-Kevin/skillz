rationale: RDS/Aurora snapshot-to-S3 export package bound to registered AWS pin and exact package tree SHA 12260f68d015ba4c10be09bb431f8da62864d915. The package has strong parameter gathering, engine/support checks, snapshot-state validation, confused-deputy protections in IAM trust policy, encryption guidance, export monitoring and post-export verification. However, its procedure can create snapshots, S3 prefixes, IAM roles/policies, KMS-related policy changes and export tasks after confirming parameter values without a distinct general user-authorization boundary for those consequential mutations. Input confirmation is not equivalent to consent to create billable/security-sensitive resources. The package is therefore retained as useful prior art but not eligible unchanged under the current mutation-consent standard. Portability is low because it is tightly coupled to RDS/Aurora snapshot export, S3, IAM and KMS. Supported engines, export limitations, cross-region behavior, timing estimates, Parquet compression assumptions, KMS behavior and service constraints are freshness-sensitive and require current AWS documentation.