rationale: Focused AWS SDK for Swift reference covering async entry points, service client configuration, model namespaces, credential resolvers, waiters, pagination, presigned URLs, and common S3 operations. Operational authority is mutating because the documented SDK procedures can invoke AWS service APIs, including resource and object writes, according to the external host agent's credentials and user authority. Portability is medium because Swift async/error-handling patterns transfer conceptually while concrete client/configuration types, credential providers, and service semantics are AWS-specific. Several emphatic claims about deprecated configuration classes, declaration-order requirements, region requirements, resolver APIs, and generated service-client source paths are version-sensitive; consequential use should confirm them against current aws-sdk-swift and AWS documentation. The pinned package remains passive reference material and performs no operations itself.