rationale: Read-only AWS data-catalog inventory and audit procedure bound to the registered AWS snapshot. The exact package contains SKILL.md plus references/discovery-checklist.md and is bound to package tree SHA cf16547d48f062075c8204a793bb92052c35333e. It requires region and scope confirmation, handles pagination explicitly, separates inventory from query execution and table creation, and treats customer-authored Glue Discovery catalog context as untrusted data rather than instructions. The experimental Glue Discovery lookup is gated on local CLI-model availability and explicit user opt-in. Authority is read-only because the documented workflow enumerates and analyzes metadata and explicitly prohibits Athena query execution; recommendations may suggest later registration or optimization but do not authorize mutation. Portability is low because the procedure is tightly coupled to AWS Glue, S3 Tables, AWS credential/region semantics, AWS MCP/CLI tooling, and AWS-specific federated catalog behavior. Bundled reference material remains intact upstream source content rather than repository-owned execution machinery.