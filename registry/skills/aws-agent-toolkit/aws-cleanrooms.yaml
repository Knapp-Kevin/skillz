rationale: Focused troubleshooting package for AWS Clean Rooms permission failures and Clean Rooms ML custom-model log publishing. The exact package contains SKILL.md plus two diagnostic references and is bound to tree SHA 2a92787a1f614fb3813f50037a544925d510fcc0 at the registered AWS snapshot. It requires a full diagnostic chain before proposing permission fixes, checks explicit denies and cross-account trust, distinguishes IAM/S3/KMS/Lake Formation layers, restricts iam:PassRole guidance to cleanrooms.amazonaws.com, and warns about security implications while recommending least privilege. Authority is mutating because the documented resolution path can culminate in IAM, bucket, key, Lake Formation, ML configuration, or logging changes through the external host. Portability is low because the procedures and command surface are tightly bound to AWS Clean Rooms APIs, IAM semantics, AWS CLI, and related AWS services. Bundled references remain intact upstream material rather than repository-owned execution machinery.