rationale: Exact package-tree reconciliation at the registered AWS pin, bound to tree SHA ff34d53794e8f703a088f527c4361305dcac772d. The query guidance is strong: it routes away from unsuitable use cases, requires live schema discovery before SQL, confirms workgroup/output context, warns about no backfill, treats log data as sensitive and recommends narrow Lake Formation/KMS controls. However the package also includes configure and permission-grant paths that create the CloudWatch-to-S3-Tables integration, associate log sources and grant Lake Formation permissions without a distinct affirmative authorization gate. Therefore the whole unchanged package is mutating and rejected under the current authority standard, despite its read-only query core. Retain as adaptation/reference material. Supported sources, schemas, integration pricing, retention semantics and APIs are freshness-sensitive.