rationale: Broad serverless architecture, deployment, debugging, reliability, security, observability, and production-readiness guidance for AWS workloads. The package explicitly warns that runtime versions, quotas, and feature matrices are volatile and directs the external host to current AWS documentation when precision matters. Strong safeguards include least-privilege execution roles, secret-manager/SSM handling instead of plaintext environment secrets, idempotency, DLQs/on-failure destinations, partial batch failure handling, reserved concurrency, rollout/rollback controls, input validation, and concrete anti-patterns. Authority is mutating because the documented workflows build, deploy, configure, and troubleshoot live AWS resources under the external host's credentials. Portability is medium because architectural patterns transfer broadly while service names, SAM/CDK constructs, quotas, and operational procedures are AWS-specific. The bundled Powertools handler and reference files are intact upstream source material, not repository-owned execution machinery.