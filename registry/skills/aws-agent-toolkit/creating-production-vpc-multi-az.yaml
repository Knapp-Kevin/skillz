rationale: Exact pinned AWS package bound to tree SHA 0a4bcb33ed8cbf2c38768eea13ac6d2200e59446. Strong static mechanisms include AZ validation, explicit internet-wide CIDR warnings, multi-AZ subnet topology, per-AZ NAT design, tiered security groups, VPC Flow Logs, tagging, post-provision verification and cost disclosure. Rejected unchanged because the procedure proceeds from parameter acquisition directly into a large sequence of consequential billable/security mutations including VPC, subnets, Internet/NAT gateways, Elastic IPs, routes, security groups, IAM and logging resources without a distinct explicit authorization gate covering the proposed infrastructure plan and spend. An explicit request for 0.0.0.0/0 is narrowly scoped to exposure and does not authorize the broader build. Portability is low and AWS networking/cost/quota details are freshness-sensitive.