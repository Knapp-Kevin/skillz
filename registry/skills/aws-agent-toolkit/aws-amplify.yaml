rationale: Exact package-tree reconciliation at the registered AWS pin, bound to tree SHA 659d33648afb2138c762e0acdbcb4a4229342457. The package contains extensive version-specific Gen2 routing, framework integration, auth/data/storage/function/AI guidance, generated-output hygiene, deployment validation, secure-secret alternatives and strong warnings around framework-specific pitfalls. Rejected unchanged because its deployment workflows directly create Amplify apps, IAM roles with AmplifyBackendDeployFullAccess, branches, backend resources, domains and release jobs without a distinct affirmative authorization boundary for the infrastructure/cost plan. The CI/CD example also passes a GitHub auth token into a command argument, and the default publicApiKey data authorization is acceptable for starter material but requires deliberate review before consequential use. Retain as adaptation/reference material. Amplify APIs, runtimes, framework support, generated outputs, managed policies, limits and hosting behavior are highly freshness-sensitive.