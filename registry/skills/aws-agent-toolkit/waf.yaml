rationale: Exact pinned AWS package bound to tree SHA c2f6c9a8867d803cd6b6880203d83291ad42cfe1. Strong mechanisms include immutable scope/Region handling, least-privilege temporary credentials, Count-before-Block tuning, mandatory association verification, sensitive-log redaction/encryption, spoofed-header defenses and clear routing among managed rules, rate limiting, Bot Control and Fraud Control. Rejected unchanged because the entry-point procedure asks for web ACL parameters and derives scope, then creates and associates the security control without a distinct explicit authorization gate for that consequential traffic-filtering mutation. Deliberately choosing a default action is an important design decision, but it does not by itself authorize execution. Portability is low and WAF capabilities, pricing, managed-rule behavior and protected-resource support require current AWS evidence.