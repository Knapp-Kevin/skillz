rationale: Unified OpenSearch guidance spanning migration, provisioning, vector/semantic/hybrid search, log analytics, and trace analytics. The package contains extensive operational references and reusable report/assets, with strong safeguards against credential leakage and unsupported cost estimates plus explicit routing across distinct capabilities. Authority is mutating because documented procedures provision, upgrade, configure, migrate, query, and troubleshoot live OpenSearch resources using the external host's credentials. Portability is medium because search, observability, migration, and sizing concepts transfer while the concrete control plane, service tiers, migration tooling, IAM/security model, and many operational examples are AWS-specific. Exact package identity is preserved at the pinned source tree; bundled assets and references remain intact upstream material rather than repository-owned execution machinery.