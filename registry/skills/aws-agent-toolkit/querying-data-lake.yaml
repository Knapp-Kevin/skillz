rationale: Athena data-lake query procedure bound to the registered AWS snapshot and exact package tree SHA a619aa25a608b7efac3d5439b1e9c5a0d303defc. The package contains SKILL.md plus two focused references. It establishes region, credential, workgroup, target-asset, output-location, and statement-classification gates before execution; requires explicit confirmation for INSERT/UPDATE/DELETE/DROP/ALTER/CREATE/TRUNCATE/MERGE and treats uncertain statements as destructive; prohibits silent workgroup escalation; reports scan/cost/duration; and delegates fuzzy asset resolution rather than broad-scanning catalogs. Authority is mutating because the accepted statement set includes data/schema-changing SQL even though normal SELECT/SHOW/DESCRIBE/EXPLAIN use is read-oriented. Portability is low because behavior depends on Athena, AWS workgroups/output semantics, AWS credentials/tooling, and AWS-specific federated catalog addressing. Federated-catalog behavior, query costs, service limits, SQL support, and catalog semantics are freshness-sensitive and should be checked against current AWS documentation when consequential.