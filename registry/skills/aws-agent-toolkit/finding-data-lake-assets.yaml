rationale: Read-only AWS asset-resolution procedure bound to the registered AWS snapshot. The exact package contains SKILL.md plus references/search-strategy.md and is bound to package tree SHA e32f6445e9f80e2dca0bfe14ecf5e7ad53ac2721. It distinguishes narrow resolve requests from exploratory search, requires region and dependency checks, uses layered Glue/S3/S3 Tables/Redshift lookup with explicit stop conditions, and records searched versus skipped sources. Customer-authored Glue Discovery catalog context is treated as untrusted data rather than instructions and the experimental lookup requires explicit user opt-in. Authority is read-only because the procedure performs metadata/catalog/listing operations and does not authorize table creation or query execution. The Python/boto3 broad-scan fallback is host-executed temporary analysis tooling specified by the upstream skill, not repository-owned execution machinery. Portability is low because the procedure is tightly coupled to AWS catalog APIs, AWS credentials/region semantics, MCP or CLI tooling, Redshift/S3 Tables behavior, and AWS-specific identifiers.