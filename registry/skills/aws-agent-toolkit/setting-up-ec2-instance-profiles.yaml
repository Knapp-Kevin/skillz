rationale: EC2 instance-profile package bound to the registered AWS pin and exact package tree SHA 0873a68481f12e575b07be67b376ba00bd81fb43. It requires confirmation before replacing an existing instance profile, asks whether to reuse or create the IAM role, presents current permissions for review, requires user confirmation or modification of proposed least-privilege permissions before role/policy creation, rejects FullAccess guidance, confirms trust relationships, uses IMDSv2 for verification, and explicitly removes the need for hardcoded credentials. Existing-profile replacement and permission changes therefore have explicit human decision points before consequential mutations. Authority remains mutating because IAM roles/policies/profiles and EC2 associations are created or changed. Portability is low because behavior is specific to AWS IAM/EC2/IMDSv2. Managed policy names, service permission requirements, propagation behavior and SDK/service details are freshness-sensitive and should be verified when consequential.