rationale: AWS data-lake ingestion procedure bound to the registered AWS snapshot and exact package tree SHA d2938ee80db56f45b8f5e7cd2e6fe6abdfeb39d6. The package contains SKILL.md plus a substantial references directory covering local/S3/JDBC/Snowflake/BigQuery/DynamoDB ingestion, catalog migration, Glue job configuration and scripts, Iceberg/S3 Tables configuration, validation, incremental loading, scheduling, schema/type handling, Athena/CTAS patterns, troubleshooting, and performance. It has clear trigger exclusions and delegates connection creation, table creation, asset resolution, catalog exploration, and querying to sibling skills. The workflow requires target region/identity checks, verifies required connections before ingest, asks the user to clarify target database/table/format before creating or writing tables, and requires post-load row-count/null/sample validation. Authority is mutating because the procedure may upload/write data, create and execute Glue jobs, migrate tables, create recurring triggers, and configure monitoring. Portability is low because behavior depends heavily on AWS Glue, S3/S3 Tables, Iceberg, Athena, AWS credential/region semantics, AWS MCP or CLI tooling, and source-specific cloud/database connectors. The upstream instruction to explain each command is useful transparency but is not itself a universal explicit confirmation gate for every later mutation or recurring schedule, so hosts should apply their own authority policy before consequential writes or scheduling.