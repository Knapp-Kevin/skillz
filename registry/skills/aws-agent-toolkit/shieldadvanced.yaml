rationale: Exact pinned AWS package bound to tree SHA 3ef03839bc64199197448d2a6a1d8ab944ff71e9. Strong domain mechanisms include a decide-before-subscribe posture, lower-cost Shield Standard plus WAF alternatives, explicit explanation that subscription alone protects nothing, consolidated-billing semantics, auto-renewal and support-only cancellation warnings, least-privilege controls, audit/encryption guidance, and post-subscription protection verification. Rejected unchanged because the subscription procedure warns the customer about the paid auto-renewing commitment but then calls create-subscription without a distinct explicit authorization gate confirming the customer accepts that commitment. A warning before action is not equivalent to consent to enter a paid term. Authority remains mutating because subscription/protection/configuration actions are supported. Portability is low and pricing, subscription terms, supported resources and Shield/WAF capabilities require current AWS evidence.