rationale: >-
  Purpose/non-trigger: Audit and harden production AgentCore security, auth, quotas, sessions and observability; not outbound credential wiring or general quality tuning. Exact pinned package tree 4da687d992a44da500a6b0b74b6a1ece4c5d260f, manifest blob 8c7ec90edc8de1ece219a9257144914ef26dbd1c. A production checklist proceeds to IAM/auth changes, EventBridge alert rule creation, CloudWatch log retention mutation, online evaluator creation and agentcore deploy -y without independent resource, recipient, telemetry, cost and change-window approval. It suggests decoding a sample JWT at jwt.io without explicitly prohibiting live token disclosure to a third-party site. Strong least-privilege and credential guidance is extractable, not unchanged safe. Package-specific freshness is unknown; security scan and behavioral validation not established.
