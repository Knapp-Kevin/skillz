rationale: Exact package-tree reconciliation at the registered AWS pin, bound to tree SHA 227d5d909d3d510602d2ec83381240cd81ba5221. The package contains substantial stage-hardening guidance including log retention, throttling, X-Ray, WAF, authorization options, Secrets Manager guidance and post-configuration validation. It is rejected unchanged because after parameter acquisition it creates or modifies IAM roles, API Gateway account settings, log groups, retention, the stage, throttling, method logging and a WAF ACL/association without a distinct explicit authorization gate for the mutation set. Informing the customer before each operation is transparency, not consent. Retain as adaptation/reference material. API Gateway/WAF pricing, service behavior, patch paths and managed policies are freshness-sensitive.