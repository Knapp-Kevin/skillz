rationale: Aurora PostgreSQL operations and decision-support package bound to the registered AWS snapshot and exact package tree SHA eb9414ad02354efaa482cb24003af763030ec00d. The package contains SKILL.md, a substantial focused-reference set, and bundled analysis scripts. It routes express/full creation, serverless sizing, I/O-Optimized evaluation, commitment pricing, and upgrade planning through explicit sub-skills; requires confirmation before all create/modify mutations; escalates high-impact operations to risk-then-confirm; and blocks deletion, failover/switchover, direct major-version changes, password management, network-security changes, public database exposure, financial commitments, and reboots with safer alternatives. Express configuration is explicitly distinguished from full VPC configuration and uses IAM-only authentication rather than master-password workarounds. Authority is mutating because confirmed provisioning and configuration changes are supported. Portability is low because behavior depends on Aurora PostgreSQL/RDS, express-configuration semantics, AWS identity/networking, pricing/ACU/engine behavior, and bundled package tooling. Pricing, ACU limits, express capabilities, engine versions, instance classes, storage-transition constraints, authentication behavior, and upgrade guidance are freshness-sensitive and require current AWS verification before consequential use.