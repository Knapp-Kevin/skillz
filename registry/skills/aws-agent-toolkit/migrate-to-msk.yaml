rationale: Self-managed Kafka to Amazon MSK Express migration procedure bound to the registered AWS snapshot and exact package tree SHA a4e9b51d24f59d5bfc0bbb7bf234a2d096163911. The package contains SKILL.md, four substantial references, three deterministic Python processors, and a static simulation CloudFormation asset. It strongly separates discovery, assessment, and optional simulation; requires discovery reference/template loading; explicitly stops after discovery until customer confirmation; forbids speculative compatibility/cost conclusions before real assessment artifacts exist; and treats assessment processors as offline file operations. Phase 3 is materially mutating because it can deploy temporary VPC, MSK Express, EC2/SSM, CloudWatch, and load-test resources, so the overall authority tier is mutating despite read/generate-only earlier phases. Security guidance covers TLS, KMS, IAM authentication, Secrets Manager, private networking, CloudTrail, alarms, and sensitive artifact handling. Portability is low because the flow is tightly coupled to Amazon MSK Express, AWS-published sizing artifacts, AWS deployment services, Kafka/MSK constraints, and bundled scripts/assets. Supported Kafka versions, quotas, pricing workbook behavior, authentication support, MSK Replicator constraints, and simulation resource assumptions are freshness-sensitive and require current AWS verification before consequential migration or deployment decisions.