rationale: Amazon MSK Provisioned operations guidance bound to the registered AWS snapshot and exact package tree SHA b16afcc92da29d85d0e610d38a1c49b20e5e32e8. The package contains SKILL.md, seven focused reference documents, and the upstream msk_sizing.py utility. It distinguishes Standard from Express broker behavior, gives strong failure-avoidance warnings around under-replicated partitions and maintenance, routes sizing through a deterministic package script, and covers client tuning, monitoring, storage, performance, lag, maintenance, configuration, and cost. Authority is mutating because workflows include broker-storage expansion, cluster configuration, CloudWatch alarm/dashboard creation, upgrades, and other operational changes. Portability is low because the material depends heavily on Amazon MSK, AWS/Kafka metrics, AWS tooling, broker-type semantics, Kafka client behavior, and bundled upstream tooling. Several concrete quotas, instance families, metric thresholds, pricing assumptions, Kafka versions, and Standard-versus-Express behaviors are freshness-sensitive and should be checked against current AWS documentation before consequential use. The upstream skill contains important safety warnings but does not provide one universal explicit confirmation gate before every mutation, so the host must apply its own authority policy.