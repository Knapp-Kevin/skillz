rationale: Focused AWS Glue connection creation and troubleshooting package for JDBC databases, Redshift, Snowflake, and BigQuery. The exact package contains SKILL.md plus seven references for BigQuery, credential security, discovery, JDBC, network setup, Snowflake, and troubleshooting, and is bound to tree SHA af4c577873ceabf3cd9b0b90470754ad1e51d8e8 at the registered AWS snapshot. It separates connection registration from data movement, inspects existing connections before creation, requires user-provided connection hints rather than guessing, prefers Secrets Manager or supported IAM database authentication, prohibits plaintext credentials in chat/logs, requires confirmation before creating a new secret, and prohibits credential rotation without confirmation. Authority is mutating because the documented host workflow can create Secrets Manager material and Glue connections and can require VPC/security/IAM changes or smoke-test jobs. Portability is low because the procedure is tightly coupled to AWS Glue, AWS account/network semantics, source-specific connection types, and AWS tooling. Bundled references remain intact upstream material rather than repository-owned execution machinery.