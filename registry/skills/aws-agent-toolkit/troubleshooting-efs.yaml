rationale: Exact package-tree reconciliation at the registered AWS pin, bound to tree SHA eed46ff1bb476cf5acae18ac4e4182531a94b1af. The package provides useful symptom classification, EFS/NFS/network/IAM/POSIX/performance/KMS/DNS diagnostics, read-only dependency checks and concrete evidence commands. It is rejected unchanged because remediation commands include package installation, security-group ingress, EFS throughput-mode changes and VPC DNS mutation while command display and confirmation are only SHOULD requirements rather than a mandatory authorization gate. Retain as adaptation/reference material; read-only diagnostic sections remain useful. EFS limits, performance semantics, client behavior and AWS APIs are freshness-sensitive.