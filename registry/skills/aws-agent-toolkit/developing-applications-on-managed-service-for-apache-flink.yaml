rationale: Comprehensive AWS-specific Flink/MSF development and operations package bound to package tree SHA d25d5b3e35634d1af706264856c4748770c8b20f at the registered AWS snapshot. The package contains SKILL.md plus 25 reference documents covering architecture and constraints, Flink 2.x migration, KPU/resource optimization, scaling and pricing, lifecycle and first-fault isolation, checkpointing, job-graph architecture and anti-patterns, monitoring/logging, Kinesis/EFO, Iceberg, CDC, IaC/deployment, dependency and environment setup, serialization, and state management. It explicitly distinguishes MSF service-level configuration from application code, preserves stable operator UIDs/state migration concerns, routes consequential tasks to focused references, and documents operational failure modes. Authority is mutating because the documented host workflow can compile, deploy, update, scale, snapshot, start/stop, and otherwise operate AWS resources through external tools. Portability is low because the package is intentionally coupled to Amazon Managed Service for Apache Flink, AWS service identifiers, KPU semantics, IAM/CloudWatch/VPC/S3, and AWS-specific connectors and deployment behavior. Numerous service quotas, runtime versions, connector APIs, pricing assumptions, and service constraints are freshness-sensitive; an external agent should verify consequential volatile claims against current AWS and Flink documentation before acting. Bundled upstream references remain intact source material, not repository-owned execution machinery.