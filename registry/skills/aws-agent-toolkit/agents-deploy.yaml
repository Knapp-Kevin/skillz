  Purpose/non-trigger: Preflight, deploy, diagnose deployment failures, or version/rollback an existing AgentCore project; not new project scaffolding or security hardening. Exact pinned package tree 821a52c3717b9cf6bab0a9741d7bd732992a558d, manifest blob 5cee1ceb11f57e7a97a48216a377336cb3fc2886. Preflight and CDK diff are useful, but the run-deploy path gives agentcore deploy -y including staging/production without a separate action-specific account, environment, resource, cost and traffic authorization boundary. IAM permission repair and rollback references also affect persistent cloud state. Auto-confirm bypasses the CLI confirmation; preview is not consent. Retain dry-run/diff and region checks as checklist. Package-specific freshness is unknown; security scan and behavioral validation not established.
