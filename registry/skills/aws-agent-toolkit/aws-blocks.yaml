dependencies: Node.js/npm and the @aws-blocks package family; installed-version package READMEs for authoritative APIs and workflow details; AWS credentials and IAM authority for sandbox/deploy operations; CDK-backed AWS resources for deployed environments; optional Amplify Gen 2 integration when detected
import_eligibility: exact-version-reference
rationale: Focused AWS Blocks application-development guidance with explicit trigger boundaries, installed-version documentation routing, local-without-AWS development support, and unusually concrete production safeguards for authentication, secret storage, schema validation, least-privilege IAM, FileBucket access, CORS, cross-domain cookies, monitoring, WAF/throttling, and sensitive logging. Scaffolding, sandbox, and deploy workflows can create files and cloud resources, so operational use requires current host/user authority and cost awareness.