rationale: Exact package-tree reconciliation at the registered AWS pin, bound to tree SHA 7b783a4689b151518e98395ec2d6c745973ba53d. Strong mechanisms include fit routing away from unsuitable sustained-QPS/hybrid-search workloads, existing-index reuse checks, immutable index-parameter confirmation, explicit embedding-model choice, dimension consistency, retry/backoff, metadata permission guidance and destructive-recreate confirmation. Rejected unchanged because the standard creation flow can create a vector bucket and index and write vectors after name/parameter confirmation without a distinct affirmative authorization gate for the consequential resource/data mutation plan. Retain as adaptation/reference material. S3 Vectors limits, regional availability, latency, Bedrock models, IAM/KMS requirements and API behavior are freshness-sensitive.