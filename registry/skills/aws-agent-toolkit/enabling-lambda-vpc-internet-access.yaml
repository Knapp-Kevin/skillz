rationale: Exact pinned AWS package bound to tree SHA aeeb93a185086fc2a816c95022dc4077f2153c73. The workflow first inspects the existing Lambda/VPC topology, plans only the missing NAT path, then requires an explicit user approval gate that lists all proposed billable resources, current pricing references, target VPC/AZ and affected function before creating anything. It aborts if approval is declined and suggests VPC endpoints as a lower-cost alternative. After approval it avoids duplicate gateways, verifies each infrastructure step, limits inbound changes, recommends narrower outbound rules and preserves the distinction between planning and mutation. Authority remains mutating because confirmed NAT/subnet/route/security-group changes are supported. Portability is low because the workflow is tightly bound to AWS Lambda and VPC networking. NAT/EIP pricing and VPC behavior are freshness-sensitive and require current AWS evidence.