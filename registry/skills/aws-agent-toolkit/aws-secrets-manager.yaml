rationale: Focused secret-handling guardrail for external agents working with AWS Secrets Manager. It explicitly prohibits retrieving plaintext secret values into model-visible context and instead routes runtime resolution through dynamic references and the bundled asm-exec wrapper. The material correctly describes itself as best-effort defense rather than a security boundary and calls for IAM least privilege, CloudTrail monitoring, and VPC endpoint policies as complementary controls. Authority is mutating because documented examples execute downstream commands, access AWS-backed secrets through external credentials, and may write configuration or operate applications under user-authorized host authority. Portability is medium because the core principle of keeping secrets out of model context transfers broadly, while the concrete dynamic-reference syntax, SMA/MCP backends, SigV4 behavior, and plugin hook are AWS-specific. The pinned package is passive reference material; its bundled executable reference belongs to the upstream source and is not repository-owned machinery.