rationale: Exact pinned AWS package bound to tree SHA 94ab274fb3503595c22fb491767572173146ba01. The procedure contains useful parameter validation, duplicate-endpoint detection, existing-endpoint handling, endpoint-type classification, post-create availability checks and connectivity guidance. It is rejected unchanged because after collecting and confirming parameters it requires creation of security groups, ingress rules, gateway/interface endpoints and endpoint-policy mutations without a distinct explicit authorization gate covering those consequential billable/network-security changes. Asking whether to proceed despite missing tooling and asking how to handle pre-existing endpoints are not sufficient authorization for new mutations. Portability is low because behavior is tightly coupled to AWS VPC/PrivateLink semantics and the upstream call_aws tool contract. Service endpoint support, regional availability, DNS behavior and endpoint pricing are freshness-sensitive and require current AWS evidence before consequential use.