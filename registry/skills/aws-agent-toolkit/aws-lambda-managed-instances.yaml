rationale: Exact pinned AWS package bound to tree SHA 7df96da81f6a20670128f6b572a7f0e2f0d30273. Strong mechanisms include mandatory workload and cost assessment before recommendation, explicit LMI-vs-standard-Lambda tradeoffs, concurrency/thread-safety review by runtime, MaxVCpuCount cost ceilings, three-AZ resilience guidance, least-privilege operator-role conditions, gradual weighted-alias cutover and non-production validation. The infrastructure reference provides manual CLI and IaC examples rather than directing the host to autonomously execute them, so generate-only authority is appropriate. The score is bounded by highly volatile product limits, pricing, scaling claims and regional/instance availability that must be checked against current AWS documentation. Portability is low because the capability is specific to Lambda Managed Instances.