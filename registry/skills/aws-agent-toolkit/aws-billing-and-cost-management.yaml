rationale: Strong AWS cost-analysis and optimization guidance with explicit current-date checks, deterministic-calculation requirements, API-specific gotchas, billing-view scoping, troubleshooting, and source-intact deep references. Many workflows are read-oriented, but budget creation, Compute Optimizer enrollment, commitment decisions, and other account-level cost-management actions can mutate configuration or create financial commitments, so use requires current credentials, cost awareness, and explicit host/user authority.