rationale: Exact pinned AWS package bound to tree SHA a9d59dbfbe0f23678270f8b2dbf3c228368ca086. Strong mechanisms include explicit workload-fit boundaries, regional-availability checks, image/runtime lifecycle separation, short-lived port-scoped auth tokens, confused-deputy guidance, snapshot uniqueness and secret-rotation warnings, VPC egress isolation, least-privilege roles, explicit warnings around shell tokens and additional OS capabilities, and freshness routing for soft quotas. The package presents CLI examples and operational patterns but does not mandate autonomous cloud execution, so generate-only authority is appropriate. The score is bounded by the service's novelty and rapidly changing API, quotas and endpoint semantics; all consequential use requires current AWS confirmation. Portability is low because the mechanics are Lambda MicroVM-specific.