rationale: Exact pinned AWS package bound to tree SHA d90bbc41109b0667dbc79be2165d8e6399190b14. Useful mechanisms include distribution validation, CNAME prerequisites, ACM-region correctness, preservation of existing CloudFront configuration, public-zone checks, IPv4/IPv6 alias handling and propagation verification. Rejected unchanged because the procedure requests an ACM certificate, writes DNS validation records, updates the CloudFront distribution and UPSERTs Route 53 records without a distinct explicit authorization gate for those consequential traffic-routing and external-service mutations. It asks permission only when a hosted zone itself must be created, which is too narrow. Portability is low and CloudFront/Route53/ACM behavior is freshness-sensitive.