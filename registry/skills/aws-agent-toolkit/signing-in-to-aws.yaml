rationale: >-
  Exact pinned package tree ee531e3e75bc80420fa93a7cec433cc3cdb3340f, manifest 3f56dd7330dc9ff8ade816425d5d1d5b4a79c5f7. Purpose/non-trigger: Repair missing/expired local AWS CLI credentials for developer use; not CI/CD credentials or existing SSO workflows. At the exact pin the procedure explicitly asks before aws login, a useful safeguard, but mandates silent pre-confirmation aws sts get-caller-identity and optionally aws configure list, displays private Account/Arn, inspects access-key prefix metadata, and then persists/refreshes local credential state. Approval is only for login, not scoped identity reads or account/profile disclosure, and no private-output minimization gate exists. REJECT unchanged 14/20, retain SSO distinction, short-lived credential guidance and version check as ADAPT/EXTRACT/CHECKLIST. Security scan and behavioral validation not established.
