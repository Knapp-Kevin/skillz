rationale: End-to-end Amazon DocumentDB package bound to the registered AWS snapshot and exact package tree SHA 4fc95aee114b9b6911dcdfc1d41a9715c3df4e62. It covers connection, schema/vector design, MongoDB compatibility, DMS migration, performance, Well-Architected review, major-version planning, and cost/security guidance. It contains explicit refusal boundaries for destructive cluster deletion, failover, direct major-version mutation, and reboot; prevents wildcard IAM and 0.0.0.0/0 examples; requires parameter validation, workflow routing, and current-documentation checks for regional instance classes and volatile MongoDB compatibility. Authority is mutating because the skill is explicitly an executor for cluster creation, AWS/DMS operations, indexes, migrations, and other live changes. Portability is low because it depends deeply on DocumentDB, DMS, AWS networking/identity, MongoDB-compatible client tooling, and bundled references/scripts. A notable caveat is that the top-level creation example includes an inline master-password form before recommending managed Secrets Manager credentials for production; hosts should prefer managed-secret/IAM-safe flows and avoid exposing plaintext secrets. Engine versions, serverless defaults, feature/operator compatibility, instance availability, pricing, limits, and migration/upgrade semantics are freshness-sensitive and require current AWS evidence before consequential use.