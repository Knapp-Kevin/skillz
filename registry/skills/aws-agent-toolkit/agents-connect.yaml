rationale: >-
  Purpose/non-trigger: Connect an existing AgentCore agent to external services via Gateway or credential providers; not project scaffolding or general production hardening. Exact pinned package tree d92b447658b287aaab5c91e04e910d8947c4ddef, manifest blob 0790cd87460eba885c66686d965c9f4d4991addb. Offers gateway-target and credential creation followed by agentcore deploy -y without independent account/resource/endpoint authorization. Examples include --api-key and --client-secret literal command-line patterns despite later shell-history warnings and a safer interactive path. Target registration can expose external APIs and persistent cloud resources; require secure credential entry and explicit target/deploy authority. Retain Gateway-first and auth-type distinction as extraction. Package-specific freshness is unknown; security scan and behavioral validation not established.
