rationale: "REJECT unchanged at registered AWS pin, exact package tree 5da0a0c41f57fbf7470deb7970a5f403ab40997d. Bundled `references/aws-iam-role-management.md` explicitly says that when resource names/service types are supplied, proceed directly with IAM role creation and do not ask for confirmation. This can create identity/trust/policy state in a live AWS account; an account ID inferred from the session is not action authorization. Separate policy-generation reference correctly gates policy upload, but that safeguard does not cover the role-creation path. Preserve IAM condition-key, confused-deputy, PassRole, and policy-generation prior art. Authority hard-fail independent of numeric score; preserve source-owned package and useful ADAPT/EXTRACT/CHECKLIST prior art. Behavioral not-run; no package-security scan."