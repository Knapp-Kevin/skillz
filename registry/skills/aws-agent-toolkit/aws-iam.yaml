rationale: High-value IAM correction and workflow reference covering policy evaluation edge cases, trust policies, STS, Organizations, SAML/MFA, least-privilege policy generation, service roles, confused-deputy protection, iam:PassRole escalation risk, and condition-key safety. It explicitly requires current official-document verification for volatile IAM facts. Operational use can create or modify roles, policies, credentials, trust relationships, and other authorization state, and the policy-generation workflow may install or invoke external tooling, so use requires current host/user authority. The pinned source itself remains passive reference material; its unpinned iam-policy-autopilot@latest instruction is an operational dependency to evaluate at use time, not repository-owned execution.