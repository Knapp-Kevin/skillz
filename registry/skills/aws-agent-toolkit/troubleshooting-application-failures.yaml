rationale: Exact pinned AWS package bound to tree SHA f519cd0e9b2f2c37e773508572bcf567802aa083. The workflow is diagnostic rather than mutating: it discovers candidate log groups, requires the user to confirm relevance before analysis, validates available streams and time ranges, derives query timestamps from observed AWS data, runs read/query operations, waits for actual results, categorizes evidence, and produces prioritized root-cause recommendations and rollback guidance. It does not execute the recommended remediations. The evidence-first separation between observed logs, inferred root causes and proposed actions is strong. Portability is low because execution depends on AWS CloudWatch Logs and naming/retention conventions, while the analytical method itself is broadly reusable. Behavioral validation remains separate from static verification.