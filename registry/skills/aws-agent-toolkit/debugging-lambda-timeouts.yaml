rationale: Exact package-tree reconciliation at the registered AWS pin, bound to tree SHA 0b5c7ec0264a041242a7c815f0304969413fc92b. The procedure stays diagnostic: it retrieves configuration, metrics, log streams and Logs Insights results, correlates cold starts/dependencies, optionally analyzes user-provided code and produces prioritized recommendations without applying configuration changes. It includes bounded time-window handling, explicit query completion checks and evidence-driven root-cause reporting. Portability is low because the workflow is tightly coupled to Lambda and CloudWatch. Metric names, limits, query syntax and service behavior are freshness-sensitive.