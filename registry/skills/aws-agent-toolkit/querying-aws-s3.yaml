rationale: Exact package-tree reconciliation at the registered AWS pin, bound to tree SHA bd942552b303cf65e2623b5e437122772d4fcb33. The query core is well structured with system-table routing, current-state/status checks, encrypted Athena output requirements, read-only table semantics, sensitive requester/IP handling and targeted SQL examples. Rejected unchanged because the package also includes enable/setup paths that create bucket metadata configuration, enable Storage Lens table export and create Glue federated catalog integration without a distinct affirmative authorization gate. Retain the query workflows as adaptation/reference evidence. S3 Metadata/Storage Lens schemas, latency/backfill timing, integration semantics, pricing and APIs are freshness-sensitive.