rationale: RDS for Oracle connectivity and operations package bound to registered AWS pin and exact package tree SHA f209347769fdd7223cd2a21f6a9ac269d4be1e9b. The skill has an unusually explicit authority model: it requires explicit user confirmation before every create/modify operation, adds downtime warnings before higher-impact confirmed mutations, and refuses deletion, failover, major-version upgrade, reboot, replica promotion and public-access enablement while offering assessment/change-control alternatives. Security guidance requires private access, Secrets Manager, encryption, scoped KMS policies and audit logging; it also corrects important Oracle-on-RDS misconceptions such as lack of RDS Proxy support. Focused routing and bundled diagnostics keep connection/network/runtime troubleshooting grounded in package references. Authority remains mutating because confirmed provisioning/configuration is supported. Portability is low because the material depends deeply on RDS Oracle, Oracle drivers/client/CMAN licensing, AWS networking/identity and bundled tooling. Oracle/RDS version families, driver support, service constraints, Kerberos behavior, instance capabilities and option-group details are freshness-sensitive and require current authoritative verification before consequential use.