  Purpose/non-trigger: CDK infrastructure authoring, deployment, import, refactor and troubleshooting; not SAM, Terraform/Pulumi or raw CloudFormation. Distinct plugin package tree 1c69221e639f1e6efe81befa51d3b5cdb064f737, manifest bf47a52741f9b7c97c1dd5189676f6c44397559f; its cross-stack removal and deployment troubleshooting references differ from canonical core aws-cdk. Nine bundled references prescribe bootstrap with IAM/trust grants, deploy, import, force rollback, destroy and resource replacement operations without an independent exact account/region/stack/cost/destructive authorization boundary. CLI confirmation and diff warnings are not approval. REJECT unchanged 14/20; preserve useful ADAPT/EXTRACT/CHECKLIST patterns. No security scan or behavioral execution.
