rationale: Exact pinned Aurora DSQL package at tree SHA 254a60139d64cdc667f97566caafa5e181a3118c. The skill is a broad operational and development reference covering cluster lifecycle, IAM-authenticated connectivity, schema/DDL, MySQL migration, multi-tenant design and query-plan analysis. It strongly prefers canonical DSQL connectors, scoped IAM tokens, parameterized/safe SQL construction and mandatory reference loading before sensitive operations. Authority is mutating because it supports cluster creation and database writes/DDL. Portability is low because its procedures depend on Aurora DSQL semantics, AWS IAM/CLI behavior, psql, AWS service limits and DSQL-specific connector packages. Exact service limits and connector versions are explicitly freshness-sensitive and should be verified when consequential.