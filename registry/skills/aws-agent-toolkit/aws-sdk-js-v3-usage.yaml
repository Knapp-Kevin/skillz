rationale: High-value AWS SDK for JavaScript v3 reference covering modular clients, credentials, streaming responses, pagination, DynamoDB DocumentClient, S3 helpers, error handling, middleware, performance, Lambda reuse, TypeScript narrowing, SigV4a, schemas, and service-specific patterns. Operational authority is mutating because SDK procedures can invoke arbitrary AWS service operations, including resource creation or modification, according to the external host agent's credentials and user authority. Portability is medium because the JavaScript/TypeScript engineering patterns transfer conceptually, while concrete packages, credentials, service semantics, and examples are AWS-specific. Exact SDK and Node.js compatibility thresholds are version-sensitive and must be confirmed against current upstream documentation before consequential use; the pinned package remains passive reference material and performs no operations itself.