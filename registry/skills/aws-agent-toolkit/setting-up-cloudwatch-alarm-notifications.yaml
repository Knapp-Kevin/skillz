rationale: Exact pinned AWS package bound to tree SHA 8b19ae185f986da60aaf1cfc8659cfe137f6f950. Useful mechanisms include alarm existence/configuration checks, SNS encryption, preserving existing alarm settings, email-confirmation handling, endpoint validation and post-change verification. Rejected unchanged because after showing the current alarm configuration it creates an SNS topic, changes policies/encryption, creates subscriptions, rewrites alarm actions and deliberately forces ALARM/OK state changes for testing without a distinct explicit authorization gate for those external notifications and monitoring mutations. Displaying configuration for confirmation is not permission to mutate or send test notifications. Portability is low and SNS/SMS pricing, regional support and CloudWatch alarm semantics require current AWS evidence.