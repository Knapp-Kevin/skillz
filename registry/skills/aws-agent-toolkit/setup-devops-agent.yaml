rationale: >-
  Purpose/non-trigger: Configure a missing or broken AWS DevOps Agent MCP connection; not routine use of an already healthy connection. Exact pinned package tree 4b3d53ccc19d5664f349a2f5c1e53aec35e26c90, manifest blob afea862a61c3ae081253cc566220e55398fb4cda. The procedure usefully asks for an auth-mode choice and confirms the main MCP config write, but SigV4 verification executes unpinned uvx mcp-proxy-for-aws@latest before separate installation authority, reads account identity, and later lists private AgentSpaces and writes a routing guide without a separate scoped private-read and durable-file authorization. Token guidance keeps values in environment variables rather than asking for chat disclosure, but project-scoped config and remote tool scope still need host governance. Reject unchanged; retain choice and connectivity checks for adaptation. Source pin is fixed, package-specific freshness unknown; security scan and behavioral validation not established.
