rationale: AWS Transform modernization package bound to registered AWS pin and exact package tree SHA 19d719b83327293bcd98072b8e93e7774f4122c3. It has meaningful consent and privacy controls: waits for a user goal and explicit repository targets before inspection, discloses telemetry and opt-out information, asks consent before attaching AWSTransformCustomFullAccess, requires user confirmation of transformation plans, treats remote infrastructure deployment as consent-bound, and prevents secrets from being pasted into chat. However, it mandates `atx update` unconditionally at the start of every session and explicitly says not to ask the user whether to update. That mutates host-installed tooling/transformation definitions outside a user authorization boundary. The package can also modify local repositories and provision remote AWS execution infrastructure, so the forced updater is material rather than cosmetic. Retain as useful modernization/reference evidence but reject unchanged under the current mutation-consent standard. Portability is low because it depends on ATX, AWS credentials/services, OS support, git/repository access and optional CDK/remote infrastructure. CLI behavior, transformation definitions, permissions, remote-infrastructure details, concurrency limits and supported platforms are freshness-sensitive.