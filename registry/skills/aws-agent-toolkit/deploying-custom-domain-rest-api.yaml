rationale: Exact package-tree reconciliation at the registered AWS pin, bound to tree SHA 3d2ecacf1abfe8cfb6661ff04cba16558cd4c1c6. The package is a detailed end-to-end Regional API/custom-domain build with certificate validation, IAM roles, Lambda functions, request authorizer, TLS 1.2, scoped Lambda permissions, access logging, base-path mapping, Route 53 aliasing and final validation. It is rejected unchanged because it performs a large consequential mutation sequence including certificate request/DNS validation records, IAM roles, Lambda deployment, API deployment, custom-domain creation and DNS cutover without a distinct explicit authorization gate for the plan. It also ships hardcoded demo authorization values and only warns that they are unsuitable for production. The user may abort at any point, but absence of refusal is not affirmative authorization. Retain as adaptation/reference material. Runtime versions, ACM/API Gateway/Route 53 behavior and DNS propagation assumptions are freshness-sensitive.