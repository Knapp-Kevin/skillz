rationale: RDS for Db2 lifecycle package bound to registered AWS pin and exact package tree SHA 8c875037cc000e02e89c2f742b52a0f0b3e4d220. It has excellent RDS-managed Db2 specificity: no unfenced C/COBOL procedures, RDSADMIN signatures, Secrets Manager rotation diagnosis, z/OS CDC/tooling constraints, cross-region mounted-replica prerequisites, restore procedure sequencing, BYOK/Kerberos/audit/IAM guidance, focused reference routing, credential-safety rules, and explicit unsupported-operation alternatives. It also distinguishes runtime-generated artifacts from shipped skill content. However, the top-level procedure collects parameters and then directs the agent to execute exact provisioning, replica, KMS, option-group, migration, and operational commands without a distinct general user-authorization boundary for those consequential mutations. Dependency abort rights and parameter collection do not constitute consent to create or modify billable/security-sensitive resources. The package is therefore useful reference/adaptation evidence but rejected unchanged under the current mutation-consent standard. Portability is low because it depends deeply on RDS for Db2, IBM Db2 tooling/licensing, AWS services, and bundled helpers. Driver versions, service capabilities, migration support, licensing, instance classes, IAM requirements and RDSADMIN behavior are freshness-sensitive and require current authoritative verification.