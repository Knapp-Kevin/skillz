rationale: DMS Schema Conversion lifecycle package bound to registered AWS pin and exact package tree SHA 2e1b5f3ef40011f79fc7495445cca086ff0e15ed. It explicitly requires current linked AWS documentation before acting on vendor/API-specific rules, asks the customer to select region rather than inferring one, confirms reuse versus creation of migration projects, asks permission before creating a new project, shows imported schemas for connection confirmation, and routes each conversion/assessment/tree/cleanup action through explicit customer selection. Applying converted DDL to a live target appears only as a user-selected post-conversion action, and overwrite behavior requires confirmation. These boundaries support a verified state despite mutating capability. Portability is low because the workflow depends heavily on AWS DMS Schema Conversion APIs, migration-project semantics, S3, AWS credentials and engine-specific metadata rules. DMS API behavior, supported engine combinations, metadata-model semantics, waiters and selection/transformation rules are freshness-sensitive and should be verified against current documentation before consequential use.