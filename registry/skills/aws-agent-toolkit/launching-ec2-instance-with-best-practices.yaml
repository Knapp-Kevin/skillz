rationale: EC2 instance-launch package bound to the registered AWS pin and exact package tree SHA 73282bc12f3061da6dc9554d013651858595ecda. It requires the external agent to collect required workload/region inputs, derive secure/cost-aware defaults, present all proposed defaults and reasoning to the user for confirmation before proceeding, separately confirm selected network topology, verify current AMIs and instance-type availability, prefer SSM over SSH, avoid handling private key contents, apply least privilege to instance roles, encrypt gp3 storage, harden security groups, tag resources, and verify the launched instance. The confirmation boundary occurs before resource creation and the user can override defaults. Authority is mutating because the workflow creates IAM/security-group/key/EC2 resources. Portability is low due deep AWS EC2/IAM/VPC/SSM/CloudWatch coupling. Exact instance families, prices, free-tier status, AMI recommendations, monitoring costs, performance claims and service behavior are freshness-sensitive and should be checked live before consequential use.