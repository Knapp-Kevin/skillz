rationale: Technically detailed token-based Vercel operations guidance, but unchanged use is blocked because it instructs the agent to print VERCEL_TOKEN, grep token-bearing .env lines, and ask the user to provide a token. Those steps can expose credentials in tool/chat output despite later warnings against command-line token exposure. Adaptation must use non-echoing secret-presence checks and a secure credential acquisition path before reverification.
