rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA b3e4d266af84eb18450c25a7d8c050824f9e5baa and SKILL.md blob 1720bde7863898eca16efd3be18d3e072f57bcf1. The package provides useful univariate and multivariate time-series analysis guidance, but unchanged adoption fails current authority/data-handling rules because detection transmits time-series data to a metered external AI service while multivariate workflows train and delete remote models and consume SAS-addressed Blob datasets without distinct data-governance, model-mutation, credential-bearing data-source and cost authorization gates. Preserve as adaptation/reference evidence with explicit data transmission, model lifecycle and metered-service boundaries.