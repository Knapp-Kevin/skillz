rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA b3e4d266af84eb18450c25a7d8c050824f9e5baa, SKILL.md blob 1720bde7863898eca16efd3be18d3e072f57bcf1, and references/examples.md blob e5a93ddc31a0047050d10938b829a5551980480a. The package provides useful Java guidance for univariate batch/streaming anomaly detection, change-point detection, multivariate training/inference, model management, authentication, errors, and complete application structure. Unchanged adoption fails the current hard authority rule because normal procedures transmit time-series/application data to a metered external AI service, train remote multivariate models from Blob/SAS data, run remote inference, and delete models without distinct affirmative data, cost, resource-mutation, or destructive-action authorization boundaries. Credential examples use environment variables, placeholders, DefaultAzureCredential, requireEnvVars, and managed-identity guidance rather than soliciting actual secret values conversationally. Preserve as adaptation/reference evidence with explicit data-governance, cost, model-lifecycle, destructive-action, and SAS/credential handling gates before operational use.