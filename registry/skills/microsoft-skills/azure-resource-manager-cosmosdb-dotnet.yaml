rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA ae77139599d20bf57a395beb84a68190b5e4382e and SKILL.md blob 3318c2734fa2a69f00d526073fad9b49426d5ef1. The package provides extensive Cosmos DB management guidance across accounts, databases, containers, indexes, TTL, throughput, failover, networking, backup, stored procedures/triggers/UDFs and multiple APIs. Unchanged adoption fails because it creates/scales/deletes billable database resources without approval, retrieves and prints master keys and connection strings, regenerates keys, changes failover/network/firewall/throughput state, and includes a stored-procedure example that bulk-deletes documents. Preserve as adaptation/reference evidence with explicit resource/cost, secret-access/rotation, network/failover, throughput and destructive-data gates.