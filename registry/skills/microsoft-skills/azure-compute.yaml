rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA cdfc4a39b926efba5060eddc6d790b035501bc25 and SKILL.md blob fce17d1f64f4013e21ab1f53636852ca0251a5f2 plus the bundled workflow/reference tree. The package preserves strong VM/VMSS routing, read-only SKU/image/quota validation, adaptive requirement gathering, plan-card review, cost visibility, output-format separation, and an explicit final confirmation before live VM/VMSS creation through Azure MCP. Unchanged adoption is nevertheless rejected under the current authority hard fail because other bundled workflows directly create billable Capacity Reservation Groups/reservations and enable or offboard subscription-level Essential Machine Management, register resource providers, create monitoring workspaces, and alter security/identity-related subscription configuration without a mandatory action-specific authorization boundary immediately before those consequential mutations. Preserve the planning, validation, recommendation, and artifact-generation mechanics for adaptation/reference use, and require explicit target, cost, identity/access, security-control, production, and destructive/offboarding authorization before live operations. Behavioral validation has not been run.