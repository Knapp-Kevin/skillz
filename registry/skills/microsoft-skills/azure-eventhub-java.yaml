rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 83b03c95ba3346a76ad291867fb3a4c9803dc545, SKILL.md blob 9399c5d62cc5d5b395e65ad0fc5aaa780e03242e, and bundled examples blob 0592023e4628a41cf7150e344c37b1d99f41f88e. The package is useful Azure Event Hubs Java prior art for producers, consumers, batching, partition routing, EventProcessorClient, checkpointing, async streams, event positions, and authentication. Unchanged adoption is rejected because ordinary examples publish application or user-bearing event payloads to an external metered service, read and print event bodies, start background processors, and mutate durable checkpoint state without distinct external-communication, event-data/privacy, background-processing, checkpoint-state, or service/cost authorization boundaries. Connection-string examples use placeholders and the main skill provides stronger DefaultAzureCredential/managed-identity guidance, but explicit least-privilege, data-classification, logging/redaction, retention, and checkpoint-governance boundaries are absent. The top-level skill pins azure-messaging-eventhubs 5.19.0 and checkpointstore-blob 1.20.0 while bundled examples use 5.21.0 and 1.21.0, creating a concrete version-consistency defect. Preserve as adaptation/reference material with explicit data, communication, background-processing, state, credential, cost, and dependency-version boundaries.