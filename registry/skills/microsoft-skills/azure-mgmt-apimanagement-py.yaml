rationale: Exact one-file package review at the registered Microsoft Skills pin, bound to package tree SHA b5092b4ffe491abdf28e33c8c9fa3d06af6c9aee and SKILL.md blob 23cccf5a75db3eff3a6e263347caf1e5fab5a495. Useful material covers Entra-first authentication, APIM service/API/product/subscription/policy/backend/user management, and lifecycle guidance. Unchanged use is rejected because examples create billable APIM services, publish products without approval, create active subscriptions and print subscription keys, mutate gateway policies/backends, create users with PII, and demonstrate a literal secret value without explicit environment, secret-custody, audience/access, user-data, policy-change, rollback, or cost authorization boundaries. Preserve only as adaptation/reference material with secure secret storage, no credential output, explicit target and policy approval, least privilege, privacy review, rollback/cleanup, cost controls, and pinned dependencies.