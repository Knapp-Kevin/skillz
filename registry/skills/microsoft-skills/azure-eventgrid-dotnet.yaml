rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 482dbcdcc9a1108a63e53395c16d08ac5b3fef22 and SKILL.md blob 3156848ee9bf82dc7f0aabd71934e19574113601. The skill provides useful .NET guidance for Event Grid publishing and pull delivery, CloudEvents/EventGridEvent schemas, Entra/key/SAS authentication, parsing, system events, Azure Functions triggers, retries, dead-letter handling, and failover patterns. Unchanged adoption fails the current authority/data-handling rule because normal examples publish event payloads to external Azure topics/domains/namespaces and acknowledge, release, or reject received events, changing external message state, without a distinct affirmative side-effect/cost/data-transmission authorization boundary or mandatory approved-data-handling prerequisite. The failover pattern can also resend event batches to a secondary region. Credential guidance is comparatively strong through managed-identity/DefaultAzureCredential recommendations and placeholder key examples. Preserve as adaptation/reference evidence with explicit publish/message-state, cost, data-governance, and cross-region failover authorization gates before operational use.