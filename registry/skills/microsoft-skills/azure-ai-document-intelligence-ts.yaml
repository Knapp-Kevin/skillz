rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 15f2f21b7bebeedf12dc47987c3663e56edf26cb and SKILL.md blob a87c33a71c51eda6ff4ca326600fcc774b3a691f. The single-file package is useful prior art for TypeScript document analysis, prebuilt invoice/receipt/identity/health-insurance/tax/bank-statement extraction, layout/table handling, batching, error handling, and custom model/classifier lifecycle. Unchanged adoption is rejected because ordinary examples transmit potentially highly sensitive documents and derived fields to Azure without mandatory subject/data authority, approved destination/region, minimization, retention, or output-disclosure controls; remote-URL analysis lacks an explicit trusted-source boundary; custom training solicits a credential-bearing storage SAS URL and persists derived models without a secure external credential path or training/data-use authorization; and build/compose/delete operations mutate persistent billable service state without action-specific model, destructive-action, rollback, or budget authority. Preserve as adaptation/reference evidence with explicit sensitive-data transmission authority, trusted-source restrictions, secure external credential handling, training/model lifecycle approval, disclosure/minimization/retention controls, and service-use/cost authorization.