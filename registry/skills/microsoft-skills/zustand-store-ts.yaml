rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 8dc1658099b269c1e6347b7d0ffbe38d6f7058c1, SKILL.md blob fe9aca17683b17d3c86c78cb3473f52a10b38f3d, and template blob 3c40062ec21c5d1e875b3816516a706701a8bc03. The package provides focused local state-management prior art for typed Zustand state/action separation, subscribeWithSelector, individual selectors, external subscriptions, loading/error state, immutable add/remove operations, and reset behavior. Its authority is bounded to local source and in-memory application state; the async loadItems body is deliberately a placeholder rather than an instruction to contact an external service. No current infrastructure, credential, messaging, identity/access, payment, persistent-cloud, destructive-lifecycle, production-traffic, or sensitive-data hard fail is present. Portability is medium because the integration path assumes a src/frontend layout and the 'Always Use subscribeWithSelector' rule is intentionally opinionated rather than universally necessary. Behavioral validation has not been run.