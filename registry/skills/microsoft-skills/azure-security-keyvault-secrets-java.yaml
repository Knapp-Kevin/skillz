rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 712a8838341a4ce44b275e1e906a1b3de2150c59, SKILL.md blob a2a9f62f50111cc5aa13556b20cc29b2aa37be06, and bundled examples blob b514270f0eb04e89a703f5fdb180504d9c658057. The package is useful prior art for Key Vault secret creation, retrieval, listing, versioning, metadata updates, rotation, delete/recover/purge, backup/restore, async access, and configuration loading. Unchanged use is rejected because ordinary examples create and mutate secrets, retrieve and print full secret values, enumerate vault contents and fetch values, permanently purge secrets, back up secret material for external storage, and perform rotation without distinct secret-access, sensitive-output, destructive-action, backup-handling, mutation, or external-service authorization boundaries. SKILL.md also contains literal credential-like example values, while bundled examples repeatedly print secret values and construct unconstrained DefaultAzureCredential despite stronger production requireEnvVars guidance in the top-level skill. Dependency guidance is inconsistent between stable 4.9.0 and bundled 4.11.0-beta.1. Preserve as adaptation/reference material with explicit per-operation authority, secret-value redaction, vault-scope constraints, purge confirmation, backup-storage controls, intended-identity verification, placeholder-only examples, and stable dependency selection.