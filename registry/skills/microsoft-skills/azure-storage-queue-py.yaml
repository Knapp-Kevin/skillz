rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA c64f41958010e30f3a43fb8d80d91d174ee13d24 and SKILL.md blob 2e953c26116a950325eb44150571ceb784631420. The one-file package contains useful Entra-first authentication, visibility-timeout, poison-message, TTL, peek, update, async, and binary encoding patterns. Unchanged use is rejected because it creates/deletes queues, publishes externally consequential messages, receives and prints message contents, deletes/updates messages, clears entire queues, and mutates metadata without explicit queue/message scope, publication/downstream-effect authorization, destructive-settlement authority, sensitive-data disclosure controls, retention/recovery, or budget boundaries. The async example also creates an async credential without the cleanup contract the skill itself requires. Preserve as adaptation/reference evidence with explicit queue scope, data classification, publication authorization, downstream-effect policy, destructive-operation gates, secure output handling, poison-message handling, credential cleanup, and cost controls.