rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 4d9a9dcd4d8143792c0f2a377c156524b901e981 and SKILL.md blob 79897e10e8bd32128b9b6641087b7a0bf14f7507. The skill provides useful .NET guidance across geocoding, reverse geocoding, routing, route matrices, isochrones, rendering, map tiles, IP geolocation, weather, authentication, rate-limit handling, and Azure Maps SAS construction. Unchanged adoption fails the current authority/data-handling rule because normal examples transmit addresses, geographic coordinates, route origins/destinations, IP addresses, and related location context to a metered external service without a distinct affirmative data-transmission/cost authorization boundary or mandatory approved location/privacy handling prerequisite. The SAS example also requests an account SAS token through Azure Resource Manager without a separate credential-issuance authorization boundary, while the rendering example writes a map tile to the local filesystem. Credential examples otherwise use environment variables, placeholders, DefaultAzureCredential, and managed identity guidance rather than soliciting real secrets conversationally. Preserve as adaptation/reference evidence with explicit location/privacy, cost, credential-issuance, and local-write authorization gates before operational use.