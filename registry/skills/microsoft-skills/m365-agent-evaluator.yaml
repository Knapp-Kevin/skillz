rationale: Exact static review bound to package tree 15aceb8b6d27b175ab0d54cf34b5d6b1c345e5d1 and SKILL.md blob f09feb28a91638a7da7da797a0f409de4e690f26. Useful material includes schema-version discipline, progressive reference loading, PRA scenario design, evaluator-name/threshold guidance, explicit secret and output-data handling, setup-versus-quality failure separation, and guarded overwrite/cache/signout behavior. Unchanged adoption is rejected because the mandated npx -y @latest invocation downloads and executes unpinned code, and tenant-dependent evaluations can transmit prompts, responses, retrieved content, identifiers, and other potentially sensitive material to Microsoft 365 and Azure services without a distinct action-specific authorization checkpoint immediately before execution. Providing or approving configuration is not itself authorization for a consequential evaluation run. Preserve the evaluation design and safety mechanics for adaptation behind explicit execution/data-transmission authorization and a governed CLI version. Behavioral validation is not-run.