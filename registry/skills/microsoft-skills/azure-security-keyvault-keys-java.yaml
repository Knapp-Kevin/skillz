rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 1bedbdd6834c29fe29dcb3b6834d5ddec89b068a, SKILL.md blob 632c3607d93b81d7625969555520be8d873ee2d7, and bundled examples blob c1857a699ebaae38750fb0e28d75cea4558561cf. The package is useful prior art for Key Vault/Managed HSM key creation, retrieval, listing, rotation, cryptographic operations, backup/restore, import, and recovery. Unchanged use is rejected because ordinary examples create and mutate cryptographic keys, alter allowed operations and rotation policy, permanently purge keys, import private key material, back up key material to a local file, decrypt and print plaintext, and perform signing/wrapping operations without distinct key-management, destructive-action, sensitive-material, cryptographic-operation, data-output, or external-service authorization boundaries. The top-level skill improves production DefaultAzureCredential handling with requireEnvVars and recommends least privilege, HSM keys, soft delete, and rotation, but bundled examples fall back to unconstrained DefaultAzureCredentialBuilder construction. Preserve as adaptation/reference material with explicit per-operation authority, key-material handling controls, purge confirmation, backup-storage controls, output redaction, intended-identity verification, and environment-specific policy review.