rationale: Exact static review of github-issue-creator at the registered Microsoft Skills pin, bound to package tree SHA bd1b5edf4cefdca8e192610e2e990130f67f704d and SKILL.md blob 4351dcd35e719b49c81fa3430708f103db9cdf82. The skill provides a concise issue-report template, severity mapping, attachment references, and explicit placeholder handling for sensitive values. Unchanged adoption is rejected because it mandates creating markdown files under /issues/ in the target repository without a mandatory action-specific authorization checkpoint immediately before that repository mutation. Its instruction to infer missing context from conversation or memory also risks converting absent or stale facts into asserted issue metadata rather than preserving unknowns as unknown. Preserve the structured issue-writing, evidence-shaping, sensitive-placeholder, and severity-calibration mechanisms for adaptation. Behavioral validation has not been run.