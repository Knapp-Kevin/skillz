rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA bc61d52e96da645ccf3d906086f4f4edd00545de and SKILL.md blob dc9d0d92b4770e4d4c1e3cb44f58878898510396. The package is useful prior art for sentiment analysis, entity recognition, key phrases, language detection, PII recognition, healthcare NLP, batch actions, async usage, Entra-first authentication, and deterministic client lifecycle. Unchanged use is rejected because ordinary examples transmit arbitrary text, explicit PII, and healthcare/medication information to an external Azure AI service without a distinct data-classification, privacy, consent, disclosure, or regulated-data authority boundary; examples print raw recognized entity text and even detected PII values, undermining the redaction benefit; and installation is unpinned, weakening reproducibility. Preserve intact as adaptation/reference material with explicit data-transmission authorization, sensitive-output redaction, healthcare/PII handling constraints, retention/logging boundaries, and pinned dependency identity.