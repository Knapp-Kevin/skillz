rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 62d6ee2d1e7ffe649e6bae74b9235d061b852376 and SKILL.md blob 9c9bd87a4bf852157158e2c658218762cfd2130c. The skill provides useful .NET guidance for persistent-agent CRUD, threads, messages, runs, streaming, function calling, file search, vector stores, Bing grounding, Azure AI Search, OpenAPI, Azure Functions, MCP, SharePoint, and Fabric tools. Unchanged adoption fails the current hard authority rule because the core procedure creates and deletes remote agents, threads, files, and vector stores and invokes potentially consequential tools/external services without a distinct affirmative authorization boundary appropriate to those actions. Function calls are executed and submitted with toolApprovals null, so tool availability is not equivalent to action authorization. Secret examples use placeholders, environment variables, and Azure credential objects rather than soliciting actual secret values conversationally. Preserve as adaptation/reference evidence with explicit resource/cost/data/tool authorization gates before operational use.