rationale: Exact static review of azure-kusto at the registered Microsoft Skills pin, bound to package tree SHA 71a8cb8f91c6078d4b745c0bf0c46d45437c263f and SKILL.md blob 76e6b1764da1d7352dd3d6056571751f4395c746. Preserve the read-oriented KQL workflow, schema-first exploration, early time filtering, result limiting, aggregation guidance, and CLI fallback. Unchanged adoption fails the current sensitive-data/authority rule because the skill explicitly targets SIEM/security analytics, audit logs, user behavior, telemetry, and raw data retrieval without a mandatory scope, disclosure-authority, minimization, or redaction checkpoint before returning potentially sensitive rows. Its best-practice suggestions also mention persistent database functions, materialized views, retention policies, streaming ingestion, and Azure Monitor integration without framing those as separately authorized mutations. Preserve as query/reference and adaptation evidence; behavioral validation has not been run.