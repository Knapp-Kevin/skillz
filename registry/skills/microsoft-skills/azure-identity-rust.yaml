rationale: >-
  The credential taxonomy, managed-identity guidance, and official-crate boundaries are useful prior art. Unchanged adoption fails sensitive-data discipline because it retrieves and prints a Key Vault secret value, demonstrates a client secret directly in conversational code, and does not establish explicit tenant/scope, least-privilege, output-redaction, or secure external credential-custody boundaries.