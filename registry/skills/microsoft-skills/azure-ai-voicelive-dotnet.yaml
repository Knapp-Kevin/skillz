rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 5569dda3e6dba27f9101b32be55992a6f62443c9 and SKILL.md blob 82e101da3649c7f560fff5ac2f96f7e75268e6e1. The skill provides useful .NET guidance for real-time bidirectional voice sessions, authentication, session configuration, WebSocket event handling, audio I/O, model selection, function-call surfacing, and cleanup. Unchanged adoption fails the current authority/data-handling rule because the normal workflow opens a metered external AI session and transmits live user audio/text to Azure without a distinct affirmative cost/data-transmission authorization gate or mandatory approved-data-handling/privacy prerequisite; the function-calling example also directs the host to call an external service without a separate tool/action approval boundary. Credential examples use placeholders, environment variables, DefaultAzureCredential, and managed identity guidance rather than soliciting real secrets conversationally. Preserve as adaptation/reference evidence with explicit recording/privacy, external-service, cost, and function/tool authorization gates before operational use.