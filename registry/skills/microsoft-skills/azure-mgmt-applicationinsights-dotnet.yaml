rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 97d0a70bf390fa9ba763eacc544c441e7a64fd5f and SKILL.md blob 97279bfcc7736acd9e3d3772e118bdf9a52fb0b5. The package contains useful Application Insights ARM guidance for components, API keys, availability tests, workbooks, storage links, retention and sampling. Unchanged adoption fails current authority/secret rules because it provisions and deletes billable observability resources and recurring web tests without an affirmative action/cost gate, retrieves and prints the component connection string and instrumentation key, creates an API key and prints the one-time secret, and embeds a login-test credential placeholder into a remote multi-step test configuration without a mandatory approved credential/data-handling path. Preserve as adaptation/reference evidence with resource/cost, secret-access, synthetic-test and credential-handling gates.