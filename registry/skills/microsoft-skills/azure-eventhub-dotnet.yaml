rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 61210008d0cda928fe40b6463925443054d79f7b and SKILL.md blob 11c2a85610791e40b99dec976b422fe326e4fc9c. The skill provides useful .NET guidance for high-throughput Event Hubs producers, buffered producers, production EventProcessorClient receiving, partition routing, checkpoint strategy, ASP.NET Core integration, retries, batching, and disposal. Unchanged adoption fails the current authority/data-handling rule because normal workflows transmit application event payloads to an external metered service, the buffered producer can send asynchronously after enqueue, the production receiver creates the Blob checkpoint container when absent and writes checkpoint state, and processing can run indefinitely until cancelled, all without distinct affirmative data-transmission/cost/resource-mutation/background-send authorization boundaries or a mandatory approved-data-handling prerequisite. Credential guidance is comparatively strong through DefaultAzureCredential/managed identity and environment-variable based connection strings. Preserve as adaptation/reference evidence with explicit send/background-send, checkpoint-storage mutation, cost, data-governance, and long-running processing authorization gates before operational use.