rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA c4cfb748dfa88feb9bcac3d1ae0f31a9dd0a6982, SKILL.md blob fe0cc9ab1db48af480d95c11e72de9db5c7c4645, references/checkpointing.md blob 8e63433edcf711be7ebebd49228bb0a41c4852ae, and references/event-processing.md blob feb07aff028b9c1b7f75b260d86cb68d4875e44a. The package provides useful TypeScript prior art for Event Hubs producers/consumers, batching, partition targeting, subscription positions, checkpointing, consumer groups, lag monitoring, graceful shutdown, and retry/error handling. Unchanged adoption is rejected because ordinary flows publish event payloads to an external event stream, create and update persistent Blob checkpoint state, and may trigger downstream processing without mandatory destination, payload-classification/disclosure, environment/resource, write, downstream-effect, retention/recovery, or budget/throughput authorization boundaries. The bundled references also present Event Hubs and storage connection strings as normal authentication paths and log arbitrary event bodies/properties/system properties without mandatory secret/PII minimization or output-redaction controls. Preserve as adaptation/reference evidence with explicit destination and payload authority, secure external credential custody, checkpoint-storage authorization, retention/recovery policy, downstream-effect and cost limits, and sensitive-output controls.