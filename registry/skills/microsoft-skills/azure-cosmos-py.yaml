rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA 159aea3f186349abfb5004b51587e3dfe210ab56 and SKILL.md blob 9800d67e64c753e221128e38c43a81bfabdff944. The package includes partitioning and query references plus a setup CLI. Useful material covers Entra-first client guidance, partition/query design, CRUD, throughput, transactions, change feed, and client lifecycle. Unchanged use is rejected because normal workflows create databases/containers, mutate throughput and indexing, create/update/delete durable data, execute transactional mutations including a funds-transfer example, and provision billable resources without distinct account/environment/data-scope, mutation, destructive-action, financial, retention, rollback, or cost authorization boundaries. The bundled CLI also permits COSMOS_KEY account-key authentication despite the main guidance preferring Entra credentials. Dependencies are unpinned. Preserve intact as adaptation/reference material with explicit caller/data authority, destructive and financial-operation gates, resource/cost approval, least-privilege RBAC, retention/recovery policy, secret-safe credential handling, and pinned dependencies.