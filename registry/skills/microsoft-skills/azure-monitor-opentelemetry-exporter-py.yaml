rationale: Exact one-file package review at the registered Microsoft Skills pin, bound to package tree SHA 6f3f29fc5ab34768abdb08ba9c85a038f7deccbe and SKILL.md blob bd9553c42ef1863efcf87aebd92225f305786934. Useful material covers explicit trace, metric, and log exporters, Entra-authenticated ingestion, sampling, provider shutdown, sovereign-cloud configuration, and retry storage. Unchanged use is rejected because telemetry is transmitted externally without an explicit data-classification/disclosure boundary, root Python logging may export broad application content, and offline retry storage can persist telemetry locally without retention or sensitive-data controls. Preserve as adaptation/reference material with telemetry admission/redaction, approved destination, storage retention/encryption, sampling/cost ceilings, and explicit provider lifecycle rules.