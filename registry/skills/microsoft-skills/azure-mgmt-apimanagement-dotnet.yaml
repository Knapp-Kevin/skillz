rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 6a3ef007b414bbd0cc2e23fd2d0c5dbcd318c33d and SKILL.md blob ed3fe2bfa8e016f675066eca950debeafaf056ba. The package provides broad APIM management guidance for service/API/product/subscription/policy/user/group/backend/gateway operations, backup/restore, networking, identities, and versioning. Unchanged adoption fails multiple current hard gates: normal workflows create, update and delete paid management-plane resources without action authorization; subscription secrets are retrieved and printed in plaintext and keys can be regenerated; a sample user password is embedded literally; policies, networking, private-endpoint approval and backup/restore are consequential mutations; and SKILL.md advertises references/policies.md although that required package file is absent at the exact pin. Preserve only as adaptation/reference evidence after repairing the dependency and adding explicit resource/cost/secret/credential/network/policy authorization boundaries.