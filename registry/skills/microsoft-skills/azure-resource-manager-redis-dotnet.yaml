rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 761c421a38337a78693190a8f69bfe267a586406 and SKILL.md blob 339db649fa6bda62a6960a585ce334b1617b82f0. The package provides useful Redis provisioning, scaling, firewall, patch schedule, import/export and lifecycle guidance. Unchanged adoption fails multiple authority/secret gates because it creates/scales/deletes billable caches, retrieves and prints primary/secondary access keys, regenerates and prints a new key, mutates firewall and maintenance state, imports/exports data using blob/SAS locations, force-reboots nodes, and constructs a data-plane connection string embedding the primary key without distinct resource/cost/secret/network/data/reboot authorization. Preserve as adaptation/reference evidence with explicit resource, secret-access/rotation, firewall, import-export/data and reboot gates.