rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 2bfd232583ad2850a49c787169e16782f87bc1d7 and SKILL.md blob 00c292ca53d47563837745e1952110982f949e77. The package provides strong enterprise-messaging guidance across send/receive, settlement, processors, sessions, dead-letter queues, topics/subscriptions, administration and transactions. Unchanged adoption fails current authority/data-handling rules because normal workflows transmit message payloads externally, complete/abandon/defer/dead-letter broker state, start background processors that remain active until stopped, change session state, create/update/delete queues/topics/subscriptions and perform cross-entity transactional effects without distinct affirmative message-state, background-processing, data-transmission, resource-mutation or cost authorization gates. Preserve as adaptation/reference evidence with explicit send/settlement/background/admin-CRUD boundaries before operational use.