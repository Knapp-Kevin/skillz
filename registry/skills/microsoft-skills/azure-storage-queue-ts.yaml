rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to single-file package tree SHA e3b60c7b5588d8ebc701484fd5ca850a82d3b3ee and SKILL.md blob 130dd9277b2d87f7095f959d4d5fa93f41af6310. The package provides useful TypeScript prior art for Azure Queue Storage client hierarchy, queue CRUD and metadata, send/receive/peek/update/delete/clear operations, visibility timeouts, poison-message routing, batch workers, message encoding, SAS generation, error handling, and authentication choices. Its intended triggers are Azure Queue Storage implementation tasks; it is not authorization to publish or disclose queue payloads, execute downstream work, mutate/delete persistent queues or messages, clear queues, move payloads across queues, mint delegated credentials, or operate production resources. Unchanged adoption is rejected because ordinary examples create/delete queues, mutate metadata, publish arbitrary message content, receive and print message content plus pop receipts, delete or clear durable messages, repeatedly process external payloads, move poison-message payloads, and mutate visibility/content without mandatory storage-account/queue, payload/data-owner/classification, downstream-effect, per-mutation/destructive-action, production, retention/recovery, or cost authority. Credential paths include account keys, connection strings, and SAS tokens; queue and account SAS examples grant broad add/update/process and account-level permissions. Preserve as adaptation/reference evidence with Entra-first least privilege, explicit destination/payload/downstream authority, sensitive-output minimization, narrow time-bounded SAS only when authorized, idempotency/recovery controls, and production/cost boundaries.