rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA bd25e7da45cd666463be87ca57cebbbd7bfdd228 and SKILL.md blob 82d0e0ffe52ac030cbe98560e85665bdcab52fcf. The package is a single-file first-class skill and provides useful TypeScript prior art for App Configuration CRUD, optimistic concurrency, provider loading, dynamic refresh, feature flags, labels, snapshots, and Key Vault reference resolution. Unchanged adoption is rejected because it creates, updates, deletes, locks/unlocks, archives/recovers, and otherwise changes production configuration and feature-rollout state without a real action-specific authorization boundary, rollback/recovery contract, or budget/service scope. It presents a credential-bearing App Configuration connection string as a normal environment path without enforcing secure external credential custody; automatically resolves Key Vault secrets into application memory; prints configuration values; and includes user email addresses in feature-targeting examples without privacy/data-minimization boundaries. Feature-flag and configuration changes can materially alter production behavior and user exposure, while snapshot lifecycle operations mutate persistent service state. Preserve as adaptation/reference evidence with least-privilege read/write role separation, secure credential paths, explicit environment/resource and per-change authorization, secret/output redaction, PII minimization, rollback/versioning, staged rollout, and cost/service boundaries.