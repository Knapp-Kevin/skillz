rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 1d31c9ef35cd6fe44cb05bee04bb268df7656824 and SKILL.md blob 1998fba384207417789f37846f85548defd1f7b9. The package is useful prior art for multimodal document/image/audio/video extraction, long-running analysis, prebuilt analyzers, custom schemas, async use, production-constrained Azure credentials, and deterministic client lifecycle. Unchanged use is rejected because ordinary examples send potentially sensitive documents, images, audio, and video to an external AI service without a distinct data-classification/privacy/transmission authority boundary; URL inputs delegate retrieval of remote resources without an explicit network/trust boundary; examples print extracted document text, transcripts, frame descriptions, and invoice fields without output-redaction or disclosure constraints; and analyzer examples create/delete persistent service-side configuration without a separate mutation/approval boundary. Several ordinary snippets also instantiate unconstrained DefaultAzureCredential despite stronger production guidance at the top of the skill. Preserve as adaptation/reference material with explicit per-input data authority, remote-fetch restrictions, output minimization/redaction, analyzer mutation approval, cost/service-use authority, and intended-identity verification.