rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 87ed30f519f37b28d0e05f2391d2729c47b94be6 and SKILL.md blob 9ebbe26711148505aa6b53738036f058fb523f2c. The package provides useful current-generation Document Intelligence migration and SDK guidance, but unchanged adoption fails current privacy/authority rules because local files and documents including IDs, invoices, receipts, tax forms and health-insurance cards can be transmitted to an external AI service, while custom models and classifiers are built and models deleted without mandatory data-governance, model-mutation and cost authorization gates. Bundled examples print extracted identity/document fields, increasing data-handling sensitivity. The package also pins 1.0.0 while its text says latest GA is 1.0.7 and instructs a current-doc lookup, so exact implementation remains freshness-sensitive. Preserve as adaptation/reference evidence with explicit sensitive-document, model/classifier lifecycle and metered-service boundaries.