rationale: Exact static review bound to package tree 22777f05d7f11b559c120d6cae7f09848828b9d2 and SKILL.md blob b4ccf2ca851d10c1b7395e49f39534af26ad5bce. Strong evidence discipline requires tracing actual code paths, reading implementations, separating fact from inference, explicit confidence and open questions, and evidence for architectural/data-flow/dependency claims. The procedure is read-only and does not direct persistent mutation or consequential external side effects, so the authority hard fail does not apply. Main weaknesses are Git-centric repository resolution, an unnecessary mandatory user question when repository identity may already be resolvable, a rigid five-iteration ceremony, and mandatory diagram/table output per iteration regardless of marginal value. Behavioral validation is not-run.