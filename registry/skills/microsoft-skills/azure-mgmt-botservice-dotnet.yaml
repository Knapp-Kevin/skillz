rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 35acc4dd431bfb75320c3f00b9bb47b0f86c43c8 and SKILL.md blob 8549e745271e52eb7e03a2d71a124899f06d2999. The package provides useful bot resource/channel management guidance across Direct Line, Teams, Web Chat and other channel types. Unchanged adoption fails the current authority rule because it creates/updates/deletes cloud bot resources and externally reachable channels and regenerates Direct Line keys without a distinct affirmative resource/channel/credential authorization boundary. Credential hygiene guidance is otherwise reasonable and recommends Key Vault/managed identity. Preserve as adaptation/reference evidence with explicit resource, channel publication, cost and credential-rotation gates.