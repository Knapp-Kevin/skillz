rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to single-file package tree SHA b9f0ba8f0fcf741f5eb843505fc1d004f0e07e6e and SKILL.md blob ba358bca21670775d73dce057668e8784624662b. The package provides useful TypeScript prior art for Azure Files client hierarchy, share/directory/file CRUD, quota management, local-file/buffer/stream uploads, downloads, copy operations, metadata/headers, range mutation, snapshots, SAS generation, error handling, and authentication choices. Its intended triggers are Azure File Share implementation tasks; it is not authorization to upload or disclose local data, mint delegated credentials, mutate/delete persistent storage, change quotas, clear file ranges, delete snapshots, or operate production resources. Unchanged adoption is rejected because ordinary examples create/delete shares, directories, files, and snapshots; change quotas and metadata; upload local files and streams; copy remote content; clear ranges; and materialize downloaded data to memory, console output, or local files without mandatory storage-account/share, data-owner/classification, per-mutation, destructive-action, production, retention/recovery, or cost authority. Credential paths include account keys, connection strings, and SAS tokens; the share-SAS example grants read/create/write/delete/list permissions for 24 hours. Preserve as adaptation/reference evidence with Entra-first least privilege, explicit destination/data-owner authority, narrow time-bounded SAS only when authorized, sensitive-data minimization, destructive-action/recovery controls, and production/cost boundaries.