rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 1fb82a6bf0c567a8263c6dcf63d72010aab761c2, SKILL.md blob 2be5ec33b16457816e0737dcc99007560fea74d5, and bundled examples blob 0c6065ccc15d8b72d9ee077ce2d297768ab08468. Microsoft explicitly marks azure-monitor-opentelemetry-exporter deprecated and directs migration to azure-monitor-opentelemetry-autoconfigure, so retirement is the truthful decisive state rather than unchanged-reuse eligibility. The material remains useful migration and instrumentation prior art for traces, metrics, span processors, exception recording, and semantic conventions. Unchanged use is additionally unsuitable because ordinary examples export telemetry to an external service without a distinct telemetry-data/privacy/classification boundary, demonstrate potentially identifying business attributes such as order.id and customer.tier, and recommend an unpinned LATEST autoconfigure dependency while bundled examples use 1.0.0. Preserve as bounded migration/reference evidence with explicit telemetry redaction/classification, destination authority, secret handling, and pinned dependency controls.