rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 0eb8cd54476d9d72fffb81b24285c708b10af293 and SKILL.md blob 05ba9fa8774836eb038e7cafe5cb0118c08f3a9a. Useful PostgreSQL Flexible Server management guidance is rejected unchanged because the core create path embeds a literal administrator password, creates billable compute/storage/HA resources, and later workflows create databases, open firewall access including the Azure-wide 0.0.0.0 rule, change configurations and Entra administrators, restore and replicate servers, stop/start/restart with failover, scale and delete resources, and repeat literal credentials in connection examples without distinct resource/cost/network/identity/credential authorization. Preserve only as adaptation/reference evidence after replacing literal credentials and adding explicit mutation, firewall, restore/replica/failover, scale and deletion gates.