rationale: Exact one-file package review at the registered Microsoft Skills pin, bound to package tree SHA 6f77179d773886b1c5b47f79e40b6701680cf27c and SKILL.md blob b6146061c7cb223503d1de4b4c12864c643e4c1b. Useful material covers Entra-first authentication, DCE/DCR configuration, custom-log upload, batching, partial-failure callbacks, async usage, and sovereign-cloud handling. Unchanged use is rejected because examples send arbitrary log payloads, including JSON-file contents and retry buffers, to an external telemetry destination without explicit data-classification, destination/audience, retention, privacy, or budget authorization; the documented ignore-errors callback also permits silent loss. Preserve as adaptation/reference material with explicit telemetry-data admission, destination and tenant confirmation, sensitive-field redaction, retention/cost boundaries, and fail-visible error handling.