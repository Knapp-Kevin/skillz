rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 71c7dccc2dd8d41e0c263d792206834eb37f2149 and SKILL.md blob 11d6f6fc3785593fff88b3e9ef3ea492575e7ef9. The package is useful prior art for real-time translation, transliteration, language detection, dictionary lookup/examples, batching, HTML translation, profanity handling, Entra-first authentication, async operation, and deterministic client cleanup. Unchanged use is rejected because ordinary workflows disclose user/application text to an external AI service and can incur service cost without distinct text-sensitivity/classification, external-processing/disclosure, or budget authorization boundaries. The legacy key path remains available, although credentials are sourced from environment variables rather than embedded. Installation is unpinned. Preserve intact as adaptation/reference material with explicit data-handling authority, approved external-processing scope, cost controls, secure credential custody, and pinned dependency identity.