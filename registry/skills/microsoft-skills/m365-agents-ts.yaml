rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to single-file package tree SHA 0bcb6ef9c55c8f8bae331e85d40f8585844c4bc7 and SKILL.md blob 00169cce10c70508375fc9300513a7600c7f75f8. The package provides useful TypeScript prior art for Microsoft 365 Agents SDK routing, Express hosting, streaming responses, invoke handling, Copilot Studio Direct-to-Engine/WebChat integration, package/API freshness checks, sensitivity labeling, and basic secret hygiene. Its intended triggers are M365/Teams/Copilot Studio agent implementation tasks; it is not authorization to message users, invoke production agent endpoints, transmit prompts/content to Azure OpenAI or Copilot Studio, or use tenant/client credentials and bearer tokens. Unchanged adoption is rejected because ordinary examples send external activities, stream generated content to users, acknowledge invoke events, start remote Copilot Studio conversations, submit questions, render connected WebChat sessions, and consume high-value client secrets/bearer tokens without mandatory tenant/environment, recipient/audience, message/data-owner/classification, identity/access, model-data-transfer, production, per-action communication, or credential-custody authorization. Preserve as adaptation/reference evidence with secure non-conversational credential handling, explicit tenant/audience/action authority, disclosure/data-transfer boundaries, output minimization, and production communication safeguards.