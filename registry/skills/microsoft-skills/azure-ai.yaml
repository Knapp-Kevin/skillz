rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA 8a168336305c56e0eea0d89aced7d8a0001de3b5 and SKILL.md blob 6cce5b319f57f98f81772e4c8627c573d89e8571 plus auth guidance and 15 SDK quick references. The package is useful as a service router and condensed Azure AI reference, but unchanged adoption fails the current authority and sensitive-data hard gates. Bundled references instruct persistent Azure AI Search index/document writes and create-or-update operations, audio/file transcription and speech synthesis, OCR/document analysis, translation, vision/content-safety processing, and other transfers of user or application content to Azure services without mandatory data-owner/classification, disclosure/model-transfer, target-resource, production, mutation, retention, or cost authorization. The transcription reference also uses a service subscription key directly from an environment variable. The auth reference strongly prefers managed identity and least-privilege RBAC, which is useful mitigation, but those recommendations are not action-specific authorization boundaries. Preserve service selection, authentication, hybrid/vector-search, transcription, OCR, translation, and SDK mechanics for adaptation/reference use with explicit data-transfer, target-resource, mutation, production, retention, cost, and credential-custody gates. Behavioral validation has not been run.