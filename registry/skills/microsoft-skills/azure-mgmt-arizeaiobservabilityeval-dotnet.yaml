rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 87d564bcece7e8f237f84d118cf2f540c0aa922f and SKILL.md blob 7a820d75e857d1140484b0fe93301bf232f19109. The package gives coherent ARM CRUD guidance for Arize AI organizations but its primary workflow provisions a Marketplace-linked external partner organization using billing offer/term details and named user contact data, then supports updates and deletion, without distinct affirmative marketplace/cost/resource/data authorization. It is tightly coupled to Azure Marketplace and the Arize partner resource model. Preserve as adaptation/reference evidence with explicit commercial-subscription, PII/contact-data, resource mutation and deletion gates.