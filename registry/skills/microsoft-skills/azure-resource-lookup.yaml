rationale: Exact static review of azure-resource-lookup at the registered Microsoft Skills pin, bound to package tree SHA 19e257c3720521014d81cd3dbf4e188e0ece621b and SKILL.md blob d16d74bd6369fd15f8d96ff0b637ac361c7d6e13. The package is intentionally read-oriented for Azure inventory, cross-subscription lookup, tag/configuration audits, orphan discovery, and health-state inspection; ARG itself is explicitly constrained to read-only use and mutations are routed elsewhere. Preserve its dedicated-tool-first routing, explicit subscription/result scoping, query-shaping patterns, and orphan/tag inventory mechanisms. Unchanged adoption is rejected because the Quick Reference and error-recovery path instruct `az extension add --name resource-graph`, which mutates the host environment by installing a CLI extension without a mandatory action-specific authorization checkpoint immediately before that change. Behavioral validation has not been run.