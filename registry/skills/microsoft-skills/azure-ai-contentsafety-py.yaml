rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 5cb38eecdb5ba01a6ac68b7c38803f622195f008 and SKILL.md blob f48d8a11589e972787c9907e5698119fe61cdfd8. The package is useful prior art for text/image harm classification, severity handling, blocklists, production-constrained Azure credential use, and deterministic client lifecycle. Unchanged use is rejected because ordinary examples send arbitrary text and image content to an external service without a distinct data-classification/privacy/transmission authority boundary; image-by-URL analysis delegates retrieval of a remote resource without an explicit network/trust boundary; blocklist examples create or mutate persistent moderation state without a separate mutation/approval boundary; and the best-practice recommendation to log analysis results lacks redaction/retention guidance even though moderation outputs can be sensitive. Preserve as adaptation/reference material with explicit per-call data-classification and disclosure authority, external-fetch restrictions, blocklist mutation approval, audit-log minimization/redaction and retention policy, cost/service-use authority, and intended-identity verification.