rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA 869a8ab74ba9a470461a6c9948a8d018d1efe36b and SKILL.md blob a27cd0325fe6fba6009923912c5174ee364bd2c5. Useful Java guidance covers configuration CRUD, feature flags, secret references, read-only protection, snapshots, ETag concurrency and Entra authentication. Rejected unchanged because normal examples create, overwrite and delete production configuration, alter feature rollouts and targeting, change secret references, clear/set read-only state, and create/archive/recover snapshots without a distinct affirmative configuration/release authorization boundary. Examples also print configuration values and secret-reference URIs, and targeted rollout examples contain user email identifiers. Conditional ETags reduce concurrency risk but do not authorize mutation. Preserve as adaptation/reference evidence with explicit configuration, rollout, privacy and secret-reference gates.