rationale: >-
  Useful FastAPI CRUD-router, dependency-injection, response-model, and authentication patterns remain valuable prior art, but unchanged adoption fails the authority hard gate. The bundled router template mutates durable application state: update authenticates the caller but leaves ownership/resource authorization as a commented optional check, while delete performs no equivalent ownership/resource authorization before destructive deletion. Authentication is not authorization. Adapt only after adding explicit resource-scope, ownership/role, destructive-action, and error/disclosure boundaries appropriate to the host application.