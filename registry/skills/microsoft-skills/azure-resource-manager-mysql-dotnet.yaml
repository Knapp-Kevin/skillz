rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA e0816f9a38d4d5d2fc8012d59fb1a08f7ab0921d and SKILL.md blob 0be21fefd35b57a803ca6ac43ba2a82c062e2454. Useful MySQL Flexible Server management guidance is rejected unchanged because the core create path embeds a literal administrator password, creates billable compute/storage/HA resources, and later workflows create databases, open firewall access including the Azure-wide 0.0.0.0 rule, change server configuration and Entra administrators, restore/stop/start/restart/fail over/scale/delete servers, and repeat the literal password in a connection string without distinct resource/cost/network/identity/credential authorization. Preserve as adaptation/reference evidence only after replacing literal credentials and adding explicit mutation, firewall, failover, restore, scale and deletion gates.