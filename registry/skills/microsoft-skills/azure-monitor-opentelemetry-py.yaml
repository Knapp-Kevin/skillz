rationale: Exact one-file package review at the registered Microsoft Skills pin, bound to package tree SHA 14a5c5e6184d8b29cca1dfe53d448b484a79f0a1 and SKILL.md blob 00f1d7534e6d2b49e3bf0e5b4ec4977fac99df69. Useful material covers one-line Azure Monitor setup, Entra-authenticated ingestion, framework auto-instrumentation, custom traces/metrics/logs, sampling, role naming, live metrics, and selective instrumentation. Unchanged use is rejected because broad auto-instrumentation and logging can capture and transmit request, database, exception, and application data externally without explicit telemetry admission, redaction, approved-destination, privacy, retention, or cost authority. Preserve as adaptation/reference material with default-deny instrumentation selection, sensitive-field redaction, tenant/destination confirmation, sampling/cost limits, and explicit telemetry policy.