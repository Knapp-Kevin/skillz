rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA a4c692537c1bf669d70f8fe56a5f43f6d65fc76f and SKILL.md blob 6345044117d177e1aa06a392c54d70e0850cd5e9. The package provides useful Java guidance for persistent-agent CRUD, threads, messages, runs, streaming, function calling, code interpreter, file upload/search, vector stores, authentication, error handling, and async usage. Unchanged adoption fails the current hard authority rule because normal procedures create, update, and delete remote agents and threads, create runs/messages, upload local files and create vector stores, and execute function/tool calls without distinct affirmative authorization boundaries for resource mutation, data transmission, cost, local-file access, or external side effects. Secret examples use environment variables, placeholders, DefaultAzureCredential, and managed-identity guidance rather than soliciting actual secret values conversationally. Preserve as adaptation/reference evidence with explicit resource, cost, data, local-file, and tool-action authorization gates before operational use.