rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA a4c692537c1bf669d70f8fe56a5f43f6d65fc76f and SKILL.md blob 6345044117d177e1aa06a392c54d70e0850cd5e9. The package provides useful Java persistent-agent SDK guidance, but unchanged adoption fails current authority/data-handling rules because normal and bundled examples create/update/delete agents, threads, files and vector stores, upload local files, invoke metered model runs, execute function tools and submit outputs without distinct affirmative resource, file/data, cost and external-tool authorization gates. Credential guidance uses environment variables and Azure credential objects rather than soliciting secrets. Preserve as adaptation/reference evidence with explicit remote-resource, local-file transmission, metered-run and tool-execution boundaries.