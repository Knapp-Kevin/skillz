rationale: Exact one-file package review at the registered Microsoft Skills pin, bound to package tree SHA 73bdb987bf73d524b40ac93c3ea0c3533dd75ba3 and SKILL.md blob e1a8305ccac4d5e8d44e852038907cd516f1f74d. The skill is useful prior art for repository/tag/manifest inspection, Entra-first authentication, context-managed clients, artifact download, immutable production-image guidance, and cleanup patterns. Unchanged use is rejected because normal workflows can change repository/manifest write-delete policy, delete repositories, manifests and tags, and automate deletion of old untagged images without distinct registry/environment scope, mutation, destructive-action, rollback, or approval boundaries. Download examples also write artifact layers to local storage. Production safeguards such as can_delete=False recommendations do not substitute for authorization, and dependency installation is unpinned. Preserve intact as adaptation/reference material with explicit registry scope, change approval, destructive confirmation, retention policy, rollback/recovery expectations, least-privilege identity, and pinned dependency identity.