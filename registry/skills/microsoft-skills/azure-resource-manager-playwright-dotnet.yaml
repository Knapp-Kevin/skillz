rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 982606adb8bcbcff01af1a0338ac6c5e44aa0edd and SKILL.md blob f213a2efdca47803023f4ae490c76ef3f671599c. The package usefully distinguishes workspace management from browser-test execution and covers create/list/update/quota/delete workflows. Unchanged adoption fails the current authority/cost rule because it creates and deletes a cloud testing workspace, enables local authentication by default in the example, mutates workspace metadata, and configures downstream external test execution without a distinct affirmative resource/cost/authentication/external-service authorization boundary. Preserve as adaptation/reference evidence with explicit workspace, cost, local-auth and test-service gates.