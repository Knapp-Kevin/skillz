rationale: Exact static review bound to package tree 80775b0be2ffbef4a1675afeaaa132696bdd1d01 and SKILL.md blob 2568639d0204aff644b86563342487fec78eb332. Strong evidence discipline requires resolving repository context before answering, searching and reading actual source files, inline file/line citations, explicit insufficiency handling, and a prohibition on guessing or external knowledge. The procedure is read-only and does not direct persistent mutation or consequential external side effects, so the authority hard fail does not apply. Main weaknesses are Git-centric context resolution, an unnecessary user question even when repository identity may already be resolvable, and prescriptive Mermaid/table formatting that can add ceremony. Behavioral validation is not-run.