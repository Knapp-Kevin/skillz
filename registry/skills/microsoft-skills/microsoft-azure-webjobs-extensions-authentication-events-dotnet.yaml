rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 15a35dcb0638dad179c9bbc5fe10a7587a27dee7 and SKILL.md blob a90ab71b73b33f9953ba9f95a556b451849ff4ba. The package provides valuable Microsoft Entra custom-authentication-extension guidance, but unchanged adoption fails several hard authority and privacy boundaries. Normal examples alter claims during token issuance, can block user sign-up, modify submitted identity attributes before persistence, transmit user IDs to an external profile API, and send a one-time authentication secret together with a phone number to an external messaging provider. Examples also log user identifiers and phone numbers. None of those identity, token, PII, OTP, external-message, or authentication-state effects is protected by a distinct affirmative authorization and approved-data-handling boundary. Preserve as adaptation/reference evidence only with explicit identity/token mutation, PII/privacy, OTP-secret handling, external lookup/message, and logging gates before operational use.