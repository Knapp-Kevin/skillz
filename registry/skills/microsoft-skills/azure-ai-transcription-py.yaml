rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 31060aa7cce2f85a2ba92f048e199530f5e82b0d and SKILL.md blob a6fd15e733a567c832962e5c4dc71998cc2ebcde. The package is useful prior art for batch and real-time speech-to-text, diarization, timestamps, language selection, streaming backpressure, and deterministic client/session cleanup. Unchanged use is rejected because normal examples transmit meeting or other audio to an external AI service without a distinct consent, recording-law, data-classification, disclosure, retention, or regulated-data boundary; batch transcription creates a remote job from externally retrievable content URLs and can incur service cost without separate operation/budget authority; streaming reads a local audio file and sends it externally; authentication requires a long-lived subscription key rather than identity-based credentials; and installation is unpinned. Preserve intact as adaptation/reference material with explicit recording/participant consent, sensitive-audio classification and disclosure authority, remote-URL trust controls, job lifecycle/cost approval, key-handling safeguards, transcript-output controls, and pinned dependency identity.