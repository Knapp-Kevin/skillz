rationale: Exact static review of the azure-kubernetes top-level skill at the registered Microsoft Skills pin, bound to package tree SHA bab7f5eab9e8e1c311ef1fc29b419963903fbe09 and SKILL.md blob 3c5a448a679dafed5e0e747d28bd95cead4e8dec. Preserve its strong Day-0 versus Day-1 distinction, conservative AKS Automatic default, networking/security/reliability guidance, secret non-disclosure rule, subscription-context discovery without asking users to paste identifiers, staged-upgrade advice, and scenario-specific deep-dive references. Unchanged adoption fails the current authority hard rule because the skill is explicitly used to create and configure AKS and its bundled CLI reference directly provides commands that create persistent billable clusters, enable workload identity and autoscaling, obtain cluster credentials, and enable monitoring without a mandatory action-specific authorization checkpoint immediately before those mutations. The top-level guardrails address ambiguity, secrets, and downtime but do not establish target/resource/cost/security-control authorization. Preserve as adaptation/reference evidence; behavioral validation has not been run. The nested front-mattered azure-kubernetes-automatic-readiness skill remains a separate denominator unit and requires its own exact-version disposition.