rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA 0fbf762f81763b55040414428dcb0a3a0d29bd5f and SKILL.md blob 289676f5c80a9f4064980ff98283575502fe1d99, including checkpointing/partition references and setup_consumer.py. Useful material covers Entra-first authentication, batching, partition routing, consumer groups, checkpointing, async streaming, and bounded receive options. Unchanged use is rejected because core flows send event payloads to an external metered service, receive and print event bodies/properties, write checkpoint state to Blob Storage, and provide a CLI that sends test messages without distinct publication/data-disclosure, storage-mutation, downstream-impact, retention, or budget authorization. The CLI also creates async credentials without an explicit async credential context manager despite the package rule. Preserve as adaptation/reference material with explicit data/publication/cost authority, approved logging/redaction, checkpoint lifecycle, deterministic credential cleanup, and pinned dependencies.