rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 4d3f7bfa53fcab38401f88969c8b3643f709cb2b and SKILL.md blob 05bdac1c374bbdd03a2ae6c4c173d5d9b18b4160. The package clearly scopes itself to the Azure-side MongoDB Atlas organization resource and provides coherent create/list/update/delete guidance. Unchanged adoption fails the authority/data rule because creation establishes a Marketplace-linked partner organization and billing relationship using subscription/offer/term identifiers plus administrator email/UPN/name data, and later workflows mutate admin data/tags or delete the organization without affirmative marketplace, cost, PII, mutation or deletion authorization. Preserve as adaptation/reference evidence with explicit commercial-subscription, contact-data and lifecycle gates.