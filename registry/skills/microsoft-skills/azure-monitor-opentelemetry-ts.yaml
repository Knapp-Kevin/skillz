rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 745333bd43aa40a5a5639af738ade6ae35426c08 and SKILL.md blob 538f028b72746103fa2314ba625acad23c934fce. The single-file package provides useful TypeScript prior art for Azure Monitor OpenTelemetry initialization, migration from deprecated packages, custom spans and metrics, logging integration, automatic instrumentation, sampling, processors, context propagation, cloud-role metadata, correlation, and graceful shutdown. Unchanged adoption is rejected because normal flows transmit telemetry and logs to Azure Monitor, automatic instrumentation can capture HTTP, Azure SDK, database, Redis, exception, and request metadata, and examples propagate user.id and tenant.id across service boundaries without mandatory destination/region, data-classification, subject/data-transfer, minimization, retention/redaction, or disclosure authorization. The textual instruction to exclude PII and secrets is good guidance but is not an enforced data-governance or authorization boundary. Preserve as adaptation/reference evidence with explicit telemetry destination and data-owner authority, minimization/redaction controls, bounded attributes and baggage, retention controls, and production observability authorization.