rationale: Exact static review of entra-agent-id at the registered Microsoft Skills pin, bound to package tree SHA 405ed207c079150581ef0540a0b4a0a1f176fc9e and SKILL.md blob 5aaf917945171757112bdb341fb593b4517542cd. Preserve its per-agent identity model, typed Graph endpoints, BlueprintPrincipal prerequisite, production preference for workload identity federation, per-agent permission scoping, cross-tenant token-exchange guidance, localhost-only sidecar boundary, and explicit separation from ordinary app registration/RBAC. Unchanged adoption is rejected because the workflow directly installs host dependencies, creates Blueprints/BlueprintPrincipals/Agent Identities, grants application and tenant-wide delegated permissions, and invokes admin consent without mandatory action-specific authorization immediately before those identity/access mutations. Behavioral validation has not been run.