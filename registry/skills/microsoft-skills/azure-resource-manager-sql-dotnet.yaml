rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 02e74e01786d668b7d51f8a9592bdb5dc05e401e and SKILL.md blob 6eff090401b0b48fb47ecddbdf36554da8fb8ddf. The package is extensive Azure SQL management prior art, but unchanged adoption fails several hard gates: server creation and password-update examples embed literal administrator passwords; management flows create/scale/copy/restore/rename/delete billable servers, databases and elastic pools; firewall rules and VNet/private-endpoint approval mutate network access; export/import and auditing carry storage-account keys and SQL credentials; TDE can be disabled; failover/recovery and pool cleanup are destructive; and none of these consequential operations has a distinct affirmative authorization boundary. Preserve as adaptation/reference evidence only after replacing literal credentials and adding explicit resource/cost, network/private-endpoint, credential/key, backup/restore/import-export, encryption/security and destructive-action gates.