rationale: Exact one-file package review at the registered Microsoft Skills pin, bound to package tree SHA e5a4071f391ba8b2236bc20a3a1e8dd8998d96b1 and SKILL.md blob 37e6a034b861e30c675b7b2029e391612f69a535. Useful material covers DefaultAzureCredential, managed/workload identity, service principals, user auth, token acquisition, sovereign clouds, caching, async lifecycle, and credential selection. Unchanged use is rejected because the package handles highly sensitive authentication material and can issue bearer tokens, permits wildcard additional-tenant access, demonstrates client-secret/on-behalf-of flows, and recommends verbose identity logging without an explicit secret/token redaction or scope-authorization boundary. Preserve as adaptation/reference material with least-privilege tenant/scope policy, secure secret custody, no wildcard tenant allowance by default, token-output/log redaction, explicit identity-use authority, and pinned dependencies.