rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 64b1396db764d8690a4526128c4d37c64d649629 and SKILL.md blob 07379f43a72014ebb5472b2a612b7b9a75dfe42c. The package is useful prior art for batch document translation, format preservation, multi-language targets, glossary use, status/error inspection, cancellation, async operation, Entra-first authentication, and deterministic client cleanup. Unchanged use is rejected because normal workflows disclose document contents and storage URLs to an external AI service, create persistent remote translation jobs, write translated artifacts to Azure Blob Storage, may expose SAS-bearing URLs through environment/configuration surfaces, can cancel remote operations, and incur service/storage cost without distinct data-classification, disclosure, storage-write, job-lifecycle, cancellation, or budget authorization boundaries. Single-document translation also reads local files and writes translated files locally. Installation is unpinned. Preserve intact as adaptation/reference material with explicit document sensitivity/classification checks, approved external-processing authority, storage target/write authority, SAS-secret handling, job/cost approval, cancellation authority, output retention controls, and pinned dependency identity.