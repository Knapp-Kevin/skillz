rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA e5a6c3d8a10610fa17d95d68cf103e92d575293f and SKILL.md blob fa832211c5a8a90e6ca63b241314dd0437c96946. The package is a single SKILL.md and provides useful TypeScript prior art for text translation, transliteration, language detection, single-document translation, batch document translation, pagination/status handling, and Azure identity integration. Unchanged adoption is rejected because ordinary examples transmit arbitrary text and document content to Azure without mandatory data-classification, subject/data-transfer, destination/region, minimization, retention, or output-disclosure authority; batch document translation generates credential-bearing source and target container SAS URLs and starts a billable service-side translation operation that writes translated content to persistent storage without sufficient credential-custody, storage-scope, write, downstream-effect, rollback/overwrite, or budget authorization. API-key authentication is also presented without a repository-enforced secure external credential path. Preserve as adaptation/reference evidence with explicit data-transfer/privacy authority, secure external credential handling, least-privilege short-lived SAS custody, approved source/target storage scope, output disclosure controls, and action-specific cost/write authorization.