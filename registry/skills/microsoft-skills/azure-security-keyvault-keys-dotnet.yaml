rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 6a9a7395f14b97c73fd882e6e1ae1d4e8ffff10b and SKILL.md blob c9ca1f8736980cf682b5ac1306d327442d3260d0. The package is valuable Key Vault key-management and cryptography prior art, but unchanged adoption fails hard authority boundaries: normal examples create and rotate keys, update policies, delete and immediately purge keys, recover/restore keys, perform decrypt/sign/unwrap operations, and write or read key-backup bytes on the local filesystem without distinct affirmative authorization gates for key lifecycle, destructive purge, cryptographic use or local secret-material handling. Credential guidance favors managed identity and placeholders, and soft-delete is recommended, but those safeguards do not authorize the demonstrated consequential operations. Preserve as adaptation/reference evidence with explicit key-lifecycle, cryptographic-operation, purge/destructive and backup-file authorization gates.