rationale: Exact static review bound to package tree ffadefd1fab729385cc3d59ac46202305ff4688f and SKILL.md blob bb203da412a56c38cd457612bc0f46b91f046216. Strong evidence-first documentation discipline requires tracing actual code paths, citing claims, distinguishing fact from inference, preserving unknowns when evidence is missing, and validating paths, symbols, Mermaid, and cross-links. The procedure generates documentation content but does not itself direct persistent repository mutation or external side effects, so the authority hard fail does not apply. Main weaknesses are Git-centric source-context assumptions, prescriptive diagram/table quotas that may overfit small scopes, and medium portability outside VitePress-style repositories. Behavioral validation is not-run.