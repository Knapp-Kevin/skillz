rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 267b94e36949f787a72d3c9f2e0b1f1e88ba2615 and SKILL.md blob c67b575cbc92644e4ef78a7cad695a2944f545bc. The package provides useful .NET guidance for Azure API Center inventory/governance across services, workspaces, APIs, versions, definitions, environments, deployments, metadata schemas, discovery, and specification import/export. Unchanged adoption fails the current authority/data-handling rule because the core workflow directly creates or updates paid Azure management-plane resources throughout the hierarchy, activates deployment records, assigns managed identity, and reads then uploads local API specifications without distinct affirmative resource/cost/data-transmission authorization gates or a mandatory approved-data-handling prerequisite. Error handling is present and credential guidance uses DefaultAzureCredential/managed identity, but those strengths do not authorize the mutations. Preserve as adaptation/reference evidence with explicit management-plane mutation, cost, identity, and API-spec data-governance gates before operational use.