rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 267b94e36949f787a72d3c9f2e0b1f1e88ba2615 and SKILL.md blob c67b575cbc92644e4ef78a7cad695a2944f545bc. The skill provides useful Azure API Center management guidance for .NET across service/workspace/API/version/definition/environment/deployment/metadata-schema hierarchy, specification import/export, discovery, authentication, lifecycle metadata, and error handling. Unchanged adoption fails the current authority/data-handling rule because the core workflow creates or updates Azure API Center services, workspaces, APIs, versions, definitions, environments, deployments, and metadata schemas and imports API specifications without a distinct affirmative cloud-resource/cost/data-transmission authorization boundary or mandatory approved-data-handling prerequisite. The import example reads a local OpenAPI file and transmits its contents to Azure. Credential guidance is comparatively strong through DefaultAzureCredential, managed identity, environment variables, and placeholders rather than conversationally solicited secrets. Preserve as adaptation/reference evidence with explicit infrastructure mutation, cost, local-read, and specification/data-transmission authorization gates before operational use.