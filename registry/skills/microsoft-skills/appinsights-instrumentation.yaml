rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA 8f6b0c9b5af9ab5bbd69d25d58071c9034221eb0 and SKILL.md blob ca55c310862cb95b5ebcc1f10a070f312718d1cb plus the complete bundled example, script, and reference tree. The top-level trigger boundary correctly routes explicit project changes toward azure-prepare, but the package itself then provides direct instructions to create Application Insights and Log Analytics resources, mutate App Service/Container App/Function App settings, modify application code and IaC, and configure telemetry export. Those consequential operations lack a mandatory action-specific authorization boundary for target subscription/resource group/app, production configuration changes, cost-bearing resource creation, telemetry destination/data classification, or deployment. The Container Apps reference also retrieves a Log Analytics primary shared key into a shell variable and instructs secret/configuration mutation without a credential-custody authorization gate. Preserve the instrumentation selection, OpenTelemetry setup, resource topology, secret-reference, tracing, and query mechanics as adaptation/reference evidence, but require explicit target/resource, production-change, cost, telemetry-data/disclosure, and credential-custody authority before reuse. Behavioral validation has not been run.