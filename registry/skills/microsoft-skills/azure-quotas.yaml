rationale: Exact static review of azure-quotas at the registered Microsoft Skills pin, bound to package tree SHA 8a628e265ecb05a8f78a9a7e4e4772fb82d78c40 and SKILL.md blob cbd67b6c336362ee343390e713b91b5662841038. Preserve its quota-name discovery discipline, CLI-first read workflows, capacity calculation, regional comparison, unsupported-provider fallbacks, and warning that No Limit does not imply unlimited capacity. Unchanged adoption fails current authority governance because the package directly instructs quota increase/create requests and provider registration without a mandatory action-specific authorization checkpoint immediately before those subscription-scoped external mutations. It also mandates installing the Azure CLI quota extension as a prerequisite without explicit approval for that local toolchain mutation. Adaptation should keep read-only quota inspection separate from mutating quota/provider/tool-install operations and require scoped authorization before each consequential action. Behavioral validation has not been run.