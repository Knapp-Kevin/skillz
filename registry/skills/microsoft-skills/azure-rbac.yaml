rationale: Exact static review of azure-rbac at the registered Microsoft Skills pin, bound to package tree SHA b52d696609b18a5dc2bae21e368812fe7b020ec5 and SKILL.md blob 02ac75d2ba22b4d7aa1e74469b01575281f05ddc. The skill is concise and least-privilege oriented: it asks the host to resolve the minimal built-in role first, generate a custom definition only when necessary, then generate CLI and Bicep artifacts rather than execute assignments itself. It also correctly identifies Microsoft.Authorization/roleAssignments/write as the capability needed to grant roles and recommends User Access Administrator over Owner for role-assignment-only needs. Because the reviewed package is generate-only and contains no command-execution or external mutation step, the action-specific mutation authorization hard fail does not apply to unchanged use. Operational use of the generated commands remains subject to the host agent's separate authorization boundary. Behavioral validation has not been run.