rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 276440fcfee1858c728b0db63898d52e578ce86b, SKILL.md blob c2bde1986d3ace215f6a28e923e5399326a9882e, and bundled examples blob d4f277dfd7f298baf635375ee948ccb8bb034300. Microsoft explicitly marks the CallingServer SDK deprecated and instructs new development to use Call Automation instead, so this package is retired from normal unchanged selection rather than treated as a current implementation skill. It remains useful migration and legacy-maintenance evidence. The legacy recording example starts, pauses, resumes, and stops call recording without a distinct recording-consent/privacy authorization boundary, and credential examples use a connection-string placeholder rather than hardened identity guidance. Preserve only as bounded migration/reference evidence for existing CallingServer code; new work should resolve to the separately reviewed Call Automation package.