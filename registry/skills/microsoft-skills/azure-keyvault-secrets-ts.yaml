rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 2dd97bf732af6c7d5ec00e23d05db80e9a56ce26, SKILL.md blob 1f236a2b4c8d9ddab0e808d253c029a32193fcdd, references/keys.md blob 92431a3ddcaae3a490be8ae9f7c2a4435077ef09, and references/secrets.md blob a42655c2972030bace17ecae97eeacf967978a46. The package provides useful TypeScript prior art for Key Vault secret CRUD/versioning, recovery, backup/restore, key lifecycle, cryptographic operations, managed identity, expiration, and least-privilege patterns. Unchanged adoption is rejected because it sets, retrieves, prints, lists, deletes, purges, recovers, backs up, restores, and bulk-handles secret material while also creating/rotating/deleting/purging keys and performing cryptographic operations without mandatory vault/resource, secret-purpose, data-owner, per-operation, destructive-action, recovery, secure-custody, disclosure, retention, or production authorization boundaries. Examples include literal secret values, raw secret output, API-key and connection-string secret values, and backup/export material that can leave secure custody. Preserve as adaptation/reference evidence with managed/workload identity, least-privilege vault scope, explicit per-operation authority, purge protection/recovery controls, secure external credential and backup custody, secret-value redaction, and no raw decrypted or secret output.