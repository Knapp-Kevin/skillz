rationale: Exact static review bound to package tree 164d327f3039e037b0ad2cdabeee01e2c6aa6d3f and SKILL.md blob 04d194383e9863d8167d8005747cf6a3933ddc26. Useful material includes intent-to-workflow routing, sub-skill-before-execution discipline, Playground-first testing, explicit long-running/background-process handling, project-context resolution, troubleshooting guidance, and broad Teams/M365 reference coverage. Unchanged adoption is rejected because the package directs global ATK installation, project scaffolding and filesystem mutation, tenant app/AAD provisioning, Azure resource creation and deployment, authentication, sideloading/sharing/publishing, and other consequential external operations without a mandatory action-specific authorization checkpoint immediately before each operation. It also instructs users to provide real missing Azure OpenAI secret values conversationally, contrary to the secure external credential-path preference. Preserve the routing, reference decomposition, and troubleshooting material for adaptation behind explicit mutation/external-action authorization and secure credential handling. Behavioral validation is not-run.