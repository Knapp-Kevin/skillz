rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 17be5880febf72e104b84d32e626197693d90e3b and SKILL.md blob 249ebfabf8eef0e94a39079d3968434a56eab4ef. The skill provides useful .NET guidance for document analysis, prebuilt models, custom model/classifier construction, authentication, diagnostics, and result handling. However, unchanged adoption fails the current authority boundary because the main workflow includes building custom models/classifiers and deleting models without a distinct affirmative authorization gate for those consequential Azure resource mutations. Document analysis also transmits potentially sensitive invoices, receipts, identity documents, tax forms, health-insurance cards, or other documents to an external service without making approved data handling/privacy authorization a mandatory prerequisite. Secret examples use placeholders and environment variables rather than soliciting actual secret values conversationally. Preserve as adaptation/reference evidence with explicit host authorization and data-governance gates added before operational use.