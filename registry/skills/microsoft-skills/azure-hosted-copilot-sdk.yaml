rationale: Exact complete-package static review at the registered Microsoft Skills pin, bound to package tree SHA ee166d12b8f9a88a1d4d932a23e844d8203efa13 and SKILL.md blob 64b239df00aa320b64a9009c1875b303a87080b1 plus five bundled references. Preserve its strong codebase detection/routing, temp-directory scaffolding that avoids overwriting the user project, managed-identity production guidance, least-privilege RBAC advice, secure Key Vault token storage pattern, SDK/BYOM integration guidance, and explicit separation between preparation and deployment. Unchanged adoption fails the current authority hard rule because bundled troubleshooting instructs `gh auth refresh --scopes copilot`, which expands credential authorization without a mandatory action-specific approval boundary, and the top-level deployment path delegates consequential provisioning to `azure-deploy`, whose exact pinned package is itself rejected unchanged for missing dedicated authorization before later RBAC/database mutations. The package does not repair that inherited gap. No workflow was found that asks the user to paste literal secrets into conversational context, but the GitHub token is credential-sensitive and must remain in external secure credential handling. Preserve as adaptation/reference evidence; behavioral validation has not been run.