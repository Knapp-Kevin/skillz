rationale: Exact static review of azure-kubernetes-automatic-readiness at the registered Microsoft Skills pin, bound to package tree SHA 1694eb4d1069fda2eac18653fdae8d2b55a3646c and SKILL.md blob 452449d067b912207e88e2e4c0358571aba6ec66. Preserve the strong read-only assessment boundary, explicit secret non-disclosure rule, user approval before file writes, deterministic versus context-dependent fix distinction, combined-diff approval flow, offline fallback, and versioned constraint-spec disclosure. Unchanged adoption fails the current authority hard rule because the bundled migration guide contains direct procedures for creating a persistent billable AKS Automatic cluster, obtaining credentials, deploying workloads, enabling OIDC/workload identity on existing clusters, and deleting the old cluster without mandatory action-specific authorization immediately before those external mutations. The top-level read-only guardrail prevents cluster mutation during assessment, but the package as a whole includes migration procedures whose authorization boundary is weaker than current governance requires. Preserve as adaptation/reference evidence; behavioral validation has not been run.