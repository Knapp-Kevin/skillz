rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 2dabc3855c1b4ea3c8bf6f855ccf310c9e36eccd and SKILL.md blob 80428335ae9036992bc1fda54594380a1c122b18. The skill provides useful .NET guidance for Azure AI Foundry project clients, persistent and versioned agents, connections, deployments, datasets, indexes, evaluations, Azure OpenAI access, authentication, and tool surfaces. Unchanged adoption fails the current authority/data-handling rule because primary workflows create and delete remote agents/threads, create agent versions, upload and delete datasets, create/update and delete indexes, run evaluations, invoke metered model/search services, and expose a credential-bearing connection retrieval option without a distinct affirmative resource/cost/data-transmission authorization boundary or mandatory approved-data-handling prerequisite. Secret examples otherwise use environment variables, placeholders, DefaultAzureCredential, and managed identity rather than soliciting real secret values conversationally. Preserve as adaptation/reference evidence with explicit mutation, cost, data-governance, credential-access, and external-service authorization gates before operational use.