rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA b58604b7161eec1bf999295046a4fced6f9d4507 and SKILL.md blob 22e9dd0e2e8cbcfc5ce26c59d14b4b5c4a8ce0c9. Useful Java chat guidance covers threads, messages, participants, history sharing, read receipts and typing notifications. Rejected unchanged because normal examples create/delete threads, send/update/delete external messages, add/remove participants, expose prior message history, and publish read/typing state without distinct communication, participant/history/privacy and destructive-action authorization boundaries. Examples print message content, sender identifiers and receipt identity data. Bundled examples also specify chat SDK 1.6.4 while the top-level skill specifies 1.6.0. Preserve as adaptation/reference evidence with explicit send, participant/history, presence/privacy and deletion gates.