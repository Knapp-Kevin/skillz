rationale: >-
  Useful Microsoft 365 Agents SDK hosting, routing, JWT middleware, OAuth, streaming, and Copilot Studio patterns remain valuable prior art, but unchanged adoption fails the authority and sensitive-data hard gates. The examples send user-facing activities, obtain and use Graph access tokens, read profile data, transmit prompts/content to Azure OpenAI, interact with Copilot Studio, and expose a client-secret environment configuration path without explicit tenant, audience, communication, identity/data-access, disclosure, or secret-custody authorization. Adapt only with host-specific authorization, data classification/redaction, secure credential custody, audience controls, and externally consequential communication boundaries.