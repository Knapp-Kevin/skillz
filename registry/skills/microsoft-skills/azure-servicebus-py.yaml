rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA 0c786cdf38814cdbdcaf42e9fb98b59dae38ca57 and SKILL.md blob df06c9281cd34c06b0e8021517019267d9ae3a4c. The package includes two substantial references and an administrative setup CLI covering send/receive, settlement, sessions, scheduled messages, dead-letter processing/retry/archive, transactions, competing consumers, and queue/topic/subscription creation and deletion. Useful Entra-first authentication, reliable messaging, retry, DLQ, batching, and orchestration patterns remain prior art. Unchanged use is rejected because it sends externally consequential messages, completes or receive-and-deletes queued data, dead-letters and reprocesses messages, cancels schedules, mutates session state, and creates/deletes Service Bus entities without explicit namespace/entity, recipient/downstream, data-disclosure, settlement/destructive-action, rollback, or budget authorization. The setup CLI also permits a connection-string credential path. Preserve as adaptation/reference material with explicit entity and downstream scope, message-data classification, destructive settlement and DLQ authority, administrative change approval, secure credential handling, and cost controls.