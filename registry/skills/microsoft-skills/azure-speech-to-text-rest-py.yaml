rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA e3ec4de3b5c76926c40c502ec5afe82d0a0240ac and SKILL.md blob b0f96a3e9b5eac1d898e5b0938e862f164aa0aa1. The package includes pronunciation-assessment reference material and sends audio plus optional reference text to Azure Speech, then prints transcription and pronunciation results. Useful short-audio REST, chunking, response, error-handling, and pronunciation-assessment patterns remain prior art. Unchanged use is rejected because voice/audio and derived transcripts or assessment results can contain biometric, identity, health, location, document, or other sensitive information, yet the workflow lacks explicit subject consent/data authority, destination/region approval, retention/redaction rules, output-disclosure controls, and cost authority. It also normalizes direct subscription-key handling and token issuance without a secure credential-path contract. Preserve as adaptation/reference material with explicit audio-data classification and consent, approved Azure resource/region, least-data and retention rules, secure credential custody, transcript/output disclosure controls, and budget boundaries.