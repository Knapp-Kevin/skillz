rationale: Exact static review of azure-upgrade at the registered Microsoft Skills pin, bound to package tree SHA ad4f782ddd8eab34eacece4ccb1b66d65a0434d9 and SKILL.md blob 6b87a36c181440dd213443b19a2a58d25504a1ba. Preserve its assessment-first sequencing, target plan/SKU confirmation, explicit confirmation before resource creation and destructive actions, rollback discipline, idempotent/resumable automation requirement, and scenario-specific migration references as adaptation evidence. Unchanged adoption is rejected because bundled Functions automation retrieves the AzureWebJobsStorage connection string into shell state and uses it directly for blob operations, exposing live credential material where an identity-based external credential path is appropriate. The same reference also installs the resource-graph extension without a distinct action-specific authorization checkpoint. Behavioral validation has not been run.