rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 86f720a7dbed3474b6e4da1d7593db81f9715145 and SKILL.md blob 5ec2d2d5592e6a71ec707b03b4a5d64643b5a491. The package provides useful Java image-analysis guidance for captioning, OCR, objects, people, tags and smart cropping, but unchanged adoption fails current data-handling/cost rules because local images and document images can be transmitted to an external metered service and remote URLs can be submitted for analysis without a mandatory approved-data/privacy boundary. People detection and OCR increase the likelihood of personal or sensitive content. Credential examples use environment variables and Azure credential objects rather than soliciting secrets. Preserve as adaptation/reference evidence with explicit image/privacy, local-file transmission and metered-service authorization gates.