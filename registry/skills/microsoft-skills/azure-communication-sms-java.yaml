rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA d4bea547144aea210f1dcb782658f947847d72a6, SKILL.md blob d2dfd5056562193e7cbda6be6c7fd6c6faecdfe8, and bundled examples blob 570d0545d6ac0994909e1c1c107f37b425985d0a. The package is useful Azure Communication Services SMS prior art for synchronous and asynchronous sends, delivery reports, batching, OTP delivery, retry/error handling, and Entra-based authentication. Unchanged adoption is rejected because normal examples initiate external SMS communication, including bulk marketing and OTP delivery, without distinct recipient-consent, message-content, campaign, cost, privacy/data, or send authorization gates. The examples also print recipient phone numbers and message identifiers, use phone numbers in correlation tags, and the OTP example stores OTP secrets in process memory and logs the recipient phone number on success without explicit sensitive-data handling guidance. Connection-string and access-key examples use placeholders/environment variables rather than soliciting live secrets, which is positive. Preserve as adaptation/reference material with explicit communication authority, consent/compliance, privacy/logging, OTP-secret handling, and cost/rate controls.