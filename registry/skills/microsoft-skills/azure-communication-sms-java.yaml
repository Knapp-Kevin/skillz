rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA d4bea547144aea210f1dcb782658f947847d72a6 and SKILL.md blob d2dfd5056562193e7cbda6be6c7fd6c6faecdfe8. Rejected unchanged because examples send single, bulk, marketing and OTP SMS messages, retry failed sends, expose recipient phone numbers in logs/delivery reports, and store/handle OTP secrets without mandatory recipient-consent, message-purpose, PII/privacy, authentication-secret and metered-cost authorization boundaries. The top-level skill demonstrates a literal verification code and bulk marketing campaign; bundled examples generate/store OTPs in memory and tag/log phone-number context. Preserve as adaptation/reference evidence with explicit send/consent, OTP-secret, PII/logging, retry and cost gates.