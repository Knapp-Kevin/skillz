rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA fb958f3071a3896afd1340cf879eabd417ff6e91 and SKILL.md blob 19e5a3918fdf9d5c978a5181025a2f6a2c342645. The package is useful for Fabric capacity provisioning, scaling, suspend/resume, administrator changes, deletion and SKU discovery. Unchanged adoption fails the current authority/cost rule because the normal path creates billable capacity, scales SKU, changes capacity administrators, suspends/resumes compute and deletes resources without distinct affirmative resource/cost/identity authorization. The text usefully warns that active capacity bills even when idle, but warning is not consent. Preserve as adaptation/reference evidence with explicit capacity-cost, administrator, scale/state and deletion gates.