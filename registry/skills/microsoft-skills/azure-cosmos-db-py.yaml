rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA 77bdd7486a9195478b4d1663fb36e1b29c42f6b6 and SKILL.md blob 9fcb9385f93da33da00cd2354df18948c5113956. The package includes five references and three Python templates in addition to SKILL.md. It contains useful prior art for RBAC-first authentication, emulator isolation, parameterized queries, partition-key design, service-layer separation, testing, graceful degradation, connection lifecycle, and typed CRUD. Unchanged use is rejected because its normal patterns create, update, query, and delete durable application data without a distinct data-scope, tenant/workspace authorization, mutation, destructive-action, retention, rollback, or approval boundary. The main skill says partition-key access must match user authorization, but the bundled service examples accept workspace_id and author_id as parameters and perform writes/deletes without establishing the calling authorization contract. The package also contains inconsistent sync-versus-async guidance and recommends broad exception logging with traceback output, which requires adaptation before production use. Dependency installation is unpinned. Preserve intact as adaptation/reference material with explicit caller authorization, tenant/data classification, delete/retention/restore policy, concurrency/idempotency expectations, secret-safe logging, consistent async client architecture, least-privilege Cosmos RBAC, and pinned dependencies.