rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 5a8c8f952a2e64ad8ade693b6ec964818191e55f, SKILL.md blob 4f9d8cfec9d6a166cd5bd18fc91fabc53dc7f343, and bundled examples blob acaa03ad8363e7c627907873d66cfc9d7c68b731. Microsoft explicitly marks azure-monitor-query deprecated and directs migration to azure-monitor-query-logs and azure-monitor-query-metrics, so retirement is the truthful decisive state rather than unchanged-reuse eligibility. The material remains useful migration and query prior art for Kusto/Log Analytics queries, Azure resource metrics, batch queries, time ranges, async patterns, result mapping, and partial-failure handling. Unchanged use is additionally unsuitable because ordinary examples read and print operational telemetry and workspace/resource data without a distinct data-access, privacy/classification, output/redaction, or query-scope authority boundary, and bundled examples use unconstrained DefaultAzureCredentialBuilder construction while the top-level skill adds production requireEnvVars guidance. Preserve as bounded migration/reference evidence with explicit observability-data authorization, least-data query scope, output redaction, intended-identity verification, and replacement-package pinning.