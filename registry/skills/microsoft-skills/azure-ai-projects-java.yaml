rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 7476d650fa39aa40ca73da5587a56531b652c6cd and SKILL.md blob a28cc004322d021cafc17518c27755a28c1141cc. The package provides useful Java Foundry project guidance across connections, deployments, datasets, indexes and evaluations, but unchanged adoption fails current authority/data-handling rules because examples create/update indexes, upload/create/update/delete datasets, access connection credentials, and invoke external evaluation services without distinct resource, credential, local-file/data-transmission and cost authorization boundaries. Credential setup otherwise uses Azure credential objects and environment configuration rather than soliciting secrets. Preserve as adaptation/reference evidence with explicit mutation, credential-access, dataset transmission and metered-service gates.