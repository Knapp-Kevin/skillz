rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 8f2587380047b7bed88ee6a35c0aeae040342709 and SKILL.md blob 07adf059989627086c55e5aaa94d2057022b1c2d. The package provides useful Azure Marketplace W&B provisioning, SSO, identity and lifecycle guidance, but unchanged adoption fails because it creates a pay-as-you-go Marketplace instance using administrator PII, enables managed identity/SSO, updates and deletes resources without affirmative commercial/resource/identity/data authorization. The management SDK is also prerelease at this pin, increasing freshness sensitivity. The follow-on W&B integration requires an external API key and transmits experiment metrics to the partner service. Preserve as adaptation/reference evidence with marketplace/cost, PII, SSO/identity, external-data and lifecycle gates.