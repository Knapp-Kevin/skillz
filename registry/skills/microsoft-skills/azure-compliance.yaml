rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA 5d79eadfd4a42ff0091adb849bf016abd7ee57de and SKILL.md blob 5beb9da33c90ceff1b69ff78bdba78c326fd7a39 plus the bundled reference tree. The package preserves useful compliance-scan, Azure Quick Review, Resource Graph, Key Vault expiration, prioritization, authentication, and remediation-analysis prior art, and the top-level skill correctly separates compliance reporting from remediation execution. Unchanged adoption is rejected under the current authority hard fail because bundled remediation procedures directly create or alter private endpoints, storage network access, soft-delete policy, Key Vault RBAC mode, Log Analytics/diagnostic settings, backup vault/protection, AKS Defender and managed identity, SQL auditing/private access, App Service identities, HTTPS/TLS settings, and bulk resource configuration without mandatory target-resource, identity/access, security-control, network-exposure, production, cost, retention, or per-action authorization. Preserve the read-only assessment and classification mechanics, and gate any remediation reference behind explicit action-specific authorization. Behavioral validation has not been run.