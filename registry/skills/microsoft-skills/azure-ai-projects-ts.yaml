rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA f1d68f1c635903c22d4bfc6d85349a0405e2f175 and SKILL.md blob baea6df8c76732e7a6ee9268a1de80cd52cb76e1. The package contains SKILL.md plus connections.md and evaluations.md references and provides useful TypeScript prior art for Foundry project clients, agent/version management, connections, deployments, datasets, indexes, evaluations, OpenAI client access, and tool wiring. Unchanged adoption is rejected because ordinary examples create and delete persistent agents, conversations, datasets, indexes, evaluators, and evaluation runs; publish data to Azure/OpenAI-backed services; may invoke code, web search, file search, Azure AI Search, functions, and MCP tools; and can incur inference/storage/evaluation costs without sufficiently explicit action-specific resource, publication, destructive-action, downstream-effect, rollback, data-disclosure, or budget authorization. The bundled connections reference also demonstrates getWithCredentials() and printing an API key, directly violating the repository's secret-custody rule, while evaluation examples can upload and print potentially sensitive prompts, context, responses, and per-row results without minimization/redaction/retention controls. Preserve as adaptation/reference evidence with secure external credential handling, least-privilege connection access, explicit data-transfer and tool/action authority, resource lifecycle approval, and cost/disclosure controls.