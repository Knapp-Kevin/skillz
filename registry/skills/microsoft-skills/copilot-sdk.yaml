rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA dbdf15d9f078af5a2996a8b9a3bf719e80330aed and SKILL.md blob 79f42cd0aef9a7a660f96668bc547d998e2485b4. The skill is implementation guidance for applications that embed GitHub Copilot through the SDK. It covers sessions, streaming, custom tools, hooks, MCP servers, authentication, BYOK, persistence, agents, skills, and deployment patterns. It explicitly exposes pre-tool permission decisions including allow, deny, and ask, plus post-tool redaction hooks. Consequential side effects arise only through host-defined tools, MCP servers, deployment code, or application behavior and remain subject to the host application's authorization model. Credential examples primarily use environment variables or stored authentication rather than asking the user to disclose actual secrets in conversational context. Product APIs, package versions, models, and preview behavior are freshness-sensitive and should be checked against current GitHub Copilot SDK documentation before implementation.