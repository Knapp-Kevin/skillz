rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA d4ba91752ddd62b9cae2d77e8275dc5a8d75685e and SKILL.md blob 04a975fec1379266430f07bc789bae7acd579185. The package is useful prior art for persistent Azure AI agents, async lifecycle management, function and hosted tools, MCP integration, structured output, streaming, and conversation threads. Unchanged use is rejected because ordinary examples create persistent service-side agents and threads, invoke hosted code execution and web search, connect external MCP services, upload files and create vector stores, and print persistent conversation identifiers/results without distinct authorization boundaries for agent creation, external tool use, data upload/classification, persistent state, code execution, network access, or output disclosure. Positive controls include production-constrained DefaultAzureCredential guidance, avoidance of static API keys, context-manager lifecycle guidance, and placeholder credentials. Preserve as adaptation/reference material with explicit per-capability authority, data classification and upload approval, MCP trust boundaries, sandbox/code-execution policy, persistent-state lifecycle/retention policy, external-search/network authority, output-redaction rules, cost awareness, and intended-identity verification.