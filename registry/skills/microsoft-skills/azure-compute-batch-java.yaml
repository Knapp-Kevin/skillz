rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 84c4838dbba5893e78a5ea42565ea35feddbcd1c, SKILL.md blob 5fc31081115f4710a9b2b961b6662253b0232318, and bundled examples blob 6fd6cb199376ae28c16c35b113cc9e352852b158. The package is useful Azure Batch prior art for pool, job, task, node, schedule, autoscale, output, and authentication patterns. Unchanged adoption is rejected because ordinary examples create/resize/autoscale/delete compute pools, create/update/terminate/delete jobs, submit arbitrary command lines and large task collections, reboot nodes, create recurring schedules, and can execute pool/task startup commands with ADMIN elevation without distinct infrastructure, cost, command-execution, privilege, destructive-action, or scheduling authorization gates. Bundled examples also place SAS-bearing Storage URLs directly in task resource/output configuration, requiring stronger secret/data handling. Entra ID and managed identity guidance is comparatively sound and shared-key credentials are environment-backed. Preserve as adaptation/reference material with explicit compute-cost, command/privilege, destructive-state, schedule, SAS-secret, and data-egress authority boundaries.