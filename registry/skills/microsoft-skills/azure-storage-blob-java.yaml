rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 546766fa052b52e814f86f445b686f9bd04364fa, SKILL.md blob 9202207d800886e1fbe56673a54f7f77b723e114, and bundled examples blob 47f2f6ba61f60ca0305eadcdf482450d48a14d64. The package is useful prior art for Blob Storage clients, container lifecycle, uploads/downloads, streaming, listing, copy, metadata, leases, SAS generation, and error handling. Unchanged use is rejected because ordinary examples create and delete containers, upload/overwrite/delete blobs, list and download data, mutate metadata and headers, acquire leases, copy blobs, and generate SAS credentials without distinct data-access, mutation, destructive-action, credential-generation, privacy/classification, cost, or external-service authorization boundaries. Bundled examples also recommend unconstrained DefaultAzureCredential and shared-key authentication while the top-level skill provides stronger production requireEnvVars guidance. Preserve as adaptation/reference material with explicit storage-scope authority, overwrite/delete confirmation, data-classification controls, SAS minimization and non-disclosure, least-privilege Entra ID authentication, intended-identity verification, cost awareness, and download/output handling policy.