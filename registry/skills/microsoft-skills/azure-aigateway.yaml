rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA fb881f68bdc6d638438b46b04ab6d81f91e985ba and SKILL.md blob a8df9f45fae25501acf7fee988047f808d191fa5 plus the complete references tree. The package contains strong AI gateway prior art for managed-identity backend authentication, token/rate controls, semantic caching, content safety, load balancing, MCP exposure, streaming, multi-tenant metering, and troubleshooting. Unchanged adoption fails the current authority, security-control, credential-custody, production-routing, telemetry-disclosure, and external-side-effect hard gates. The normal flow directly enables APIM managed identity, creates RBAC role assignments and APIM backends, imports APIs, changes gateway policies and routing, configures content-safety and rate-limit controls, exposes APIs as MCP tools, and tests live AI endpoints without mandatory target/environment, identity/access, production-change, security-control, downstream-effect, data-transfer, telemetry, or cost authorization. SKILL.md also instructs listing APIM subscription keys, which can emit live credential material into conversational/tool output. Preserve the policy, managed-identity, gateway-governance, load-balancing, caching, content-safety, and MCP patterns for adaptation/reference use with explicit resource, identity/access, security-control, production-routing, disclosure, cost, and credential-custody gates. Behavioral validation has not been run.