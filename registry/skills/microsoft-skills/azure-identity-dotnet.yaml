rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA a77d4ff49b15f776a2daad5f4a59fa6561c94414 and SKILL.md blob a851ddfc4dc0fc76cdb9fb45f0604c16d4d59f82. The skill is implementation guidance for Microsoft Entra ID authentication through Azure.Identity in .NET, covering DefaultAzureCredential, managed identity, service principals, certificates, credential chains, sovereign clouds, diagnostics, reuse, retries, and error handling. Secret-bearing examples use placeholders and environment/file-based credential paths rather than requesting actual secret values in conversational context. Package installation mutates the host project/environment and authentication acquires tokens, so use remains subject to explicit host authority and target-environment policy. Product/API details are freshness-sensitive and should be checked against current Azure SDK documentation before implementation.