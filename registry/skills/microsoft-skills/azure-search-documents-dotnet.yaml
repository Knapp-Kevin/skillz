rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 49ed94e58508e30be14b5e531d53a243c821de6c and SKILL.md blob 074a1981b319b9c93327188a3dcbd5ca84888b85. The package provides strong Azure AI Search guidance for full-text, semantic, vector and hybrid search, but unchanged adoption fails the current authority/data-handling rule because its normal workflows create or update indexes, upload/merge/upsert/delete indexed documents, and transmit queries, embeddings and indexed content to a metered external service without distinct affirmative mutation, data-transmission and cost authorization gates. Integrated vectorization can additionally route text through Azure OpenAI. Preserve as adaptation/reference evidence with explicit index/document mutation, external-data and metered-service authorization boundaries before operational use.