rationale: Exact static review of azure-reliability at the registered Microsoft Skills pin, bound to package tree SHA 1240c9672f0101c65ab0dbc461f9515a200b4486 and SKILL.md blob 835bc5e854d9cabfc6021a9bfc6d7fbb8c594abb. The top-level workflow has unusually strong staged authorization: assessment precedes remediation; the user chooses live CLI versus IaC patching; storage migration, source-code health-endpoint changes, and multi-region work each require explicit consent. However, bundled configure-storage.md instructs the host to retrieve a live storage connection string with `az storage account show-connection-string --query connectionString -o tsv` and then place that secret into app settings. That exposes raw credential material to command output/conversational handling instead of requiring a secure external credential path or redacted transfer. Under the current secret-and-sensitive-data discipline, unchanged adoption therefore fails despite otherwise strong authority boundaries. Preserve its staged reliability assessment and consent mechanics as adaptation/reference evidence. Behavioral validation has not been run.