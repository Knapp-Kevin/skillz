rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA ac2032a229e8853b9d4957a9d9146ca958eaeed4 and SKILL.md blob 584b13e150584b12741a775389b6dab1bdfa82f1. The package provides useful Java real-time voice guidance, but unchanged adoption fails current consent/data/tool/cost rules because normal and bundled examples start metered external AI sessions, stream user audio, configure transcription, actively capture microphone audio for thirty seconds, and execute function-call handlers without mandatory recording/privacy, external-service, metered-cost and tool-action authorization gates. Credential examples use environment variables and Azure credential objects rather than soliciting secrets. Preserve as adaptation/reference evidence with explicit recording consent, live-audio transmission, session-cost and function-execution boundaries.