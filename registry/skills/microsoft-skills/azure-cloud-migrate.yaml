rationale: Exact complete-package review at the registered Microsoft Skills pin, bound to package tree SHA dd0d5a31e87576d5b46899b19aa3eedb24d412f4 and SKILL.md blob b1634cf629d9358eb70a95c089b309c304f9c42c plus the complete bundled reference tree. The package preserves strong cross-cloud assessment, code-conversion, service-mapping, runtime-selection, source-preservation, progress-reporting, and deployment-handoff mechanics. It also contains a meaningful top-level authorization safeguard: destructive actions require ask_user and migration completion explicitly asks whether to test locally or deploy to Azure. Unchanged adoption still fails current authority and secret-custody hard gates because bundled deployment guidance directly creates resource groups, Log Analytics workspaces, Container Apps environments, Key Vaults and managed identities, performs ACR imports, creates RBAC role assignments, migrates Kubernetes secret material, configures external ingress and production-like scaling, and retrieves a Log Analytics primary shared key into a shell variable without mandatory target-resource, identity/access, security-control, secret/data-owner, production, network-exposure, retention, or cost authorization boundaries appropriate to those individual actions. Preserve the assessment, conversion, compatibility, staged migration, source-preservation, and explicit deploy-choice mechanics for adaptation/reference use with stronger per-resource and secret-custody authorization. Behavioral validation has not been run.