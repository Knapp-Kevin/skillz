rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 9aa33d977e6fec260080fb5a25dae296ccb3c9e8, SKILL.md blob 0fbad66ba89446a1481d848c0aa2ed8df0efa897, and bundled examples blob b1b70c81f3e73eb6c06f4a2770297aaa30c666b1. The package is useful Azure Tables Java prior art for client construction, partition/row-key design, CRUD, queries, optimistic concurrency, transactions, async patterns, and authentication. Unchanged adoption is rejected because normal examples create and delete tables, create/update/upsert/delete entities, submit mixed mutation transactions, enumerate tables/entities, and print entity properties without distinct data-access, mutation, destructive-action, privacy/logging, or external-service authorization gates. Connection-string, shared-key, and SAS authentication are presented alongside stronger Entra/managed-identity guidance and need explicit least-privilege and secret-governance framing. The package pins a beta azure-data-tables dependency, so suitability should be rechecked before reuse. Preserve as adaptation/reference material with explicit data-scope, write/destructive, privacy/logging, credential, and dependency-stability boundaries.