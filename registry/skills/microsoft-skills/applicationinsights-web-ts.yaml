rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA cb03b364b8f9dcb5fc2ee9662758a1f949c23102 and SKILL.md blob e1bfcc76ab8e76060350426a04115dc33de8bbd4. The material is technically strong on browser RUM, telemetry enrichment/filtering, distributed tracing, framework integration, GenAI trace semantics, PII cautions and secret scrubbing. Rejected unchanged because the primary setup path instructs initializing telemetry before first user interaction and enables page/dependency collection without making user consent or an approved telemetry/data-handling policy a mandatory authorization boundary. Later cookie/privacy guidance shows how to gate telemetry on consent, but it is optional rather than a precondition. The skill also recommends client-side user/session identifiers and click analytics, making privacy authority consequential. Retain for adaptation/reference with a mandatory consent/data-governance gate. SDK APIs, package versions, browser privacy behavior and OTel GenAI semantic conventions are freshness-sensitive.