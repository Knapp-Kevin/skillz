rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA b275cc7fb988e6502965015d0d091605332f87c1, SKILL.md blob 50b8b57d4f064c88ddd3c35976511952bcdeba05, references/browser-auth.md blob 1d8a93ad3e4a907e41e8cbe009ddf81b3b1f01c4, and references/credential-types.md blob ae246f78be2b6ae48863b180dd5c0c188aafbeae. The package provides useful TypeScript prior art for DefaultAzureCredential, managed/workload identity, service principals, developer credentials, browser/device-code authentication, sovereign clouds, credential chaining, token providers, and authentication error handling. Unchanged adoption is rejected because it includes raw bearer-token retrieval and explicit token logging, verbose Azure Identity logging without mandatory redaction, secret/password-bearing credential construction paths, broad developer-credential fallback chains, interactive/browser identity flows containing user identifiers, and instructions that can alter CORS/security configuration, all without mandatory tenant/resource/scope, credential-custody, identity/access, sensitive-output, or security-control authorization boundaries. Preserve as adaptation/reference evidence with managed/workload identity preferred, secure external credential custody, least-privilege tenant/resource/scope binding, no raw-token output, redacted diagnostics, explicit user/tenant consent, and separate authorization before identity/access or CORS/security-control changes.