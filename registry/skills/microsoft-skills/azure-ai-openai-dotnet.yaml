rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 38bd23798e46c5c010737ecabfcf2bc8d8033d9a and SKILL.md blob 4c15f34a6a12e0a7d1f198ce5a61508168c51d54. The skill provides useful .NET guidance for chat completions, streaming, structured outputs, reasoning models, Azure AI Search RAG, embeddings, image generation, audio transcription and speech generation, and function/tool calling. Unchanged adoption fails the current authority/data-handling rule because its primary examples directly send prompts, document/search-derived content, audio, image-generation requests, and other user/application data to metered external AI services without a distinct affirmative cost/data-transmission authorization boundary or mandatory approved-data-handling prerequisite. Function calls are surfaced rather than executed by the example, and the best-practices section tells the host to validate tool arguments, which is useful safety evidence but does not cure the external-service authorization gap. Secret handling is comparatively sound: examples use environment variables, placeholders, DefaultAzureCredential, and managed identity rather than soliciting real secret values conversationally. Preserve as adaptation/reference evidence with explicit cost, data-governance, and external-service authorization gates before operational use.