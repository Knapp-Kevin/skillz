rationale: Exact one-file package review at the registered Microsoft Skills pin, bound to package tree SHA aa73dd40ee99a98ad10af90945869141b71f4a8e and SKILL.md blob 8cdd7c32a64a02842a322e5a19607bf6c991dfbb. Useful material covers Entra-first authentication, client lifecycle, short-lived access tokens, targeted/broadcast messaging, group management, connection management, and permission controls. Unchanged use is rejected because examples print credential-bearing client access URLs, send messages to external recipients, mutate group membership, terminate client connections, and grant/revoke messaging permissions without distinct token-disclosure, audience/content, membership, disconnect, or authorization gates. Metered service use and unpinned installation also remain unbounded. Preserve as adaptation/reference material with secure token handling, explicit message audience/data authority, permission and connection-change approval, least privilege, cost awareness, and pinned dependencies.