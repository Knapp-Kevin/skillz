rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to single-file package tree SHA d58b609f6ec1d685143378e3e43f9e08f0883917 and SKILL.md blob 175e519e8d39e7fe5c2eaa34013f73f53641c1b5. The package provides useful TypeScript prior art for Web PubSub service/client setup, Entra-first production authentication, client token generation, targeted and broadcast messaging, groups, connection lifecycle, permission management, reconnect handling, Express event handlers, and negotiate endpoints. Its intended triggers are Azure Web PubSub implementation tasks; it is not authorization to disclose messages, mint or expose bearer credentials, alter group membership or connection permissions, disconnect users, broadcast notifications, execute user-event handlers, or operate production hubs. Unchanged adoption is rejected because ordinary examples print credential-bearing client access URLs, broadcast/send external messages, add/remove users or connections from groups, close individual/user/group/all connections, grant/revoke connection permissions, emit client events, log user IDs and message bodies, and return event data without mandatory hub/resource, recipient/audience, message/data-owner/classification, identity/access, per-action/disconnect, downstream-effect, disclosure, production, or credential-custody authority. Preserve as adaptation/reference evidence with Entra-first least privilege, secure non-conversational credential handling, explicit audience/message/action authorization, output minimization/redaction, bounded token roles/expiry, and production/notification safeguards.