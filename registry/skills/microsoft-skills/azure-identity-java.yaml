rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 3b21b1a4c9189a1b1ad32f411194375f7d8ebf3f, SKILL.md blob ffe26b990c0cfbbae77a19345024c45d2ed0c608, and bundled examples blob ed9f87cf395e5d197004b0f0a87d21cb81f601bb. The package is useful Azure Identity Java prior art for DefaultAzureCredential, managed/workload identity, service principals, certificates, environment credentials, browser/device-code flows, custom credential chains, sovereign clouds, and integration with Azure SDK clients. Unchanged adoption is rejected because authentication and credential selection are security-sensitive while the package recommends broad DefaultAzureCredential use without a mandatory production chain-hardening or explicit intended-identity verification step, demonstrates account-identifier and verbose authentication logging without a redaction/sensitive-logging boundary, and bundled examples include literal PFX password text plus credential-backed access to Key Vault secrets without a distinct secret-access authorization boundary. Positive guidance includes managed identity in production, environment-backed client secrets, placeholders in most credential examples, and a stated least-privilege principle. The main skill pins azure-identity 1.15.0 while bundled examples use 1.18.2 or BOM 1.2.29, creating a concrete version-consistency defect. Preserve as adaptation/reference material with explicit intended-identity, least-privilege, secret-source, certificate/password, logging/redaction, interactive-auth, downstream-resource authority, and dependency-version boundaries.