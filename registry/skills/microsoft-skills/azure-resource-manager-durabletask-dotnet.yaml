rationale: Exact package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 7891cd49733687e3c08c0034b15c709d2ffca41e and SKILL.md blob 79e685dca8daf9df66c987fbd01525ce34699434. The package clearly separates management from data plane and provides useful scheduler/task-hub/retention guidance. Unchanged adoption fails the current authority/cost rule because normal workflows create Dedicated or Consumption schedulers, task hubs and retention policies, scale capacity/IP allowlists, and delete hubs/schedulers without a distinct affirmative resource/cost/network/deletion authorization boundary. Credential guidance is sound and no secret values are solicited. Preserve as adaptation/reference evidence with explicit scheduler-cost, network, retention and lifecycle gates.