rationale: Exact one-file package review at the registered Microsoft Skills pin, bound to package tree SHA 604b049cc7e1550e604b6f9e60fc896e1121211a and SKILL.md blob 907ee84b85bfaa87cc2dada271d27e03ae5dae28. Useful material covers CloudEvents/EventGridEvent schemas, Entra-first authentication, batching, namespace topics, sync/async publishing, and routing metadata. Unchanged use is rejected because its core workflow publishes application payloads to an external event service, potentially triggering downstream systems and incurring service cost, without distinct topic/audience, data-disclosure, publication/communication, downstream-side-effect, or budget authorization. The async example also does not close its DefaultAzureCredential despite the package's stated lifecycle rule. Dependencies are unpinned. Preserve as adaptation/reference material with explicit publication/data authority, downstream impact and cost gates, approved event schemas/data classes, deterministic credential cleanup, and pinned dependencies.