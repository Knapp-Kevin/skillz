rationale: Exact complete-package reconciliation at the registered Microsoft Skills pin, bound to package tree SHA 11dfaafad2fac0ca15d3b328d0ae76f8338da917, SKILL.md blob 21a14dce1c668ef29e3267b262be6123533eb92e, and bundled examples blob dd58f7121e5a41e464084bd6ca50fc0b770a3c47. The package is useful Azure Cosmos DB Java prior art for client construction, partitioning, consistency, CRUD, querying, paging, async patterns, request-unit awareness, and authentication. Unchanged adoption is rejected because normal examples create and delete databases and containers, create/replace/upsert/delete records, issue broad queries, consume metered request units, and print user/item data without distinct data-access, mutation, destructive-action, privacy, or cost authorization gates. The top-level dependency also uses LATEST rather than an exact SDK version. Environment-backed key use and DefaultAzureCredential guidance are useful positive patterns, but shared-key handling needs stronger least-privilege and secret-governance framing. Preserve as adaptation/reference material with explicit data-scope, write/destructive, privacy/logging, request-unit cost, credential, and dependency-version boundaries.