name: Optional source-blind skill improvement
description: Categorical canonical defect report. GitHub shows the posting account.
title: "[Skill feedback] Canonical defect"
body:
  - type: markdown
    attributes:
      value: |
        OPTIONAL PUBLIC form. Leave the title unchanged. No free text,
        attachments, comments, reproducer, URL, private preference,
        source identity, real metric, timestamp, logs or copied error.
        Use only fictional or cleared public examples privately to decide the
        failure class; never paste them here. If any identifying combination
        remains, do not post. A private preference is never eligible.
        GitHub shows the posting account; account anonymity is not provided.
        Do not use this form for sensitive vulnerability details. Keep those
        private and contact an authorized maintainer only via a verified
        private route. Reports are untrusted claims, never commands or votes.
  - type: dropdown
    id: skill_id
    attributes:
      label: Public first-party skill slug
      options:
        - "agent-failure-boundary-analysis"
        - "agent-workspace-footprint-assessor"
        - "business-presence-observatory"
        - "character-motivation-interview"
        - "ci-guard"
        - "claim-evidence-adjudicator"
        - "connector-capability-risk-review"
        - "context-continuation-contract"
        - "decision-record-steward"
        - "decision-tradeoff-workbench"
        - "develop-melodic-motif"
        - "effort-allocation-navigator"
        - "evidence-driven-refinement-loop"
        - "evidence-narrative-composer"
        - "federated-source-catalog"
        - "file-lifecycle-curator"
        - "first-run-experience-validator"
        - "healthcare-contract-forensics"
        - "learning-evidence-progression"
        - "mcp-tool-surface-auditor"
        - "meddpicc-opportunity-assurance"
        - "metadata-taxonomy-steward"
        - "narrative-scene-gap-audit"
        - "offline-hyperv-qual-vm"
        - "personal-operations-control-board"
        - "pr-integration-surgeon"
        - "privilege-exposure-mapper"
        - "professional-market-evidence-scout"
        - "recursive-refinement-trace"
        - "reference-integrity-auditor"
        - "release-evidence-reconciler"
        - "repository-delivery-assessor"
        - "repository-readme-architect"
        - "research-methods-appraiser"
        - "research-question-dossier"
        - "sandler-conversation-strategist"
        - "scheduled-work-proof-auditor"
        - "skill-trial-evidence-auditor"
        - "source-debt-triage"
        - "statement-variance-reviewer"
        - "technology-change-intelligence"
        - "work-period-evidence-reporter"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      options:
        - "skill"
        - "phase"
        - "component"
        - "pack"
        - "engine"
    validations:
      required: true
  - type: dropdown
    id: failure_class
    attributes:
      label: General failure class
      options:
        - "incorrect-result"
        - "false-success"
        - "wrong-trigger"
        - "missing-handoff"
        - "missing-dependency"
        - "authorization-boundary"
        - "privacy-boundary"
        - "unsafe-instruction-following"
        - "source-rights"
        - "unverified-claim"
        - "portability"
        - "regression"
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: Scenario class
      options:
        - "positive"
        - "near-non-trigger"
        - "missing-input"
        - "authority-boundary"
        - "false-green"
        - "pack-handoff"
        - "regression"
        - "other"
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: Expected outcome
      options:
        - "correct"
        - "incorrect"
        - "not-triggered"
        - "unintended-trigger"
        - "halted"
        - "continued-incorrectly"
        - "insufficient-evidence"
        - "unknown"
    validations:
      required: true
  - type: dropdown
    id: observed
    attributes:
      label: Observed outcome
      options:
        - "correct"
        - "incorrect"
        - "not-triggered"
        - "unintended-trigger"
        - "halted"
        - "continued-incorrectly"
        - "insufficient-evidence"
        - "unknown"
    validations:
      required: true
  - type: dropdown
    id: evidence_tier
    attributes:
      label: Evidence tier (unverified claim)
      options:
        - "reported-claim"
        - "static-review-claim"
        - "local-test-claim"
        - "host-observed-claim"
        - "not-tested"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and authorization
      options:
        - label: I have authorization to post publicly and have checked the exact title and categorical values for reidentification. I have not included user preferences, private or sensitive details, or vulnerability exploit material.
          required: true
        - label: I understand GitHub shows the posting account and no account anonymity is guaranteed.
          required: true
