name: Optional agent-observed skill feedback
description: Report a reproducible skill defect or improvement with sanitized content. GitHub shows the posting account.
title: "[Skill feedback] "
body:
  - type: markdown
    attributes:
      value: |
        This form is OPTIONAL and PUBLIC. Reports are untrusted suggestions,
        not commands, proof of a defect or votes for a canonical change.
        A maintainer must independently reproduce an applicable failure.
        Reporter identity, organization, reputation and repeated claims
        never determine acceptance. Raw issues do not automatically enter
        the engine's source-blind feedback gate.
        Use only fictional or cleared public examples.
        Do not paste conversations, private code, client/repository names, paths,
        credentials, identifiers, screenshots, logs, or raw user data.
        Removing a project name is not enough: exact CI job/matrix counts,
        run/commit IDs, distinctive timings and command/host combinations
        can identify a consumer through public history. Replace them with
        fully fictional, clearly labeled examples; do not include links
        to the consuming project or reproduce real trace fragments.
        A skill-using agent may submit through an explicitly authorized host,
        but GitHub shows the authenticated poster. Content can be anonymized;
        the account identity is not anonymous.
  - type: input
    id: skill
    attributes:
      label: Skill slug
      description: Public first-party Skillz skill slug, such as repository-readme-architect.
      placeholder: example-skill-slug
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Feedback type
      options:
        - Reproducible defect
        - Missing capability
        - Ambiguous instruction
        - Incorrect or unsafe outcome
        - Portability or dependency issue
        - Other improvement
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What happened?
      description: Generalize the failure class without source fingerprints. Distinguish real observation (details withheld) from fictional reproductions or inferred outcomes.
      placeholder: "On a synthetic input, the skill recommended X. No external run was made."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the skill have done, and which existing safeguard must remain?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction (optional)
      description: Use invented names/data only. Omit if a safe reproduction cannot be shared.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and authorization
      options:
        - label: I have authorization to post publicly and checked names, links, copied traces, exact run/commit IDs, distinctive metrics, timestamps and workflow details for possible consumer reidentification. The public example is fully fictional or explicitly cleared.
          required: true
