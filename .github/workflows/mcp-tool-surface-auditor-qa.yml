name: MCP Tool Surface Auditor offline contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/authored/mcp-tool-surface-auditor/**'
      - 'registry/skills/local-skills/mcp-tool-surface-auditor.yaml'
      - 'registry/verification/local-skills/mcp-tool-surface-auditor.yaml'
      - '.github/workflows/mcp-tool-surface-auditor-qa.yml'

permissions:
  contents: read

concurrency:
  group: mcp-auditor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run offline MCP observation reconciliation falsifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s skills/authored/mcp-tool-surface-auditor/tests -p 'test_*.py' -v
