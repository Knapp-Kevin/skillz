name: RSI Phase-0 contract

on:
  pull_request:
    paths:
      - 'scripts/qa/recursive-improvement/**'
      - 'tests/recursive-improvement/**'
      - '.github/workflows/rsi-phase0-contract.yml'
  push:
    branches:
      - 'feat/rsi-p0-contract-proofs-20261122'
    paths:
      - 'scripts/qa/recursive-improvement/**'
      - 'tests/recursive-improvement/**'
      - '.github/workflows/rsi-phase0-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Offline Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute adversarial Phase-0 contract fixtures
        run: python -m unittest discover -s tests/recursive-improvement -p 'test_*.py' -v
      - name: Compile validator without third-party imports
        run: python -m py_compile scripts/qa/recursive-improvement/contract.py
