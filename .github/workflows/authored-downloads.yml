name: Authored skill download snapshots
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/authored/**'
      - 'registry/authored-skills-index.json'
      - 'scripts/build-authored-downloads.py'
      - 'scripts/verify-authored-release.py'
      - 'engine/builder/host_compat.py'
      - '.github/workflows/authored-downloads.yml'
  push:
    branches: [main]
    paths:
      - 'skills/authored/**'
      - 'registry/authored-skills-index.json'
      - 'scripts/build-authored-downloads.py'
      - 'scripts/verify-authored-release.py'
      - 'engine/builder/host_compat.py'
      - '.github/workflows/authored-downloads.yml'
permissions:
  contents: read
concurrency:
  group: authored-downloads-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 -B scripts/verify-authored-release.py --self-test
      - run: python3 -B scripts/build-authored-downloads.py --self-test
      - run: python3 -B scripts/build-authored-downloads.py --output "$RUNNER_TEMP/authored-downloads"
  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Knapp-Kevin/skillz' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -B scripts/build-authored-downloads.py --output "$RUNNER_TEMP/authored-downloads"
      - name: Publish complete source-bound snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Compare precisely the same source paths that trigger publication.
          # An unrelated documentation merge must not strand a valid snapshot.
          assert_current_inputs() {
            git fetch --no-tags --depth=1 origin refs/heads/main || exit 1
            live="$(git rev-parse FETCH_HEAD)" || exit 1
            if git diff --quiet "$GITHUB_SHA" "$live" -- \
              skills/authored/ registry/authored-skills-index.json \
              scripts/build-authored-downloads.py scripts/verify-authored-release.py \
              engine/builder/host_compat.py \
              .github/workflows/authored-downloads.yml; then
              return 0
            else
              rc=$?
              if [ "$rc" -ne 1 ]; then
                echo "Cannot verify current publication inputs."
                exit "$rc"
              fi
              echo "Superseded publication inputs; leaving snapshot unpublished."
              exit 0
            fi
          }
          assert_current_inputs
          tag="authored-$GITHUB_SHA"
          directory="$RUNNER_TEMP/authored-downloads"
          # Verify any pre-existing tag rather than silently publishing under
          # a tag pointing to a different source commit. Annotated tags use
          # their peeled commit; a missing tag is allowed only before publish.
          check_tag() {
            refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")" || exit 1
            if [ -z "$refs" ]; then
              [ "$1" = optional ] || { echo "Published tag missing"; exit 1; }
              return
            fi
            actual="$(printf '%s\n' "$refs" | awk -v tag="refs/tags/$tag" '$2 == tag {direct=$1} $2 == tag "^{}" {peeled=$1} END {print (peeled ? peeled : direct)}')"
            [ "$actual" = "$GITHUB_SHA" ] || { echo "Release tag source mismatch"; exit 1; }
          }
          check_tag optional
          python3 -B scripts/verify-authored-release.py --prepare --directory "$directory" --repo "$GH_REPO" --tag "$tag" --commit "$GITHUB_SHA"
          assert_current_inputs
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          case "$draft" in
            true) check_tag optional; gh release edit "$tag" --draft=false --latest ;;
            false) echo "Already published; verified without changing it" ;;
            *) echo "Unexpected release state"; exit 1 ;;
          esac
          check_tag required
          gh release view "$tag" --json isDraft,url,tagName,assets --jq '{isDraft,url,tagName,assetCount:(.assets|length)}'
          # Confirm the anonymous public latest route serves the same manifest
          # and the README's first-use example, not just an API-visible release.
          for asset in authored-download-manifest.json effort-allocation-navigator.zip; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --max-time 30 \
              "https://github.com/$GH_REPO/releases/download/$tag/$asset" \
              --output "$RUNNER_TEMP/pinned-$asset"
            cmp "$directory/$asset" "$RUNNER_TEMP/pinned-$asset"
            echo "Verified public source-pinned download: $asset"
            # A successful HTTP response can still be an older cached latest.
            # Retry the byte comparison, not merely transport errors.
            matched=false
            for attempt in 1 2 3; do
              assert_current_inputs
              if curl --fail --silent --show-error --location --max-time 30 \
                "https://github.com/$GH_REPO/releases/latest/download/$asset" \
                --output "$RUNNER_TEMP/public-$asset" && \
                cmp -s "$directory/$asset" "$RUNNER_TEMP/public-$asset"; then
                matched=true
                break
              fi
              sleep 2
            done
            [ "$matched" = true ] || { echo "Public latest bytes do not match: $asset"; exit 1; }
            echo "Verified public latest download: $asset"
          done
