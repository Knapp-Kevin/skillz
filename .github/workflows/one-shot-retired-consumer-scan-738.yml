name: One-shot full retired-skill consumer route audit
on:
  push:
    branches: [feat/retired-skill-full-consumer-audit-738]
    paths:
      - .github/workflows/one-shot-retired-consumer-scan-738.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Run real offline consumer tests
        run: node --test scripts/qa/test-retired-skill-consumers.mjs scripts/qa/test-retired-skill-routes.mjs
      - name: Verify integrated authored, capability and retired consumer guards
        run: |
          node --check scripts/qa/check-authored-capability-links.mjs
          node scripts/qa/check-authored-capability-links.mjs
      - name: Verify CI Guard corrected authored index source pin
        run: |
          node - <<'JS'
          const fs = require('fs');
          const a = require('./registry/authored-skills-index.json').skills.find(x => x.id === 'ci-guard');
          const c = require('./registry/capability-directory.json').skill_records.find(x => x.id === 'local-skills/ci-guard');
          if (a.skill_blob_sha !== c.content_blob_sha || a.package_tree_sha !== c.complete_package_tree_sha || a.package_version !== '1.3.0')
            throw Error('CI Guard v1.3 source identity mismatch');
          console.log('CI Guard source identity reconciled');
          JS
      - name: Scan complete source checkout for stale active consumers
        run: |
          node scripts/qa/check-retired-skill-consumers.mjs
