name: Repository README Architect offline contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/authored/repository-readme-architect/**'
      - '.github/workflows/readme-architect-qa.yml'

permissions:
  contents: read

concurrency:
  group: readme-architect-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    # A draft or unrelated change spends no README-checker runner allocation.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Run complete standalone README Architect package tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s skills/authored/repository-readme-architect/tests -p 'test_*.py' -v
