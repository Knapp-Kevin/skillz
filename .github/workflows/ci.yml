name: CI

# Automatic GitHub Actions are intentionally disabled while the repository's
# Actions budget is unavailable. Run this workflow manually only when budget
# and validation intent are explicitly available.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Behavior tests
        run: node --test "tests/*.test.mjs"

      - name: Skill audit
        run: node skills/skill-audit/scripts/audit.ts

      - name: Skill risk audit
        run: node skills/skill-audit/scripts/risk-audit.ts

      - name: Index freshness
        run: |
          node scripts/build-index.ts
          git diff --exit-code INDEX.md index.json
