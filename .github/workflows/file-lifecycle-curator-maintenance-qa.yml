name: File Lifecycle Curator incremental-maintenance contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/authored/file-lifecycle-curator/**'
      - 'registry/skills/local-skills/file-lifecycle-curator.yaml'
      - 'registry/verification/local-skills/file-lifecycle-curator.yaml'
      - '.github/workflows/file-lifecycle-curator-maintenance-qa.yml'

permissions:
  contents: read

concurrency:
  group: file-curator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-maintenance:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Qualify synthetic incremental reconciliation and refusal states
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s skills/authored/file-lifecycle-curator/tests -p 'test_*.py' -v
          python3 -B skills/authored/file-lifecycle-curator/scripts/reconcile.py \
            --previous skills/authored/file-lifecycle-curator/examples/maintenance-previous.json \
            --current skills/authored/file-lifecycle-curator/examples/maintenance-current.json
