name: One-shot quantized kernel source claim adjudication #728
on:
  push:
    branches: [review/kernel-skills-quantization-correctness-728]
    paths:
      - scripts/qa/test-quantized-kernel-claims.py
      - .github/workflows/one-shot-quantized-kernel-review-728.yml
permissions:
  contents: write
jobs:
  cpu-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Skillz candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          submodules: false
      - name: Checkout exact external source as untrusted data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tensormux/kernel-skills
          ref: 7b7337a123f8711aa8e3d0452351d8fd30dde4b7
          path: untrusted-kernel-source
          submodules: false
          persist-credentials: false
      - name: Execute original CPU-only mathematical counterexamples
        run: python3 scripts/qa/test-quantized-kernel-claims.py -v
      - name: Inspect pinned source text and create bounded evidence receipt
        run: |
          python3 scripts/qa/test-quantized-kernel-claims.py \
            --source-root untrusted-kernel-source \
            --receipt docs/evals/receipts/2026-11-20-kernel-skills-quantization-cpu-adjudication.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('docs/evals/receipts/2026-11-20-kernel-skills-quantization-cpu-adjudication.json').read_text())
          assert receipt['source']['tree']=='01ac1803e1046fe2883a1bd089d70aa817ddc8d8'
          assert len(receipt['source']['packages'])==3
          assert receipt['checks']['first_symmetric_int32_overflow_k']==133145
          assert receipt['checks']['131072_symmetric_accumulation_would_overflow'] is False
          assert all(x is False for x in receipt['acceptance'].values() if type(x) is bool)
          assert receipt['acceptance']['new_governed_skills_admitted']==0
          print('PINNED_SOURCE_AND_CPU_REFERENCE_CONTROLS: PASS')
          PY
      - name: Commit only generated passive review receipt
        run: |
          test "$(git branch --show-current)" = "review/kernel-skills-quantization-correctness-728"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evals/receipts/2026-11-20-kernel-skills-quantization-cpu-adjudication.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "test(kernel): record CPU-only exact-pin quantization adjudication receipt"
          git push origin HEAD:refs/heads/review/kernel-skills-quantization-correctness-728
