name: One-shot exporter qualification 726
on:
  push:
    branches:
      - fix/export-entrypoint-blob-identity-726
permissions:
  contents: read
jobs:
  export-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Install isolated maintenance dependencies
        run: |
          python3 -m venv /tmp/skillz-export-qa-venv
          /tmp/skillz-export-qa-venv/bin/pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Execute exact fixture and full population tests
        run: |
          /tmp/skillz-export-qa-venv/bin/python scripts/qa/test-skill-mason-catalog.py -v
          /tmp/skillz-export-qa-venv/bin/python scripts/qa/test-skill-mason-export-identity.py -v
      - name: Build full checked-out corpus and qualify immutable candidate
        run: |
          /tmp/skillz-export-qa-venv/bin/python - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location("catalog", root / "scripts/build-skill-mason-catalog.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          old = root / "registry/exports/skill-mason-v1"
          pinned = {
              name: hashlib.sha256((old / name).read_bytes()).hexdigest()
              for name in ("manifest.json", "governed.ndjson", "discovery-manifests.json")
          }
          outputs, manifest = mod.build(root, commit, tree)
          assert manifest["counts"]["governed_records"] == 1047, manifest["counts"]
          archived = manifest["historical_review_companions"]
          assert archived["count"] == 22, archived["count"]
          assert len(archived["entries"]) == 22
          for entry in manifest["artifacts"]:
              raw = outputs[entry["path"]]
              assert len(raw) == entry["bytes"]
              assert hashlib.sha256(raw).hexdigest() == entry["sha256"]
          records = [json.loads(line) for line in outputs["governed.ndjson"].splitlines()]
          identities = {row["record_id"]: row for row in records}
          assert len(identities) == len(records)
          assert all(x["review"]["semantic_status"] != "retired" for x in records)
          frontend = identities["anthropic-skills/frontend-design"]["identity"]
          assert frontend["entrypoint_git_blob_sha1"] == "a5333457c414d20d625f307df945842c0952ecc3"
          assert frontend["package_git_tree_sha1"] == "d79e2a5bb4df4a386c2adcdd9ab8709bba28c3f6"
          original = {row["record_id"]: row for row in
                      map(json.loads, (old / "governed.ndjson").read_text().splitlines())}
          before, after = set(original), set(identities)
          delta = {
              "added": sorted(after - before),
              "removed": sorted(before - after),
              "changed": sorted(k for k in before & after if original[k] != identities[k]),
              "unchanged_count": sum(original[k] == identities[k] for k in before & after),
          }
          mod.write_handoff(root, outputs, "skill-mason-v2")
          mod.write_handoff(root, outputs, "skill-mason-v2", check=True)
          for name, digest in pinned.items():
              assert hashlib.sha256((old / name).read_bytes()).hexdigest() == digest
          print("QUALIFIED_CANDIDATE", json.dumps({
              "commit": commit, "tree": tree,
              "governed": len(records), "historical_excluded": archived["count"],
              "source_files": len(manifest["source_files"]),
              "old_v1_unchanged": True,
              "delta_counts": {k: len(v) if isinstance(v, list) else v for k, v in delta.items()},
              "delta_added_ids": delta["added"], "delta_removed_ids": delta["removed"],
              "artifact_sha256": {k: hashlib.sha256(v).hexdigest() for k,v in outputs.items()},
          }, sort_keys=True))
          PY
