name: Engine authoring and refinement contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'engine/**'
      - 'AGENT_START_HERE.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'scripts/qa/test-readme-onboarding.py'
      - 'docs/consumer-discovery-and-installation.md'
      - 'docs/evaluation-framework.md'
      - 'docs/skill-template.md'
      - 'docs/evals/single-skill-build-acceptance.md'
      - 'scripts/qa/test-engine-contracts.py'
      - 'scripts/qa/test-engine-refinement-cases.py'
      - 'scripts/qa/test-engine-packs.py'
      - 'scripts/qa/test-engine-builder.py'
      - 'scripts/qa/test-engine-builder-design.py'
      - 'scripts/qa/test-engine-feedback-boundary.py'
      - 'scripts/qa/test-host-compatibility.py'
      - 'scripts/qa/test-host-acceptance.py'
      - 'scripts/qa/test-acceptance-plan.py'
      - 'docs/getting-started-with-skills.md'
      - 'skills/authored/**'
      - 'registry/authored-skills-index.json'
      - 'scripts/qa/test_sales_methodology_contract.py'
      - '.github/workflows/engine-contracts-qa.yml'

permissions:
  contents: read

concurrency:
  group: engine-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-engine-contracts:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Focused offline engine checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/qa/test-readme-onboarding.py
          python3 -B scripts/qa/test-engine-contracts.py
          python3 -B scripts/qa/test-engine-refinement-cases.py
          python3 -B scripts/qa/test-engine-packs.py
          python3 -B scripts/qa/test-engine-builder.py
          python3 -B scripts/qa/test-engine-builder-design.py
          python3 -B scripts/qa/test-engine-feedback-boundary.py
          python3 -B scripts/qa/test-host-compatibility.py
          python3 -B scripts/qa/test-host-acceptance.py
          python3 -B scripts/qa/test-acceptance-plan.py
          python3 -B scripts/qa/test_sales_methodology_contract.py
      - name: Full authored host packaging matrix and admission gate
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python3 -B engine/builder/host_compat.py --all --require-authored-ready > /tmp/host-matrix.json || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "Unexpected audit failure: $rc" >&2
            exit "$rc"
          fi
          python3 - <<'PY'
          import json, os
          with open('/tmp/host-matrix.json', encoding='utf-8') as f:
              result = json.load(f)
          lines = [
              '## Authored host packaging preflight (not host execution)',
              '',
              f'Canonical skills: {result["canonical_skill_count"]}',
              '',
              '| Host | Package ready | Package holds |',
              '| --- | ---: | ---: |',
          ]
          for host, status in result['summary'].items():
              lines.append(f'| {host} | {status["ready"]} | {status["hold"]} |')
          held = [r for r in result['results'] if not r['package_ready']]
          lines.extend(['', f'Unqualified skill-host pairs: {len(held)}. '
                        'These are **not** validated host failures.',
                        'Host load, real script execution and consumer acceptance: NOT TESTED.'])
          lines.extend(['', 'Admission: ' + result['authored_admission']['status'],
                        'Unassessed hosts: ' + ', '.join(sorted(result['unassessed_hosts'])),
                        'Unexpected holds: ' + str(len(result['authored_admission']['unexpected_holds'])),
                        '', '### Exact static holds'])
          for item in held:
              reason = ', '.join(item['blockers']) if item['blockers'] else 'UNKNOWN'
              lines.append(f'- {item["host"]} / {item["skill"]}: {reason}')
          for item in result['authored_admission']['unexpected_holds']:
              lines.append(f'- Admission blocker {item["host"]} / {item["skill"]}: {", ".join(item["blockers"])}')
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(report)
          PY
          exit "$rc"
