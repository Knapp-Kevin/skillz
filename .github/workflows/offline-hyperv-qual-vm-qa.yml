name: Offline Hyper-V qualification VM source contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'skills/authored/offline-hyperv-qual-vm/**'
      - 'registry/skills/local-skills/offline-hyperv-qual-vm.yaml'
      - 'registry/verification/local-skills/offline-hyperv-qual-vm.yaml'
      - '.github/workflows/offline-hyperv-qual-vm-qa.yml'

permissions:
  contents: read

concurrency:
  group: hyperv-qual-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-source-contracts:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check offline hypervisor source boundaries (NOT Windows execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s skills/authored/offline-hyperv-qual-vm/tests -p 'test_*.py' -v
