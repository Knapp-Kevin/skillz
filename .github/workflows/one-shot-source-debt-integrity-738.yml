name: One-shot Source Debt v1.2 integrity and focused qualification
on:
  push:
    branches: [feature/source-debt-executable-harvest-738-20261120]
    paths:
      - .github/workflows/one-shot-source-debt-integrity-738.yml
permissions:
  contents: read
jobs:
  source-and-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source under evaluation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: Classify changes before checks
        run: |
          # This one-shot workflow's only triggering file is its own CI policy.
          # CI-policy edits ALWAYS require the full bounded suite below.
          # No docs-only or reduced route can apply to the guarded trigger.
          echo "CHANGE_CLASS=WORKFLOW_POLICY; SELECTED=ALL_FOCUSED_QUALIFICATION"
      - name: Validate actual executable source method
        run: |
          cd skills/authored/source-debt-triage
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s examples -p 'test_harvest.py' -v
      - name: Validate historical retirement and all authored routing
        run: |
          node --test scripts/qa/test-retired-skill-consumers.mjs scripts/qa/test-retired-skill-routes.mjs
          node scripts/qa/check-authored-capability-links.mjs
      - name: Verify exact package Git blobs and current controlled evidence
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          p='skills/authored/source-debt-triage'
          authored=json.loads(Path('registry/authored-skills-index.json').read_text())
          skill=next(s for s in authored['skills'] if s['id']=='source-debt-triage')
          def obj(path):
              return subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          assert obj(p+'/SKILL.md')==skill['skill_blob_sha']
          assert obj(p)==skill['package_tree_sha']
          assert skill['package_file_count']==5 and skill['package_version']=='1.2.0'
          assert skill['review_score']=='19/20' and skill['behavioral_validation']=='not-run'
          host=json.loads(Path('registry/evaluation/frostwulf-paired-host-status-20261118.json').read_text())
          row=next(x for x in host['entries'] if x['legacy_entrypoint']=='skills/todo-harvester/SKILL.md')
          assert row['current_successor_source_method']['package_tree']==skill['package_tree_sha']
          assert row['host_validation_state']=='NOT_RUN'
          assert host['counts']['improvement_1_5x_proven']==0
          print('SOURCE_AND_HISTORICAL_EVIDENCE_PASS',skill['package_version'],skill['skill_blob_sha'])
          PY
