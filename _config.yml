# Deny by default. Jekyll checks include before exclude. Only Workbench
# landing pages, application files and notices are permitted. No upstream
# packages, reference content, registry, or repository documentation.
exclude:
  - "*"
include:
  - "docs"
  - "workbench"
  - "index.html"
  - "app.js"
  - "core.js"
  - "catalog.js"
  - "workbench.css"
  - "LICENSE.txt"
  - "RIGHTS.txt"
